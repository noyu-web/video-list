<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>名義管理</title>
<style>
:root{--pink:#e8789f;--pink-dark:#b03a6a;--pink-light:#f4cfdd;--bg:#fff5f8;--text:#4b5563;--gray:#9ca3af}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;padding-bottom:90px}
header{background:#fff;border-bottom:2px solid var(--pink-light);padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0;position:sticky;top:0;z-index:20}
h1{margin:0 0 10px;font-size:17px;color:var(--pink-dark)}
.tabs{display:flex}.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:10px 0;font-size:15px;font-weight:700;color:var(--gray)}
.tabs button.on{color:var(--pink);border-bottom-color:var(--pink)}
main{padding:12px 14px}
button{font-family:inherit;border-radius:0}
.btn{background:var(--pink);color:#fff;border:0;padding:11px 16px;font-size:14px;font-weight:700}
.btn.sub{background:#fff;color:var(--pink-dark);border:1px solid var(--pink-light)}
.btn.del{background:#fde8ee;color:#b91c1c}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input,select,textarea{width:100%;border:1px solid var(--pink-light);background:#fff;padding:10px;font-size:15px;font-family:inherit;border-radius:0;color:var(--text)}
.card{background:#fff;border:1px solid var(--pink-light);padding:12px;margin-bottom:10px}
.card .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .n{font-size:16px;font-weight:800}
.tag{display:inline-block;font-size:11px;padding:2px 8px;background:#fde8ee;color:var(--pink-dark);margin-right:4px}
.tag.ok{background:#dcfce7;color:#166534}.tag.ng{background:#e5e7eb;color:#6b7280}.tag.warn{background:#fef3c7;color:#92400e}
.sm{font-size:12px;color:var(--gray);margin-top:4px;line-height:1.5}
.alert{background:#fef3c7;color:#92400e;padding:10px 12px;margin-bottom:12px;font-size:13px;line-height:1.6}
.ov{position:fixed;inset:0;background:rgba(75,85,99,.4);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.ov.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 6px;font-size:16px;color:var(--pink-dark)}
label{display:block;font-size:12px;font-weight:700;color:var(--pink-dark);margin:12px 0 4px}
.row{display:flex;gap:8px}.row>div{flex:1;min-width:0}
.foot{display:flex;gap:8px;margin-top:16px}.foot .btn{flex:1}
.sum{display:flex;gap:8px;margin-bottom:12px}.sum div{flex:1;background:#fff;border:1px solid var(--pink-light);padding:10px;text-align:center}
.sum b{display:block;font-size:20px;color:var(--pink-dark)}.sum span{font-size:11px;color:var(--gray)}
.empty{text-align:center;color:var(--gray);padding:30px 0;font-size:14px}
textarea{min-height:120px}
</style></head><body>
<header><h1>名義管理</h1>
<div class="tabs"><button id="tabS" class="on">自分で使用</button><button id="tabG">譲っている</button><button id="tabA">申込</button></div></header>
<main>
<div id="alerts"></div>
<section id="vM">
<div class="bar"><button class="btn" id="addM">名義を追加</button><button class="btn sub" id="bk">バックアップ</button></div>
<div class="row" style="margin-bottom:12px"><div><select id="fK"></select></div><div style="flex:0 0 auto"><button class="btn sub" id="kEdit" style="padding:11px 14px">区分を編集</button></div></div>
<div id="listM"></div>
</section>
<section id="vA" hidden>
<div class="sum" id="sumA"></div>
<div class="bar"><button class="btn" id="addA">申込を追加</button></div>
<div class="row" style="margin-bottom:12px"><div><select id="fM"><option value="">名義すべて</option></select></div><div><select id="fR"><option value="">結果すべて</option></select></div></div>
<input id="fQ" placeholder="公演名で検索" style="margin-bottom:12px">
<div id="listA"></div>
</section>
</main>

<div class="ov hidden" id="ovM"><div class="sheet">
<h2 id="tM">名義</h2>
<label>名義の名前</label><input id="mName">
<div class="row"><div><label>区分</label><select id="mKind"></select></div>
<div><label>会員期限</label><input id="mExp" type="date"></div></div>
<label>会員番号など（任意）</label><input id="mNo">
<label>使い方</label><select id="mUse"><option>自分で使用</option><option>相手に譲っている</option></select>
<div id="mToW"><label>譲っている相手</label><input id="mTo" placeholder="相手の名前・呼び名"></div>
<label>メモ</label><textarea id="mMemo" style="min-height:70px"></textarea>
<div class="foot"><button class="btn sub" id="mCancel">閉じる</button><button class="btn del" id="mDel">削除</button><button class="btn" id="mSave">保存</button></div>
</div></div>

<div class="ov hidden" id="ovK"><div class="sheet">
<h2>区分の編集</h2>
<div class="sm">名前を直すと、その区分の名義も同じ名前に変わります。削除しても、名義は残ります。</div>
<div id="kList"></div>
<div class="bar" style="margin-top:12px"><button class="btn sub" id="kAdd">区分を追加</button></div>
<div class="foot"><button class="btn sub" id="kClose">閉じる</button><button class="btn" id="kSave">保存</button></div>
</div></div>

<div class="ov hidden" id="ovA"><div class="sheet">
<h2>申込</h2>
<label>公演・イベント名</label><input id="aTitle">
<div class="row"><div><label>日付</label><input id="aDate" type="date"></div><div><label>名義</label><select id="aM"></select></div></div>
<div class="row"><div><label>申込先</label><select id="aWhere"><option>FC先行</option><option>一般</option><option>プレリク</option><option>ローチケ</option><option>イープラス</option><option>その他</option></select></div>
<div><label>枚数</label><input id="aCnt" type="number" min="1" value="1"></div></div>
<label>結果</label><select id="aRes"><option>申込済</option><option>当選</option><option>落選</option><option>入金済</option><option>発券済</option><option>キャンセル</option></select>
<label>メモ</label><textarea id="aMemo" style="min-height:70px"></textarea>
<div class="foot"><button class="btn sub" id="aCancel">閉じる</button><button class="btn del" id="aDel">削除</button><button class="btn" id="aSave">保存</button></div>
</div></div>

<div class="ov hidden" id="ovB"><div class="sheet">
<h2>バックアップ</h2>
<div class="sm">データはこの端末のブラウザの中だけに保存されています。機種変更やデータ消去に備えて、書き出した文字を保存しておいてください。</div>
<label>書き出し</label><textarea id="bOut" readonly></textarea>
<div class="foot"><button class="btn sub" id="bCopy">コピー</button></div>
<label>読み込み（ここに貼り付けて「読み込む」。今のデータは置き換わります）</label><textarea id="bIn"></textarea>
<div class="foot"><button class="btn sub" id="bClose">閉じる</button><button class="btn" id="bLoad">読み込む</button></div>
</div></div>

<script>
const KEY='meigi_data_v1';
let D={m:[],a:[],k:['FC','ローチケ','イープラス','チケットぴあ','その他']};
try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.m)&&Array.isArray(x.a)){D=x;if(!Array.isArray(D.k)||!D.k.length)D.k=['FC','ローチケ','イープラス','チケットぴあ','その他'];}}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch{}}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let curTab='S';const kinds=()=>{const l=[...D.k];D.m.forEach(m=>{if(m.kind&&!l.includes(m.kind))l.push(m.kind);});return l;};
const RES=['申込済','当選','落選','入金済','発券済','キャンセル'];
const WON=new Set(['当選','入金済','発券済']);
let eM=null,eA=null;
function days(d){if(!d)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(d+'T00:00:00')-t)/86400000);}
function mName(id){const m=D.m.find(x=>x.id===id);return m?m.name:'（削除済み）';}
function renderAlerts(){
const l=[];D.m.forEach(m=>{const d=days(m.exp);if(d===null)return;if(d<0)l.push(m.name+'：会員期限が切れています（'+m.exp+'）');else if(d<=30)l.push(m.name+'：会員期限まであと'+d+'日（'+m.exp+'）');});
$('alerts').innerHTML=l.length?'<div class="alert">'+l.map(esc).join('<br>')+'</div>':'';
}
function stat(id){const a=D.a.filter(x=>x.m===id);const w=a.filter(x=>WON.has(x.res)).length;const dec=a.filter(x=>x.res!=='申込済'&&x.res!=='キャンセル').length;return{n:a.length,w,dec};}
function renderM(){
const fk=$('fK');const ck=fk.value;fk.innerHTML='<option value="">区分すべて</option>'+kinds().map(k=>'<option>'+k+'</option>').join('');fk.value=ck;
const want=curTab==='G'?'相手に譲っている':'自分で使用';
const ml=D.m.filter(m=>(m.use||'自分で使用')===want&&(!ck||m.kind===ck));
$('listM').innerHTML=ml.length?ml.map(m=>{const s=stat(m.id);const d=days(m.exp);
const exp=m.exp?'<span class="tag'+(d!==null&&d<0?' ng':d!==null&&d<=30?' warn':'')+'">期限 '+esc(m.exp)+'</span>':'';
return '<div class="card" data-m="'+m.id+'"><div class="h"><span class="n">'+esc(m.name)+'</span><span><span class="tag">'+esc(m.kind)+'</span>'+exp+'</span></div>'
+((m.use||'')==='相手に譲っている'&&m.to?'<div class="sm">譲り先　'+esc(m.to)+'</div>':'')
+'<div class="sm">申込 '+s.n+'件　当選 '+s.w+'件'+(s.dec?'（当選率 '+Math.round(s.w/s.dec*100)+'%）':'')+'</div>'
+(m.no?'<div class="sm">会員番号 '+esc(m.no)+'</div>':'')+(m.memo?'<div class="sm">'+esc(m.memo)+'</div>':'')+'</div>';}).join(''):'<div class="empty">'+(curTab==='G'?'譲っている名義がありません':'名義がありません')+'</div>';
}
function renderA(){
const fm=$('fM'),fr=$('fR');const cm=fm.value,cr=fr.value;
fm.innerHTML='<option value="">名義すべて</option>'+D.m.map(m=>'<option value="'+m.id+'">'+esc(m.name)+'</option>').join('');fm.value=cm;
fr.innerHTML='<option value="">結果すべて</option>'+RES.map(r=>'<option>'+r+'</option>').join('');fr.value=cr;
const q=$('fQ').value.trim().toLowerCase();
const l=D.a.filter(x=>(!cm||x.m===cm)&&(!cr||x.res===cr)&&(!q||(x.title||'').toLowerCase().includes(q))).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
const all=D.a.length,w=D.a.filter(x=>WON.has(x.res)).length,dec=D.a.filter(x=>x.res!=='申込済'&&x.res!=='キャンセル').length;
$('sumA').innerHTML='<div><b>'+all+'</b><span>申込</span></div><div><b>'+w+'</b><span>当選</span></div><div><b>'+(dec?Math.round(w/dec*100)+'%':'-')+'</b><span>当選率</span></div>';
$('listA').innerHTML=l.length?l.map(x=>'<div class="card" data-a="'+x.id+'"><div class="h"><span class="n">'+esc(x.title)+'</span><span class="tag'+(WON.has(x.res)?' ok':x.res==='落選'||x.res==='キャンセル'?' ng':'')+'">'+esc(x.res)+'</span></div>'
+'<div class="sm">'+(x.date?esc(x.date)+'　':'')+esc(mName(x.m))+'　'+esc(x.where)+'　'+esc(x.cnt)+'枚</div>'+(x.memo?'<div class="sm">'+esc(x.memo)+'</div>':'')+'</div>').join(''):'<div class="empty">申込がありません</div>';
}
function show(t){curTab=t;$('vM').hidden=t==='A';$('vA').hidden=t!=='A';$('tabS').classList.toggle('on',t==='S');$('tabG').classList.toggle('on',t==='G');$('tabA').classList.toggle('on',t==='A');if(t==='A')renderA();else renderM();}
$('tabS').onclick=()=>show('S');$('tabG').onclick=()=>show('G');$('tabA').onclick=()=>show('A');
['fM','fR'].forEach(i=>$(i).onchange=renderA);$('fQ').oninput=renderA;
function openM(m){eM=m||null;$('mName').value=m?m.name:'';$('mKind').innerHTML=kinds().map(k=>'<option>'+esc(k)+'</option>').join('');$('mKind').value=m&&m.kind?m.kind:kinds()[0];$('mExp').value=m?m.exp||'':'';$('mNo').value=m?m.no||'':'';$('mUse').value=m&&m.use?m.use:(curTab==='G'?'相手に譲っている':'自分で使用');$('mTo').value=m?m.to||'':'';togTo();$('mMemo').value=m?m.memo||'':'';$('mDel').style.display=m?'':'none';$('ovM').classList.remove('hidden');}
let kRows=[];
function kRender(){$('kList').innerHTML=kRows.map((r,i)=>'<div class="row" style="margin-top:8px"><div><input data-ki="'+i+'" value="'+esc(r.n)+'"></div><div style="flex:0 0 auto"><button class="btn del" data-kd="'+i+'" style="padding:11px 14px">削除</button></div></div>').join('');}
$('kEdit').onclick=()=>{kRows=D.k.map(n=>({o:n,n}));kRender();$('ovK').classList.remove('hidden');};
$('kList').oninput=e=>{const i=e.target.dataset.ki;if(i!==undefined)kRows[i].n=e.target.value;};
$('kList').onclick=e=>{const i=e.target.dataset.kd;if(i!==undefined){kRows.splice(i,1);kRender();}};
$('kAdd').onclick=()=>{kRows.push({o:null,n:''});kRender();const l=$('kList').querySelectorAll('input');if(l.length)l[l.length-1].focus();};
$('kClose').onclick=()=>$('ovK').classList.add('hidden');
$('kSave').onclick=()=>{const seen=new Set();const out=[];kRows.forEach(r=>{const n=r.n.trim();if(!n||seen.has(n))return;seen.add(n);out.push(n);if(r.o&&r.o!==n)D.m.forEach(m=>{if(m.kind===r.o)m.kind=n;});});D.k=out;save();$('ovK').classList.add('hidden');renderM();};
function togTo(){$('mToW').style.display=$('mUse').value==='相手に譲っている'?'':'none';}
$('mUse').onchange=togTo;$('fK').onchange=renderM;
$('addM').onclick=()=>openM();$('mCancel').onclick=()=>$('ovM').classList.add('hidden');
$('listM').onclick=e=>{const c=e.target.closest('[data-m]');if(c)openM(D.m.find(x=>x.id===c.dataset.m));};
$('mSave').onclick=()=>{const name=$('mName').value.trim();if(!name){$('mName').focus();return;}
const o={name,kind:$('mKind').value,exp:$('mExp').value,no:$('mNo').value.trim(),use:$('mUse').value,to:$('mUse').value==='相手に譲っている'?$('mTo').value.trim():'',memo:$('mMemo').value.trim()};
if(eM)Object.assign(eM,o);else D.m.push({id:uid(),...o});save();$('ovM').classList.add('hidden');renderAlerts();renderM();};
$('mDel').onclick=()=>{if(!eM)return;if(D.a.some(x=>x.m===eM.id)&&!confirm('この名義の申込記録は残ります。削除しますか？'))return;D.m=D.m.filter(x=>x!==eM);save();$('ovM').classList.add('hidden');renderAlerts();renderM();};
function openA(a){if(!D.m.length){alert('先に名義を追加してください');return;}eA=a||null;
$('aM').innerHTML=D.m.map(m=>'<option value="'+m.id+'">'+esc(m.name)+'</option>').join('');
$('aTitle').value=a?a.title:'';$('aDate').value=a?a.date||'':'';$('aM').value=a?a.m:(D.m[0].id);$('aWhere').value=a?a.where:'FC先行';$('aCnt').value=a?a.cnt:1;$('aRes').value=a?a.res:'申込済';$('aMemo').value=a?a.memo||'':'';$('aDel').style.display=a?'':'none';$('ovA').classList.remove('hidden');}
$('addA').onclick=()=>openA();$('aCancel').onclick=()=>$('ovA').classList.add('hidden');
$('listA').onclick=e=>{const c=e.target.closest('[data-a]');if(c)openA(D.a.find(x=>x.id===c.dataset.a));};
$('aSave').onclick=()=>{const title=$('aTitle').value.trim();if(!title){$('aTitle').focus();return;}
const o={title,date:$('aDate').value,m:$('aM').value,where:$('aWhere').value,cnt:$('aCnt').value||1,res:$('aRes').value,memo:$('aMemo').value.trim()};
if(eA)Object.assign(eA,o);else D.a.push({id:uid(),...o});save();$('ovA').classList.add('hidden');renderA();};
$('aDel').onclick=()=>{if(!eA)return;D.a=D.a.filter(x=>x!==eA);save();$('ovA').classList.add('hidden');renderA();};
$('bk').onclick=()=>{$('bOut').value=JSON.stringify(D);$('bIn').value='';$('ovB').classList.remove('hidden');};
$('bClose').onclick=()=>$('ovB').classList.add('hidden');
$('bCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('bOut').value);}catch{$('bOut').select();}};
$('bLoad').onclick=()=>{try{const x=JSON.parse($('bIn').value);if(!x||!Array.isArray(x.m)||!Array.isArray(x.a))throw 0;if(!confirm('今のデータが置き換わります。よろしいですか？'))return;D=x;save();$('ovB').classList.add('hidden');renderAlerts();show('S');}catch{alert('読み込めませんでした。書き出した文字をそのまま貼り付けてください');}};
renderAlerts();renderM();
</script></body></html>
