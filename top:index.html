<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💎</title>
<style>
:root{
  --pink:#f4a7c0;
  --pink-dark:#e07a9e;
  --pink-light:#fce8ef;
  --bg:#fff8fb;
  --white:#fff;
  --gray:#aaa;
  --border:#f0dde7;
  --text:#333;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

header{
  background:var(--bg);
  padding:0 20px;
  height:52px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;top:0;z-index:100;
  border-bottom:1px solid var(--border);
}
.logo-area{
  font-size:14px;font-weight:700;color:var(--pink-dark);
  cursor:default;user-select:none;
}
.hamburger{
  width:36px;height:36px;
  display:flex;flex-direction:column;justify-content:center;gap:5px;
  cursor:pointer;background:none;border:none;padding:4px;
}
.hamburger span{
  display:block;height:1.5px;background:var(--pink-dark);border-radius:2px;
  transition:all .25s;
}
.hamburger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}

/* ドロワー */
.drawer{
  position:fixed;top:52px;right:0;bottom:0;width:280px;
  background:var(--white);
  box-shadow:-2px 0 16px rgba(0,0,0,.07);
  z-index:99;
  transform:translateX(100%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);
  overflow-y:auto;
}
.drawer.open{transform:translateX(0);}
.drawer-overlay{
  position:fixed;inset:0;top:52px;background:rgba(0,0,0,.15);
  z-index:98;opacity:0;pointer-events:none;transition:opacity .28s;
}
.drawer-overlay.open{opacity:1;pointer-events:auto;}

.drawer-inner{padding:22px 20px 40px;}
.drawer-section{margin-bottom:22px;}
.drawer-section-title{
  font-size:12px;font-weight:700;color:var(--pink);
  letter-spacing:.08em;margin-bottom:10px;
  display:flex;align-items:center;gap:6px;
}
.drawer-text{
  font-size:13px;color:#666;line-height:1.85;
}
.drawer-link{
  display:block;font-size:13px;color:var(--pink-dark);
  text-decoration:none;padding:8px 0;
  border-bottom:1px solid var(--border);
}
.drawer-link:last-child{border-bottom:none;}
.drawer-divider{border:none;border-top:1px solid var(--border);margin:18px 0;}
.edit-btn{
  font-size:11px;background:none;border:1px solid var(--border);
  border-radius:6px;padding:3px 10px;cursor:pointer;color:var(--gray);
  margin-top:6px;display:none;
}
.edit-wrap{display:none;margin-top:8px;}
.edit-textarea{
  width:100%;min-height:90px;font-size:13px;
  padding:8px;border:1.5px solid var(--border);
  border-radius:8px;font-family:inherit;resize:vertical;
  margin-bottom:6px;
}
.edit-save{
  background:var(--pink);color:#fff;border:none;
  border-radius:8px;padding:7px 16px;font-size:13px;
  cursor:pointer;width:100%;
}

/* メイン */
main{padding:32px 20px 60px;max-width:440px;margin:0 auto;}

.section-label{
  font-size:13px;font-weight:800;color:var(--pink-dark);
  letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:16px;
}
.link-card{
  display:block;
  background:var(--white);
  border-radius:12px;
  padding:16px 18px;
  margin-bottom:10px;
  text-decoration:none;color:var(--text);
  border:1.5px solid var(--border);
  font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:space-between;
  transition:border-color .15s;
}
.link-card:active{border-color:var(--pink);}
.link-card-name{font-size:15px;font-weight:700;}
.link-card-arrow{color:var(--pink);font-size:18px;}

.link-url-edit{
  font-size:11px;background:none;border:1px solid var(--border);
  border-radius:6px;padding:2px 8px;cursor:pointer;color:var(--gray);
  margin-left:8px;display:none;vertical-align:middle;
}
</style>
</head>
<body>

<header>
  <div class="logo-area" id="logoArea">💎</div>
  <button class="hamburger" id="hamburger">
    <span></span><span></span><span></span>
  </button>
</header>

<div class="drawer-overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-inner">

    <!-- 見方 -->
    <div class="drawer-section">
      <div class="drawer-section-title">📖 所持リストの見方</div>
      <div class="drawer-text" id="guideView"></div>
      <button class="edit-btn" id="guideEditBtn">✏️ 編集</button>
      <div class="edit-wrap" id="guideEditWrap">
        <textarea class="edit-textarea" id="guideArea"></textarea>
        <button class="edit-save" id="guideSaveBtn">保存</button>
      </div>
      <a class="drawer-link" href="../view-guide/">▶ 使い方スライドを見る</a>
    </div>

    <hr class="drawer-divider">

    <!-- 免責 -->
    <div class="drawer-section">
      <div class="drawer-section-title">⚠️ 免責事項</div>
      <div class="drawer-text" id="disclaimerView"></div>
      <button class="edit-btn" id="disclaimerEditBtn">✏️ 編集</button>
      <div class="edit-wrap" id="disclaimerEditWrap">
        <textarea class="edit-textarea" id="disclaimerArea"></textarea>
        <button class="edit-save" id="disclaimerSaveBtn">保存</button>
      </div>
    </div>

  </div>
</div>

<!-- メイン -->
<main>
  <div style="background:var(--white);border-radius:12px;border:1.5px solid var(--border);padding:16px 18px;margin-bottom:20px">
    <div style="font-size:11px;font-weight:700;color:var(--pink);letter-spacing:.08em;margin-bottom:8px">⚠️ 必読</div>
    <div class="drawer-text" id="mustreadView"></div>
    <button class="edit-btn" id="mustreadEditBtn" style="margin-top:6px">✏️ 編集</button>
    <div class="edit-wrap" id="mustreadEditWrap" style="margin-top:8px">
      <textarea class="edit-textarea" id="mustreadArea"></textarea>
      <button class="edit-save" id="mustreadSaveBtn">保存</button>
    </div>
  </div>

  <div class="section-label" id="sectionLabel">LINK
    <button class="link-url-edit" id="sectionLabelEditBtn">✏️</button>
  </div>

  <div id="linkList">
    <a class="link-card" id="card1" href="#">
      <span class="link-card-name" id="card1Name">求めリスト</span>
      <span class="link-card-arrow">›</span>
    </a>
    <a class="link-card" id="card2" href="#">
      <span class="link-card-name" id="card2Name">所持リスト</span>
      <span class="link-card-arrow">›</span>
    </a>
  </div>

  <!-- 管理者のみ: カード名・URL編集 -->
  <div id="adminCardEdit" style="display:none;margin-top:16px;border:1px solid var(--border);border-radius:10px;padding:14px;background:var(--white)">
    <div style="font-size:12px;font-weight:700;color:var(--pink);margin-bottom:10px">カード編集</div>
    <div style="margin-bottom:8px">
      <div style="font-size:11px;color:var(--gray);margin-bottom:3px">カード1 名前</div>
      <input id="card1NameInput" style="width:100%;padding:6px 8px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;margin-bottom:4px">
      <div style="font-size:11px;color:var(--gray);margin-bottom:3px">カード1 URL</div>
      <input id="card1UrlInput" style="width:100%;padding:6px 8px;border:1.5px solid var(--border);border-radius:7px;font-size:13px">
    </div>
    <div style="margin-bottom:10px">
      <div style="font-size:11px;color:var(--gray);margin-bottom:3px">カード2 名前</div>
      <input id="card2NameInput" style="width:100%;padding:6px 8px;border:1.5px solid var(--border);border-radius:7px;font-size:13px;margin-bottom:4px">
      <div style="font-size:11px;color:var(--gray);margin-bottom:3px">カード2 URL</div>
      <input id="card2UrlInput" style="width:100%;padding:6px 8px;border:1.5px solid var(--border);border-radius:7px;font-size:13px">
    </div>
    <button id="cardsSaveBtn" style="background:var(--pink);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;width:100%">保存</button>
  </div>

</main>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbzcQk2qXHLkun0bAgOYsFJiATESW-eju6s8ZqplZwvxXr94hpmZKmzLqIu5UaHRDTzU/exec';
const ADMIN_PASSWORD='0703clarinet';
let cbIdx=0;
function jsonp(params){
  return new Promise((resolve,reject)=>{
    const name='_cb'+cbIdx++;const s=document.createElement('script');
    const timer=setTimeout(()=>{delete window[name];s.remove();reject();},12000);
    window[name]=(d)=>{clearTimeout(timer);delete window[name];s.remove();resolve(d);};
    s.onerror=()=>{clearTimeout(timer);delete window[name];s.remove();reject();};
    s.src=GAS_URL+'?'+new URLSearchParams({...params,callback:name});
    document.body.appendChild(s);
  });
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// === ドロワー ===
const hamburger=document.getElementById('hamburger');
const drawer=document.getElementById('drawer');
const overlay=document.getElementById('overlay');
function toggleDrawer(){
  const open=drawer.classList.contains('open');
  drawer.classList.toggle('open',!open);
  overlay.classList.toggle('open',!open);
  hamburger.classList.toggle('open',!open);
}
hamburger.addEventListener('click',toggleDrawer);
overlay.addEventListener('click',toggleDrawer);

// === 管理者 ===
let isAdmin=false;
function loadAdmin(){try{isAdmin=sessionStorage.getItem('top_admin')==='1';}catch{}}
function applyAdmin(){
  const els=['mustreadEditBtn','guideEditBtn','disclaimerEditBtn'];
  els.forEach(id=>document.getElementById(id).style.display=isAdmin?'inline-block':'none');
  document.getElementById('adminCardEdit').style.display=isAdmin?'block':'none';
}
let _tap=0,_tapT=null;
document.getElementById('logoArea').addEventListener('click',()=>{
  _tap++;clearTimeout(_tapT);
  _tapT=setTimeout(()=>{_tap=0;},1500);
  if(_tap>=5){
    _tap=0;
    if(isAdmin){isAdmin=false;try{sessionStorage.removeItem('top_admin');}catch{}applyAdmin();}
    else{
      const pw=prompt('パスワード');
      if(pw===ADMIN_PASSWORD){isAdmin=true;try{sessionStorage.setItem('top_admin','1');}catch{}applyAdmin();}
      else if(pw!==null)alert('パスワードが違います');
    }
  }
});

// === コンテンツ ===
const DEFAULTS={
  mustread:'交換に関するご連絡はDMにてお願いします。\nよくご確認の上お問い合わせください。',
  guide:'SixTONESの所持動画をジャンルごとに確認できるリストです。\nジャンルタブ・年タブで絞り込んだり、出演者タグをタップしてまたぎ表示ができます。',
  disclaimer:'このサイトは個人が管理する非公式のリストです。内容の正確性を保証するものではありません。',
  card1Name:'求めリスト',
  card1Url:'./wishlist-app/',
  card2Name:'所持リスト',
  card2Url:'https://noyu-web.github.io/video-list/',
};
let contents={...DEFAULTS};

function renderContents(){
  document.getElementById('mustreadView').innerHTML=esc(contents.mustread).replace(/\n/g,'<br>');
  document.getElementById('guideView').innerHTML=esc(contents.guide).replace(/\n/g,'<br>');
  document.getElementById('disclaimerView').innerHTML=esc(contents.disclaimer).replace(/\n/g,'<br>');
  document.getElementById('card1Name').textContent=contents.card1Name;
  document.getElementById('card2Name').textContent=contents.card2Name;
  document.getElementById('card1').href=contents.card1Url;
  document.getElementById('card2').href=contents.card2Url;
  document.getElementById('card1NameInput').value=contents.card1Name;
  document.getElementById('card1UrlInput').value=contents.card1Url;
  document.getElementById('card2NameInput').value=contents.card2Name;
  document.getElementById('card2UrlInput').value=contents.card2Url;
}

async function loadContents(){
  try{
    const data=await jsonp({action:'getTopContents'});
    if(data&&Object.keys(data).length>0)contents={...DEFAULTS,...data};
  }catch{}
  renderContents();
}

async function saveContents(){
  try{await jsonp({action:'saveTopContents',data:encodeURIComponent(JSON.stringify(contents))});}catch{}
}

function setupEditor(key,editBtnId,wrapId,areaId,saveBtnId,viewId){
  document.getElementById(editBtnId).addEventListener('click',()=>{
    const ew=document.getElementById(wrapId);
    const isOpen=ew.style.display==='block';
    ew.style.display=isOpen?'none':'block';
    if(!isOpen)document.getElementById(areaId).value=contents[key];
  });
  document.getElementById(saveBtnId).addEventListener('click',async()=>{
    contents[key]=document.getElementById(areaId).value;
    document.getElementById(viewId).innerHTML=esc(contents[key]).replace(/\n/g,'<br>');
    document.getElementById(wrapId).style.display='none';
    await saveContents();
  });
}
setupEditor('mustread','mustreadEditBtn','mustreadEditWrap','mustreadArea','mustreadSaveBtn','mustreadView');
setupEditor('guide','guideEditBtn','guideEditWrap','guideArea','guideSaveBtn','guideView');
setupEditor('disclaimer','disclaimerEditBtn','disclaimerEditWrap','disclaimerArea','disclaimerSaveBtn','disclaimerView');

document.getElementById('cardsSaveBtn').addEventListener('click',async()=>{
  contents.card1Name=document.getElementById('card1NameInput').value.trim()||DEFAULTS.card1Name;
  contents.card1Url=document.getElementById('card1UrlInput').value.trim()||DEFAULTS.card1Url;
  contents.card2Name=document.getElementById('card2NameInput').value.trim()||DEFAULTS.card2Name;
  contents.card2Url=document.getElementById('card2UrlInput').value.trim()||DEFAULTS.card2Url;
  renderContents();
  await saveContents();
  alert('保存しました');
});

// init
loadAdmin();
renderContents();
loadContents();
applyAdmin();
</script>
</body>
</html>
