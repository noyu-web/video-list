

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>💎 所持リストのアンケート</title>
<style>
:root{--pink:#e8749a;--pink-light:#f5c6d8;--pink-pale:#fdf0f5;--pink-dark:#c45580;--gray:#6b7280;--text:#1f2937}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--pink-pale);color:var(--text);padding:calc(14px + env(safe-area-inset-top,0px)) 0 calc(24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
h1{font-size:16px;font-weight:800;color:var(--pink-dark);text-align:center;letter-spacing:.06em}
.hint{font-size:11px;color:var(--gray);text-align:center;margin:4px 0 12px;line-height:1.7}
.card{background:#fff;border:1.5px solid var(--pink-light);border-radius:14px;padding:6px 6px 10px;overflow:hidden}
iframe{display:block;width:100%;min-height:520px;border:0}
.alt{font-size:11px;color:var(--gray);text-align:center;margin-top:12px;line-height:1.7}
.alt a{color:var(--pink-dark)}
</style>
</head>
<body>
<div class="wrap">
  <h1>💎 所持リストのアンケート</h1>
  <div class="hint">ご協力ありがとうございます（所要時間 約1分）</div>

  <div class="card">
    <iframe data-tally-src="https://tally.so/embed/9NNGOV?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
            loading="lazy" title="所持リストについてのアンケート"></iframe>
  </div>

  <p class="alt">表示されない場合は<a href="https://tally.so/r/9NNGOV">こちらから回答</a>してください。</p>
</div>

<script>
var d=document,w="https://tally.so/widgets/embed.js",v=function(){"undefined"!=typeof Tally?Tally.loadEmbeds():d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function(e){e.src=e.dataset.tallySrc})};
if("undefined"!=typeof Tally)v();else if(d.querySelector('script[src="'+w+'"]')==null){var s=d.createElement("script");s.src=w;s.onload=v;s.onerror=v;d.body.appendChild(s)}
</script>
</body>
</html>
