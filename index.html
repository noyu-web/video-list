<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>所持リスト</title>
<style>
  :root { --pink:#e8749a;--pink-light:#f5c6d8;--pink-pale:#fdf0f5;--pink-dark:#c45580;--gray:#6b7280;--gray-light:#f3f4f6;--text:#1f2937;--border:#e5e7eb;--white:#fff;--shadow:0 2px 8px rgba(232,116,154,.12); }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--pink-pale);color:var(--text);min-height:100vh}
  header{background:var(--white);border-bottom:2px solid var(--pink-light);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
  .header-title{font-size:17px;font-weight:700;color:var(--pink-dark)}
  .header-right{display:flex;align-items:center;gap:8px}
  .mode-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
  .mode-badge.admin{background:var(--pink);color:white}
  .mode-badge.view{background:var(--gray-light);color:var(--gray)}
  .btn-icon{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--gray);font-size:18px}
  .tabs-wrap{background:var(--white);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
  .tabs-wrap::-webkit-scrollbar{display:none}
  .tabs{display:flex;padding:0 12px;min-width:max-content}
  .tab{padding:11px 14px;font-size:13px;font-weight:600;color:var(--gray);cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;white-space:nowrap}
  .tab.active{color:var(--pink);border-bottom-color:var(--pink)}
  .subtabs-wrap{background:var(--pink-pale);border-bottom:1px solid var(--pink-light);overflow-x:auto;scrollbar-width:none;display:none}
  .subtabs-wrap.visible{display:block}
  .subtabs{display:flex;padding:6px 12px;gap:6px;min-width:max-content;flex-wrap:wrap}
  .subtab{padding:5px 12px;font-size:12px;font-weight:600;color:var(--gray);cursor:pointer;border:1.5px solid var(--border);border-radius:20px;background:var(--white);white-space:nowrap}
  .subtab.active{color:var(--pink-dark);border-color:var(--pink);background:var(--pink-light)}
  .subtab-add{background:var(--pink-pale);color:var(--pink-dark);border-color:var(--pink-light)}
  .toolbar{padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{padding:8px 16px;border-radius:20px;border:none;font-size:13px;font-weight:600;cursor:pointer}
  .btn-primary{background:var(--pink);color:white}
  .btn-ghost{background:var(--white);color:var(--pink);border:1.5px solid var(--pink-light)}
  .search-input{padding:8px 14px;border:1.5px solid var(--border);border-radius:20px;font-size:13px;outline:none;background:var(--white);flex:1;min-width:150px}
  .search-input:focus{border-color:var(--pink)}
  .filter-bar{padding:0 14px 10px;display:flex;gap:6px;flex-wrap:wrap}
  .filter-chip{padding:4px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);font-size:12px;cursor:pointer;color:var(--gray)}
  .filter-chip.active{background:var(--pink-light);border-color:var(--pink);color:var(--pink-dark);font-weight:600}
  .list-wrap{padding:0 14px 40px}
  .list-count{font-size:12px;color:var(--gray);padding:4px 0 10px}
  .card{background:var(--white);border-radius:12px;border:1px solid var(--border);margin-bottom:8px;overflow:hidden}
  .card:hover{box-shadow:var(--shadow)}
  .card-main{padding:12px 13px;display:flex;align-items:flex-start;gap:8px}
  .card-info{flex:1;min-width:0}
  .card-title{font-size:14px;font-weight:600;line-height:1.4;word-break:break-all}
  .card-sub{font-size:11px;color:var(--gray);margin-top:2px}
  .card-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
  .tag-member{background:#fce7f3;color:#9d174d}
  .tag-date{background:#eff6ff;color:#1e40af;font-family:monospace}
  .tag-note{background:var(--gray-light);color:var(--gray)}
  .tag-jesse{background:#e53e3e;color:white}
  .tag-kyomo{background:#ed64a6;color:white}
  .tag-matsu{background:#1a202c;color:white}
  .tag-kochi{background:#d69e2e;color:white}
  .tag-mori{background:#38a169;color:white}
  .tag-juri{background:#3182ce;color:white}
  .tag-sixtones{background:#718096;color:white}
  .tag-all{background:#fce7f3;color:#9d174d}
  .exchange-partial{background:#fef3c7;color:#92400e}
  .exchange-consult{background:#ede9fe;color:#5b21b6}
  .tag-jesse{background:#e53e3e;color:white}
  .tag-kyomo{background:#ed64a6;color:white}
  .tag-matsu{background:#1a202c;color:white}
  .tag-kochi{background:#d69e2e;color:white}
  .tag-mori{background:#38a169;color:white}
  .tag-juri{background:#3182ce;color:white}
  .tag-sixtones{background:#718096;color:white}
  .tag-all{background:#fce7f3;color:#9d174d}
  .exchange-badge{font-size:11px;padding:3px 9px;border-radius:10px;font-weight:600;white-space:nowrap;flex-shrink:0}
  .exchange-ok{background:#dcfce7;color:#166534}
  .exchange-ng{background:#fee2e2;color:#991b1b}
  .toggle-wrap{display:flex;align-items:center;gap:6px;margin-top:8px}
  .toggle{position:relative;width:36px;height:20px;cursor:pointer}
  .toggle input{opacity:0;width:0;height:0}
  .toggle-slider{position:absolute;inset:0;background:#d1d5db;border-radius:20px;transition:.2s}
  .toggle-slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s}
  .toggle input:checked+.toggle-slider{background:#22c55e}
  .toggle input:checked+.toggle-slider::before{transform:translateX(16px)}
  .toggle-label{font-size:12px;color:var(--gray)}
  .card-actions{display:flex;gap:6px;padding:0 13px 10px;justify-content:flex-end}
  .btn-sm{padding:4px 12px;font-size:12px;border-radius:8px;border:none;cursor:pointer;font-weight:600}
  .btn-edit{background:var(--pink-pale);color:var(--pink-dark)}
  .btn-delete{background:#fee2e2;color:#991b1b}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--white);border-radius:16px;width:100%;max-width:480px;padding:22px;box-shadow:0 8px 32px rgba(0,0,0,.18);max-height:90vh;overflow-y:auto}
  .modal-title{font-size:16px;font-weight:700;color:var(--pink-dark);margin-bottom:18px}
  .form-group{margin-bottom:13px}
  .form-label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:4px}
  .form-input,.form-select,.form-textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline:none;font-family:inherit}
  .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--pink)}
  .form-textarea{resize:vertical;min-height:60px}
  .chips-grid{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);font-size:12px;cursor:pointer;background:var(--white);color:var(--gray)}
  .chip.selected{background:var(--pink-light);border-color:var(--pink);color:var(--pink-dark);font-weight:600}
  .chip-add{background:var(--pink-pale);color:var(--pink-dark);border-color:var(--pink-light)}
  .dates-section{border:1.5px solid var(--border);border-radius:10px;padding:10px;margin-bottom:4px}
  .date-group{background:var(--pink-pale);border-radius:8px;padding:8px;margin-bottom:8px}
  .date-group-header{display:flex;align-items:center;gap:6px;margin-bottom:6px}
  .date-group-header input{flex:1}
  .times-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .time-row{display:flex;align-items:center;gap:4px}
  .time-row input{width:90px}
  .btn-remove{background:#fee2e2;color:#991b1b;border:none;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer}
  .btn-add-small{background:var(--pink-pale);color:var(--pink-dark);border:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;margin-top:4px}
  .modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
  .btn-cancel{background:var(--gray-light);color:var(--gray);padding:9px 18px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer}
  .btn-save{background:var(--pink);color:white;padding:9px 18px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer}
  .err-msg{color:#991b1b;font-size:12px;margin-bottom:8px}
  .empty{text-align:center;padding:48px 0;color:var(--gray)}
  .empty-icon{font-size:32px;margin-bottom:8px}
  .loading{text-align:center;padding:40px;color:var(--gray);font-size:14px}
  .hidden{display:none!important}
  .section-title{font-size:12px;font-weight:700;color:var(--pink-dark);margin-bottom:6px}
  .manage-list{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto}
  .manage-item{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--gray-light);border-radius:8px;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="header-title">💎 所持リスト</div>
  <div class="header-right">
    <span class="mode-badge view" id="modeBadge">閲覧モード</span>

<div class="subtabs-wrap" id="subtabsWrap"><div class="subtabs" id="subtabs"></div></div>

<!-- Detail Modal -->

<!-- Auth Modal -->

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbyfXkPgeyIvBHplsEKOC0bfLBuNEocXi5QjZeFXCKQ88T-U6ta1KY85O1fR-8XT-yHZ/exec';
const ADMIN_PW='0703clarinet';

// デフォルト設定
const DEFAULT_GENRES=['配信関連','円盤','バラエティー番組','ドラマ・映画','Radio','FC・FCweb','SixTONES以外'];
const DEFAULT_SUBGENRES={'配信関連':['ISLAND TV','Johnnys online・FAMILY CLUB online','Hulu・FOD・TELASA・Netflix','WOWWOW','Instagram Live','X SPACE','滝CHANnel','other'],'円盤':['Jr時代円盤','SixTONES CD円盤','SixTONES Live DVD円盤','ART-PUT'],'バラエティー番組':['Jr時代 レギュラー・準レギュラー番組','レギュラー番組','バラエティー'],'ドラマ・映画':[],'Radio':['ANN','らじらー','その他'],'FC・FCweb':['情報局','SixTONES...','FC web'],'SixTONES以外':['DOMOTO(KinKi kids)','V6','嵐','KAT-TUN','NEWS','SUPER EIGHT','Hey! Say! JUMP','Kis-My-Ft2','Sexy Zone','WEST.','King&Prince','Snow Man','なにわ男子','Travis Japan','Aえ！group','HiHi Jets','美少年','7 MEN 侍','少年忍者','Lilかんさい','ふぉ〜ゆ〜＆俳優部＆無所']};
const DEFAULT_MEMBERS=['全員','京本大我','ジェシー','田中樹','松村北斗','髙地優吾','森本慎太郎','SixTONES'];

// ローカル設定（ジャンル・出演者はlocalStorageで管理）
function loadConfig(){
  try{
    return {
      genres: JSON.parse(localStorage.getItem('cfg_genres'))||DEFAULT_GENRES,
      subgenres: JSON.parse(localStorage.getItem('cfg_subgenres'))||DEFAULT_SUBGENRES,
      members: JSON.parse(localStorage.getItem('cfg_members'))||DEFAULT_MEMBERS
    };
  }catch{return {genres:DEFAULT_GENRES,subgenres:DEFAULT_SUBGENRES,members:DEFAULT_MEMBERS};}
}
function saveConfig(cfg){
  localStorage.setItem('cfg_genres',JSON.stringify(cfg.genres));
  localStorage.setItem('cfg_subgenres',JSON.stringify(cfg.subgenres));
  localStorage.setItem('cfg_members',JSON.stringify(cfg.members));
}

let isAdmin=false,currentGenre='',currentSubgenre='すべて',currentFilter='すべて',searchQuery='',editingId=null,cachedVideos=null,cbIdx=0;
let cfg=loadConfig();
if(!currentGenre&&cfg.genres.length)currentGenre=cfg.genres[0];

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const name='_cb'+cbIdx++;
    const s=document.createElement('script');
    window[name]=(d)=>{delete window[name];s.remove();resolve(d);};
    s.onerror=()=>{delete window[name];s.remove();reject();};
    s.src=GAS_URL+'?'+new URLSearchParams({...params,callback:name});
    document.head.appendChild(s);
    setTimeout(()=>{if(window[name]){delete window[name];s.remove();reject();}},15000);
  });
}
async function gasPost(data){
  return jsonp({action: data.action, data: encodeURIComponent(JSON.stringify(data)), id: data.id||''});
}
async function loadVideos(force=false){
  if(cachedVideos&&!force)return cachedVideos;
  cachedVideos=await jsonp({action:'getVideos'});
  if(!Array.isArray(cachedVideos))cachedVideos=[];
  return cachedVideos;
}

function memberClass(m){
  if(m==='ジェシー')return'tag-jesse';
  if(m==='京本大我')return'tag-kyomo';
  if(m==='松村北斗')return'tag-matsu';
  if(m==='髙地優吾')return'tag-kochi';
  if(m==='森本慎太郎')return'tag-mori';
  if(m==='田中樹')return'tag-juri';
  if(m==='SixTONES')return'tag-sixtones';
  return'tag-all';
}

function memberClass(m){
  if(m==='ジェシー')return'tag-jesse';
  if(m==='京本大我')return'tag-kyomo';
  if(m==='松村北斗')return'tag-matsu';
  if(m==='髙地優吾')return'tag-kochi';
  if(m==='森本慎太郎')return'tag-mori';
  if(m==='田中樹')return'tag-juri';
  if(m==='SixTONES')return'tag-sixtones';
  return'tag-all';
}

function renderTabs(){
  cfg=loadConfig();
  const t=document.getElementById('tabs');
  let html=cfg.genres.map(g=>`<button class="tab ${currentGenre===g?'active':''}" data-g="${esc(g)}">${esc(g)}</button>`).join('');
  t.innerHTML=html;
  t.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{currentGenre=b.dataset.g;currentSubgenre='すべて';renderTabs();renderSubtabs();renderList();}));
}

function renderSubtabs(){
  cfg=loadConfig();
  const wrap=document.getElementById('subtabsWrap');
  const subs=cfg.subgenres[currentGenre]||[];
  if(!subs.length){wrap.classList.remove('visible');return;}
  wrap.classList.add('visible');
  let html=`<button class="subtab ${currentSubgenre==='すべて'?'active':''}" data-s="すべて">すべて</button>`;
  html+=subs.map(s=>`<button class="subtab ${currentSubgenre===s?'active':''}" data-s="${esc(s)}">${esc(s)}</button>`).join('');
  if(isAdmin)html+=`<button class="subtab subtab-add" id="manageSubBtn">＋ 編集</button>`;
  document.getElementById('subtabs').innerHTML=html;
  document.getElementById('subtabs').querySelectorAll('.subtab[data-s]').forEach(b=>b.addEventListener('click',()=>{currentSubgenre=b.dataset.s;renderSubtabs();renderList();}));
  if(isAdmin){const btn=document.getElementById('manageSubBtn');if(btn)btn.addEventListener('click',()=>openSubgenreModal());}
}

function renderFilterBar(){
  const bar=document.getElementById('filterBar');bar.innerHTML='';
  ['すべて','交換可','交換不可'].forEach(f=>{
    const c=document.createElement('button');c.className='filter-chip'+(currentFilter===f?' active':'');c.textContent=f;
    c.addEventListener('click',()=>{currentFilter=f;renderFilterBar();renderList();});bar.appendChild(c);
  });
}

// 公演日データをフォーマット
function formatSchedules(schedulesStr){
  if(!schedulesStr)return[];
  try{return JSON.parse(schedulesStr);}catch{
    // 旧形式（カンマ区切り）対応
    return schedulesStr.split(',').filter(Boolean).map(d=>({date:d,times:[]}));
  }
}

async function renderList(){
  const list=document.getElementById('cardList');
  list.innerHTML='<div class="loading">読み込み中…</div>';
  let data=await loadVideos();
  data=data.filter(d=>d.genre===currentGenre);
  const subs=cfg.subgenres[currentGenre]||[];
  if(subs.length&&currentSubgenre!=='すべて')data=data.filter(d=>d.subgenre===currentSubgenre);
  if(currentFilter==='交換可')data=data.filter(d=>d.exchange==='ok');
  if(currentFilter==='交換不可')data=data.filter(d=>d.exchange==='ng');
  if(searchQuery){const q=searchQuery.toLowerCase();data=data.filter(d=>d.title.toLowerCase().includes(q));}
  document.getElementById('listCount').textContent=data.length+' 件';
  if(!data.length){list.innerHTML='<div class="empty"><div class="empty-icon">📭</div><div style="font-size:14px">該当する動画がありません</div></div>';return;}
  
  list.innerHTML=data.map(item=>{
    const schedules=formatSchedules(item.dates);
    const scheduleTags=schedules.map(s=>{
      const times=s.times&&s.times.length?s.times.join(' / '):'';
      return `<span class="tag tag-date">${esc(s.date)}${times?' '+times:''}</span>`;
    }).join('');
    
    return `<div class="card" style="cursor:pointer" data-detail="${item.id}"><div class="card-main"><div class="card-info">
      <div class="card-title">${esc(item.title)}</div>
      ${item.subgenre?`<div class="card-sub">${esc(item.subgenre)}</div>`:''}
      <div class="card-meta">
        ${(item.members||[]).map(m=>`<span class="tag ${memberClass(m)}">${esc(m)}</span>`).join('')}
        ${scheduleTags}
      </div>
      ${isAdmin?`<div class="toggle-wrap"><label class="toggle"><input type="checkbox" ${item.exchange==='ok'?'checked':''} data-toggle="${item.id}"><span class="toggle-slider"></span></label><span class="toggle-label">${item.exchange==='ok'?'交換可':item.exchange==='partial'?'一部交換可':item.exchange==='consult'?'要相談':'交換不可'}</span></div>`:''}
    </div><span class="exchange-badge ${item.exchange==='ok'?'exchange-ok':'exchange-ng'}">${item.exchange==='ok'?'交換可':'交換不可'}</span></div>
    ${isAdmin?`<div class="card-actions"><button class="btn-sm btn-edit" data-edit="${item.id}">編集</button><button class="btn-sm btn-delete" data-delete="${item.id}">削除</button></div>`:''}</div>`;
  }).join('');

  list.querySelectorAll('[data-toggle]').forEach(inp=>inp.addEventListener('change',async()=>{
    const all=await loadVideos();const item=all.find(d=>d.id===inp.dataset.toggle);
    if(item){item.exchange=inp.checked?'ok':'ng';await gasPost({action:'saveVideo',video:item,isNew:false});cachedVideos=null;renderList();}
  }));
  list.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',(e)=>{e.stopPropagation();openEditModal(b.dataset.edit);}));
  list.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',(e)=>{e.stopPropagation();deleteItem(b.dataset.delete);}));
  list.querySelectorAll('[data-toggle]').length&&list.querySelectorAll('label.toggle').forEach(l=>l.addEventListener('click',(e)=>e.stopPropagation()));
  list.querySelectorAll('[data-detail]').forEach(card=>card.addEventListener('click',async()=>{
    const data=await loadVideos();
    const item=data.find(d=>d.id===card.dataset.detail);
    if(item)openDetailModal(item);
  }));
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function updateAdminUI(){
  document.getElementById('modeBadge').textContent=isAdmin?'管理者モード':'閲覧モード';
  document.getElementById('modeBadge').className='mode-badge '+(isAdmin?'admin':'view');
  document.getElementById('authBtn').textContent=isAdmin?'🔓':'🔑';
  document.getElementById('settingsBtn').style.display=isAdmin?'':'none';
  document.getElementById('adminToolbar').classList.toggle('hidden',!isAdmin);
  renderTabs();renderSubtabs();renderList();
}

// Auth
document.getElementById('authBtn').addEventListener('click',()=>{
  if(isAdmin){isAdmin=false;updateAdminUI();return;}
  document.getElementById('authInput').value='';
  document.getElementById('authError').classList.add('hidden');
  document.getElementById('authModal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('authInput').focus(),50);
});
document.getElementById('authCancelBtn').addEventListener('click',()=>document.getElementById('authModal').classList.add('hidden'));
document.getElementById('authSubmitBtn').addEventListener('click',()=>{
  if(document.getElementById('authInput').value===ADMIN_PW){
    isAdmin=true;document.getElementById('authModal').classList.add('hidden');updateAdminUI();
  }else document.getElementById('authError').classList.remove('hidden');
});
document.getElementById('authInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('authSubmitBtn').click();});

// Settings
document.getElementById('settingsBtn').addEventListener('click',()=>openSettingsModal());
function openSettingsModal(){
  cfg=loadConfig();
  // ジャンル一覧
  document.getElementById('genreManageList').innerHTML=cfg.genres.map((g,i)=>`
    <div class="manage-item">${esc(g)}<button class="btn-remove" data-gi="${i}">削除</button></div>
  `).join('');
  document.getElementById('genreManageList').querySelectorAll('[data-gi]').forEach(b=>b.addEventListener('click',()=>{
    cfg.genres.splice(parseInt(b.dataset.gi),1);
    saveConfig(cfg);openSettingsModal();renderTabs();renderSubtabs();
  }));
  // 出演者一覧
  document.getElementById('memberManageList').innerHTML=cfg.members.map((m,i)=>`
    <div class="manage-item">${esc(m)}<button class="btn-remove" data-mi="${i}">削除</button></div>
  `).join('');
  document.getElementById('memberManageList').querySelectorAll('[data-mi]').forEach(b=>b.addEventListener('click',()=>{
    cfg.members.splice(parseInt(b.dataset.mi),1);
    saveConfig(cfg);openSettingsModal();
  }));
  document.getElementById('settingsModal').classList.remove('hidden');
}
document.getElementById('settingsCloseBtn').addEventListener('click',()=>document.getElementById('settingsModal').classList.add('hidden'));
document.getElementById('addGenreBtn').addEventListener('click',()=>{
  const v=document.getElementById('newGenreInput').value.trim();
  if(!v)return;cfg.genres.push(v);saveConfig(cfg);
  document.getElementById('newGenreInput').value='';openSettingsModal();renderTabs();
});
document.getElementById('addMemberBtn').addEventListener('click',()=>{
  const v=document.getElementById('newMemberInput').value.trim();
  if(!v)return;cfg.members.push(v);saveConfig(cfg);
  document.getElementById('newMemberInput').value='';openSettingsModal();
});

// Subgenre Modal
function openSubgenreModal(){
  cfg=loadConfig();
  document.getElementById('subgenreModalTitle').textContent=currentGenre+' - 小ジャンル管理';
  const subs=cfg.subgenres[currentGenre]||[];
  document.getElementById('subgenreManageList').innerHTML=subs.map((s,i)=>`
    <div class="manage-item">${esc(s)}<button class="btn-remove" data-si="${i}">削除</button></div>
  `).join('');
  document.getElementById('subgenreManageList').querySelectorAll('[data-si]').forEach(b=>b.addEventListener('click',()=>{
    cfg.subgenres[currentGenre].splice(parseInt(b.dataset.si),1);
    saveConfig(cfg);openSubgenreModal();renderSubtabs();
  }));
  document.getElementById('subgenreModal').classList.remove('hidden');
}
document.getElementById('subgenreCloseBtn').addEventListener('click',()=>document.getElementById('subgenreModal').classList.add('hidden'));
document.getElementById('addSubgenreBtn').addEventListener('click',()=>{
  const v=document.getElementById('newSubgenreInput').value.trim();
  if(!v)return;
  if(!cfg.subgenres[currentGenre])cfg.subgenres[currentGenre]=[];
  cfg.subgenres[currentGenre].push(v);saveConfig(cfg);
  document.getElementById('newSubgenreInput').value='';openSubgenreModal();renderSubtabs();
});

// Date Groups
function addDateGroup(dateVal='',times=[]){
  const wrap=document.getElementById('dateGroupsWrap');
  const div=document.createElement('div');div.className='date-group';
  div.innerHTML=`<div class="date-group-header">
    <input class="form-input dg-date" type="text" placeholder="例: 2019/03/02" value="${esc(dateVal)}">
    <button class="btn-remove dg-remove" type="button">✕</button>
  </div>
  <div class="times-wrap dg-times">${times.map(t=>`<div class="time-row"><input class="form-input" type="text" placeholder="例: 12:00" value="${esc(t)}" style="width:90px"><button class="btn-remove tr-remove" type="button">✕</button></div>`).join('')}</div>
  <button class="btn-add-small dg-add-time" type="button">＋ 時間追加</button>`;
  div.querySelector('.dg-remove').addEventListener('click',()=>div.remove());
  div.querySelector('.dg-add-time').addEventListener('click',()=>{
    const tr=document.createElement('div');tr.className='time-row';
    tr.innerHTML=`<input class="form-input" type="text" placeholder="例: 12:00" style="width:90px"><button class="btn-remove tr-remove" type="button">✕</button>`;
    tr.querySelector('.tr-remove').addEventListener('click',()=>tr.remove());
    div.querySelector('.dg-times').appendChild(tr);
  });
  div.querySelectorAll('.tr-remove').forEach(b=>b.addEventListener('click',()=>b.closest('.time-row').remove()));
  wrap.appendChild(div);
}
document.getElementById('addDateGroupBtn').addEventListener('click',()=>addDateGroup());

function getSchedules(){
  return [...document.getElementById('dateGroupsWrap').querySelectorAll('.date-group')].map(dg=>{
    const date=dg.querySelector('.dg-date').value.trim();
    const times=[...dg.querySelectorAll('.dg-times .time-row input')].map(i=>i.value.trim()).filter(Boolean);
    return{date,times};
  }).filter(s=>s.date);
}

// Edit Modal
async function openEditModal(id=null){
  cfg=loadConfig();editingId=id;
  const data=await loadVideos();
  const item=id?data.find(d=>d.id===id):null;
  document.getElementById('editModalTitle').textContent=item?'動画を編集':'動画を追加';
  
  const genSel=document.getElementById('editGenre');
  genSel.innerHTML=cfg.genres.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('');
  const genre=item?item.genre:currentGenre;
  genSel.value=genre;
  renderEditSubgenre(genre);
  genSel.onchange=()=>renderEditSubgenre(genSel.value);
  if(item&&item.subgenre)document.getElementById('editSubgenre').value=item.subgenre;
  
  document.getElementById('editTitle').value=item?item.title:'';
  document.getElementById('editExchange').value=item?item.exchange:'ok';
  document.getElementById('editNote').value=item?(item.note||''):'';
  
  // 出演者
  const sel=item?item.members:[];
  document.getElementById('memberChips').innerHTML=cfg.members.map(m=>`<button type="button" class="chip${sel.includes(m)?' selected':''}" data-member="${esc(m)}">${esc(m)}</button>`).join('');
  document.getElementById('memberChips').querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>c.classList.toggle('selected')));
  
  // 公演日
  document.getElementById('dateGroupsWrap').innerHTML='';
  const schedules=item?formatSchedules(item.dates):[];
  if(schedules.length)schedules.forEach(s=>addDateGroup(s.date,s.times||[]));
  
  document.getElementById('editModal').classList.remove('hidden');
  setTimeout(()=>document.getElementById('editTitle').focus(),50);
}

function renderEditSubgenre(genre){
  const group=document.getElementById('subgenreGroup');
  const sel=document.getElementById('editSubgenre');
  const subs=(cfg.subgenres[genre]||[]);
  if(!subs.length){group.classList.add('hidden');return;}
  group.classList.remove('hidden');
  sel.innerHTML=subs.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');
}

document.getElementById('addBtn').addEventListener('click',()=>openEditModal());
document.getElementById('editCancelBtn').addEventListener('click',()=>document.getElementById('editModal').classList.add('hidden'));
document.getElementById('editSaveBtn').addEventListener('click',async()=>{
  const title=document.getElementById('editTitle').value.trim();
  if(!title){alert('タイトルを入力してください');return;}
  const genre=document.getElementById('editGenre').value;
  const subs=cfg.subgenres[genre]||[];
  const subgenre=subs.length?document.getElementById('editSubgenre').value:'';
  const exchange=document.getElementById('editExchange').value;
  const note=document.getElementById('editNote').value.trim();
  const members=[...document.getElementById('memberChips').querySelectorAll('.chip.selected')].map(c=>c.dataset.member);
  const schedules=getSchedules();
  const video={id:editingId||Date.now().toString(),title,genre,subgenre,exchange,note,members,dates:JSON.stringify(schedules)};
  await gasPost({action:'saveVideo',video,isNew:!editingId});
  cachedVideos=null;document.getElementById('editModal').classList.add('hidden');renderList();
});

function openDetailModal(item){
  document.getElementById('detailTitle').textContent=item.title;
  document.getElementById('detailSubgenre').textContent=item.subgenre||'';
  
  const members=document.getElementById('detailMembers');
  members.innerHTML=(item.members||[]).map(m=>`<span class="tag ${memberClass(m)}">${esc(m)}</span>`).join('');
  
  const ex=document.getElementById('detailExchange');
  ex.innerHTML=`<span class="exchange-badge ${item.exchange==='ok'?'exchange-ok':item.exchange==='partial'?'exchange-partial':item.exchange==='consult'?'exchange-consult':'exchange-ng'}">${item.exchange==='ok'?'交換可':item.exchange==='partial'?'一部交換可':item.exchange==='consult'?'要相談':'交換不可'}</span>`;
  
  const schedules=formatSchedules(item.dates);
  const schDiv=document.getElementById('detailSchedules');
  if(schedules.length){
    schDiv.innerHTML='<div style="font-size:12px;font-weight:600;color:var(--gray);margin-bottom:6px">公演日・時間</div>'+
    schedules.map(s=>`<div style="background:var(--pink-pale);border-radius:8px;padding:8px 10px;margin-bottom:6px">
      <div style="font-size:13px;font-weight:600;color:var(--pink-dark)">${esc(s.date)}</div>
      ${s.times&&s.times.length?`<div style="font-size:12px;color:var(--gray);margin-top:3px">${s.times.map(t=>esc(t)).join('　/　')}</div>`:''}
    </div>`).join('');
  }else{schDiv.innerHTML='';}
  
  const note=document.getElementById('detailNote');
  if(item.note){
    note.innerHTML=`<div style="font-size:12px;font-weight:600;color:var(--gray);margin-bottom:4px">メモ</div>
    <div style="font-size:13px;background:var(--gray-light);border-radius:8px;padding:8px 10px">${esc(item.note)}</div>`;
  }else{note.innerHTML='';}
  
  document.getElementById('detailModal').classList.remove('hidden');
}

async function deleteItem(id){
  if(!confirm('削除しますか？'))return;
  await gasPost({action:'deleteVideo',id});cachedVideos=null;renderList();
}

document.getElementById('searchInput').addEventListener('input',e=>{searchQuery=e.target.value.trim();renderList();});
document.getElementById('detailCloseBtn').addEventListener('click',()=>document.getElementById('detailModal').classList.add('hidden'));
document.getElementById('detailModal').addEventListener('click',function(e){if(e.target===this)this.classList.add('hidden');});

cfg=loadConfig();
if(cfg.genres.length)currentGenre=cfg.genres[0];
renderTabs();renderSubtabs();renderFilterBar();renderList();
</script>
</body>
