<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💎</title>
<style>
:root{--pink:#f4a7c0;--pink-dark:#e07a9e;--pink-light:#fce8ef;--bg:#fff8fb;--white:#fff;--gray:#aaa;--border:#f0dde7;--text:#333;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ヘッダー：💎を消して左端に透明なタップエリア（幅60px）を確保 */
header{background:var(--bg);padding:0 20px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--border);}
.logo-area{width:60px;height:100%;cursor:default;user-select:none;}
.hamburger{width:36px;height:36px;display:flex;flex-direction:column;justify-content:center;gap:5px;cursor:pointer;background:none;border:none;padding:4px;}
.hamburger span{display:block;height:1.5px;background:var(--pink-dark);border-radius:2px;transition:all .25s;}
.hamburger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}

.drawer{position:fixed;top:52px;right:0;bottom:0;width:280px;background:var(--white);box-shadow:-2px 0 16px rgba(0,0,0,.07);z-index:99;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;}
.drawer.open{transform:translateX(0);}
.drawer-overlay{position:fixed;inset:0;top:52px;background:rgba(0,0,0,.15);z-index:98;opacity:0;pointer-events:none;transition:opacity .28s;}
.drawer-overlay.open{opacity:1;pointer-events:auto;}
.drawer-inner{padding:18px 18px 40px;}
.drawer-section{margin-bottom:18px;}
.drawer-link{display:block;font-size:14px;font-weight:700;color:var(--pink-dark);text-decoration:none;padding:10px 0;border-bottom:1px solid var(--border);}
.drawer-link:last-child{border-bottom:none;}

main{padding:24px 20px 60px;max-width:440px;margin:0 auto;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.section-label{font-size:13px;font-weight:800;color:var(--pink-dark);letter-spacing:.12em;text-transform:uppercase;}

.link-card{display:flex;align-items:center;justify-content:space-between;background:var(--white);border-radius:12px;padding:16px 18px;margin-bottom:10px;border:1.5px solid var(--border);text-decoration:none;color:var(--pink-dark);}
.link-card-name{font-size:15px;font-weight:700;}
.link-card-arrow{color:var(--pink);font-size:18px;}

.edit-btn{font-size:11px;background:none;border:1px solid var(--border);border-radius:6px;padding:3px 10px;cursor:pointer;color:var(--gray);display:none;}
.edit-wrap{display:none;margin-top:8px;}
.edit-input{width:100%;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;margin-bottom:6px;}
.save-btn{background:var(--pink);color:#fff;border:none;border-radius:8px;padding:7px 16px;font-size:13px;cursor:pointer;width:100%;}
.add-btn{font-size:12px;background:var(--pink-light);color:var(--pink-dark);border:none;border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:700;display:none;}
.add-form{display:none;background:var(--white);border-radius:12px;padding:14px;border:1.5px solid var(--border);margin-bottom:10px;}
</style>
</head>
<body>

<header>
  <!-- 💎の文字を消して透明なタップエリアにしました -->
  <div class="logo-area" id="logoArea"></div>
  <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
</header>

<div class="drawer-overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-inner">
    <div class="drawer-section" id="drawerLinksSection"></div>
    <div id="drawerAdminEdit" style="display:none;border-top:1px solid var(--border);padding-top:14px;margin-top:6px">
      <div style="font-size:11px;font-weight:700;color:var(--pink);margin-bottom:10px">三本線メニュー編集</div>
      <div id="drawerEditList"></div>
      <div class="add-form" id="drawerAddForm" style="display:none">
        <div style="font-size:11px;color:var(--gray);margin-bottom:3px">名前</div>
        <input class="edit-input" id="drawerNewName" placeholder="例: 見方">
        <div style="font-size:11px;color:var(--gray);margin-bottom:3px">URL</div>
        <input class="edit-input" id="drawerNewUrl" placeholder="https://...">
        <button class="save-btn" id="drawerNewSaveBtn">追加</button>
      </div>
      <button style="font-size:12px;background:var(--pink-light);color:var(--pink-dark);border:none;border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:700;margin-top:8px;width:100%" id="drawerAddBtn">＋ 追加</button>
    </div>
  </div>
</div>

<main>
  <div id="mustreadSection" style="background:var(--white);border-radius:12px;border:1.5px solid var(--border);padding:16px 18px;margin-bottom:20px;display:none">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <a id="mustreadLink" href="" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:var(--pink-dark);font-size:15px;font-weight:700;flex:1;display:flex;align-items:center;justify-content:space-between;">
        <span>⚠️ 必読</span>
        <span style="color:var(--pink);font-size:18px;">›</span>
      </a>
      <button class="edit-btn" id="mustreadEditBtn" style="margin-left:10px;flex-shrink:0;">✏️ 編集</button>
    </div>
    <div class="edit-wrap" id="mustreadEditWrap" style="margin-top:10px;">
      <div style="font-size:11px;color:var(--gray);margin-bottom:3px">必読のURL</div>
      <input class="edit-input" id="mustreadText" placeholder="https://..." style="margin-bottom:6px;">
      <button class="save-btn" id="mustreadSaveBtn">保存</button>
    </div>
  </div>

  <div class="section-header">
    <div class="section-label">LINK</div>
    <button class="add-btn" id="addLinkBtn">＋ 追加</button>
  </div>
  <div id="linkList"></div>
  
  <div id="linkAdminEdit" style="display:none;border-top:1px solid var(--border);padding-top:14px;margin-top:14px">
    <div style="font-size:11px;font-weight:700;color:var(--pink);margin-bottom:10px">LINKの編集・削除</div>
    <div id="linkEditList"></div>
  </div>

  <div class="add-form" id="addLinkForm">
    <div style="font-size:11px;color:var(--gray);margin-bottom:3px">名前</div>
    <input class="edit-input" id="newLinkName" placeholder="例: 新しいリスト">
    <div style="font-size:11px;color:var(--gray);margin-bottom:3px">URL</div>
    <input class="edit-input" id="newLinkUrl" placeholder="https://...">
    <button class="save-btn" id="newLinkSaveBtn">追加</button>
  </div>
</main>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbzcQk2qXHLkun0bAgOYsFJiATESW-eju6s8ZqplZwvxXr94hpmZKmzLqIu5UaHRDTzU/exec';
const ADMIN_PASSWORD='0703clarinet';
let cbIdx=0;
function jsonp(params){
  return new Promise((resolve,reject)=>{
    const name='_cb'+cbIdx++;const s=document.createElement('script');
    const timer=setTimeout(()=>{delete window[name];s.remove();reject();},12000);
    window[name]=(d)=>{clearTimeout(timer);delete window[name];s.remove();resolve(d);};
    s.onerror=()=>{clearTimeout(timer);delete window[name];s.remove();reject();};
    s.src=GAS_URL+'?'+new URLSearchParams({...params,callback:name});
    document.body.appendChild(s);
  });
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

const hamburger=document.getElementById('hamburger');
const drawer=document.getElementById('drawer');
const overlay=document.getElementById('overlay');
function toggleDrawer(){const open=drawer.classList.contains('open');drawer.classList.toggle('open',!open);overlay.classList.toggle('open',!open);hamburger.classList.toggle('open',!open);}
hamburger.addEventListener('click',toggleDrawer);
overlay.addEventListener('click',toggleDrawer);

let isAdmin=false;
function loadAdmin(){try{isAdmin=sessionStorage.getItem('top_admin')==='1';}catch{}}
function applyAdmin(){
  document.querySelectorAll('.edit-btn,.add-btn').forEach(b=>b.style.display=isAdmin?'inline-block':'none');
  document.getElementById('drawerAdminEdit').style.display=isAdmin?'block':'none';
  document.getElementById('linkAdminEdit').style.display=isAdmin?'block':'none';
}
let _tap=0,_tapT=null;
document.getElementById('logoArea').addEventListener('click',()=>{
  _tap++;clearTimeout(_tapT);_tapT=setTimeout(()=>{_tap=0;},1500);
  if(_tap>=5){_tap=0;
    if(isAdmin){isAdmin=false;try{sessionStorage.removeItem('top_admin');}catch{}applyAdmin();}
    else{const pw=prompt('パスワード');if(pw===ADMIN_PASSWORD){isAdmin=true;try{sessionStorage.setItem('top_admin','1');}catch{}applyAdmin();}else if(pw!==null)alert('パスワードが違います');}
  }
});

const DEFAULTS={
  mustread:'https://app.notion.com/p/38103eff928780729e48dfc2ce57349f?source=copy_link',
  links:[
    {name:'求めリスト',url:'https://noyu-web.github.io/video-list/wishlist-app/'},
    {name:'所持リスト',url:'https://noyu-web.github.io/video-list/'}
  ],
  drawerLinks:[
    {name:'所持リストの見方',url:''},
    {name:'免責事項',url:''}
  ]
};
let contents={mustread:DEFAULTS.mustread,links:[...DEFAULTS.links.map(l=>({...l}))],drawerLinks:[...DEFAULTS.drawerLinks.map(l=>({...l}))]};

function renderMustread(){
  const sec=document.getElementById('mustreadSection');
  const lnk=document.getElementById('mustreadLink');
  if(contents.mustread){
    sec.style.display='block';
    lnk.href = contents.mustread;
    lnk.style.pointerEvents = 'auto';
  }else{
    sec.style.display=isAdmin?'block':'none';
    lnk.href = '#';
    lnk.style.pointerEvents = 'none';
  }
}

function renderDrawerLinks(){
  const sec=document.getElementById('drawerLinksSection');
  sec.innerHTML=contents.drawerLinks.map(l=>l.url?`<a class="drawer-link" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.name)}</a>`:`<div class="drawer-link" style="color:var(--gray)">${esc(l.name)}</div>`).join('');
  
  const editList=document.getElementById('drawerEditList');
  editList.innerHTML=contents.drawerLinks.map((l,i)=>`
    <div style="margin-bottom:10px;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--bg)">
      <div style="font-size:11px;color:var(--gray);margin-bottom:2px">名前</div>
      <input class="edit-input" value="${esc(l.name)}" data-d-name-i="${i}" style="margin-bottom:6px">
      <div style="font-size:11px;color:var(--gray);margin-bottom:2px">URL</div>
      <input class="edit-input" value="${esc(l.url)}" data-d-url-i="${i}" style="margin:0">
      <div style="display:flex;gap:6px;margin-top:6px">
        <button style="flex:1;background:var(--pink);color:#fff;border:none;border-radius:7px;padding:6px;font-size:12px;cursor:pointer" data-dsave="${i}">保存</button>
        <button style="background:#fdecec;color:#d33;border:none;border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer" data-ddel="${i}">削除</button>
      </div>
    </div>
  `).join('');
  
  editList.querySelectorAll('[data-dsave]').forEach(b=>b.addEventListener('click',async()=>{
    const i=parseInt(b.dataset.dsave);
    const newName = editList.querySelector(`[data-d-name-i="${i}"]`).value.trim();
    const newUrl = editList.querySelector(`[data-d-url-i="${i}"]`).value.trim();
    if(!newName) return alert('名前を入力してください');
    contents.drawerLinks[i].name=newName;
    contents.drawerLinks[i].url=newUrl;
    renderDrawerLinks();await saveContents();
  }));
  editList.querySelectorAll('[data-ddel]').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('削除しますか？'))return;
    contents.drawerLinks.splice(parseInt(b.dataset.ddel),1);
    renderDrawerLinks();await saveContents();
  }));
}

function renderLinks(){
  const list=document.getElementById('linkList');
  list.innerHTML=contents.links.map((l,i)=>`
    <div style="display:flex;align-items:center;margin-bottom:10px">
      <a class="link-card" href="${esc(l.url)}" target="_blank" rel="noopener noreferrer" style="flex:1;margin-bottom:0;">
        <span class="link-card-name">${esc(l.name)}</span>
        <span class="link-card-arrow">›</span>
      </a>
    </div>
  `).join('');

  const editList=document.getElementById('linkEditList');
  editList.innerHTML=contents.links.map((l,i)=>`
    <div style="margin-bottom:10px;border:1px solid var(--border);border-radius:8px;padding:10px;background:var(--white)">
      <div style="font-size:11px;color:var(--gray);margin-bottom:2px">名前</div>
      <input class="edit-input" value="${esc(l.name)}" data-l-name-i="${i}" style="margin-bottom:6px">
      <div style="font-size:11px;color:var(--gray);margin-bottom:2px">URL</div>
      <input class="edit-input" value="${esc(l.url)}" data-l-url-i="${i}" style="margin:0">
      <div style="display:flex;gap:6px;margin-top:6px">
        <button style="flex:1;background:var(--pink);color:#fff;border:none;border-radius:7px;padding:6px;font-size:12px;cursor:pointer" data-lsave="${i}">保存</button>
        <button style="background:#fdecec;color:#d33;border:none;border-radius:7px;padding:6px 10px;font-size:12px;cursor:pointer" data-ldel="${i}">削除</button>
      </div>
    </div>
  `).join('');

  editList.querySelectorAll('[data-lsave]').forEach(b=>b.addEventListener('click',async()=>{
    const i=parseInt(b.dataset.lsave);
    const newName = editList.querySelector(`[data-l-name-i="${i}"]`).value.trim();
    const newUrl = editList.querySelector(`[data-l-url-i="${i}"]`).value.trim();
    if(!newName || !newUrl) return alert('名前とURLを入力してください');
    contents.links[i].name=newName;
    contents.links[i].url=newUrl;
    renderLinks();await saveContents();
  }));
  editList.querySelectorAll('[data-ldel]').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('削除しますか？'))return;
    contents.links.splice(parseInt(b.dataset.ldel),1);
    renderLinks();await saveContents();
  }));
}

function renderAll(){renderMustread();renderDrawerLinks();renderLinks();}

async function loadContents(){
  try{
    const data=await jsonp({action:'getTopContents'});
    if(data&&Object.keys(data).length>0){
      contents.mustread=data.mustread || DEFAULTS.mustread;
      if(data.links)contents.links=typeof data.links==='string'?JSON.parse(data.links):data.links;
      if(data.drawerLinks)contents.drawerLinks=typeof data.drawerLinks==='string'?JSON.parse(data.drawerLinks):data.drawerLinks;
    } else {
      contents.mustread = DEFAULTS.mustread;
    }
  }catch{
    contents.mustread = DEFAULTS.mustread;
  }
  renderAll();
}

async function saveContents(){
  const toSave={mustread:contents.mustread,links:JSON.stringify(contents.links),drawerLinks:JSON.stringify(contents.drawerLinks)};
  try{await jsonp({action:'saveTopContents',data:encodeURIComponent(JSON.stringify(toSave))});}catch{}
}

document.getElementById('mustreadEditBtn').addEventListener('click',()=>{
  const wrap=document.getElementById('mustreadEditWrap');
  const open=wrap.style.display==='block';
  wrap.style.display=open?'none':'block';
  if(!open)document.getElementById('mustreadText').value=contents.mustread;
});
document.getElementById('mustreadSaveBtn').addEventListener('click',async()=>{
  contents.mustread=document.getElementById('mustreadText').value.trim();
  document.getElementById('mustreadEditWrap').style.display='none';
  renderMustread();await saveContents();
});

document.getElementById('addLinkBtn').addEventListener('click',()=>{
  const f=document.getElementById('addLinkForm');f.style.display=f.style.display==='block'?'none':'block';
});
document.getElementById('newLinkSaveBtn').addEventListener('click',async()=>{
  const name=document.getElementById('newLinkName').value.trim();
  const url=document.getElementById('newLinkUrl').value.trim();
  if(!name||!url)return;
  contents.links.push({name,url});
  document.getElementById('newLinkName').value='';document.getElementById('newLinkUrl').value='';
  document.getElementById('addLinkForm').style.display='none';
  renderLinks();await saveContents();
});

document.getElementById('drawerAddBtn').addEventListener('click',()=>{
  const f=document.getElementById('drawerAddForm');f.style.display=f.style.display==='block'?'none':'block';
});
document.getElementById('drawerNewSaveBtn').addEventListener('click',async()=>{
  const name=document.getElementById('drawerNewName').value.trim();
  const url=document.getElementById('drawerNewUrl').value.trim();
  if(!name)return;
  contents.drawerLinks.push({name,url});
  document.getElementById('drawerNewName').value='';document.getElementById('drawerNewUrl').value='';
  document.getElementById('drawerAddForm').style.display='none';
  renderDrawerLinks();await saveContents();
});

loadAdmin();
renderAll();
loadContents();
applyAdmin();
</script>
</body>
</html>
