<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💎</title>
<style>
:root{
  --pink:#f4a7c0;
  --pink-dark:#e07a9e;
  --pink-light:#fce8ef;
  --bg:#fff8fb;
  --white:#fff;
  --gray:#aaa;
  --border:#f0dde7;
  --text:#333;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

header{
  background:var(--bg);
  padding:0 20px;
  height:52px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;
  border-bottom:1px solid var(--border);
}
.logo-area{font-size:14px;font-weight:700;color:var(--pink-dark);cursor:default;user-select:none;}
.hamburger{
  width:36px;height:36px;display:flex;flex-direction:column;justify-content:center;gap:5px;
  cursor:pointer;background:none;border:none;padding:4px;
}
.hamburger span{display:block;height:1.5px;background:var(--pink-dark);border-radius:2px;transition:all .25s;}
.hamburger.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
.hamburger.open span:nth-child(2){opacity:0;}
.hamburger.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}

/* ドロワー */
.drawer{
  position:fixed;top:52px;right:0;bottom:0;width:290px;
  background:var(--white);box-shadow:-2px 0 16px rgba(0,0,0,.07);
  z-index:99;transform:translateX(100%);
  transition:transform .28s cubic-bezier(.4,0,.2,1);overflow-y:auto;
}
.drawer.open{transform:translateX(0);}
.drawer-overlay{
  position:fixed;inset:0;top:52px;background:rgba(0,0,0,.15);
  z-index:98;opacity:0;pointer-events:none;transition:opacity .28s;
}
.drawer-overlay.open{opacity:1;pointer-events:auto;}
.drawer-inner{padding:18px 18px 40px;}
.drawer-section{margin-bottom:20px;}
.drawer-section-title{
  font-size:12px;font-weight:700;color:var(--pink);
  letter-spacing:.08em;margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;
}
.drawer-link-frame{
  width:100%;border:none;border-radius:10px;background:var(--bg);
  min-height:180px;display:block;
}
.drawer-divider{border:none;border-top:1px solid var(--border);margin:16px 0;}
.edit-btn{
  font-size:11px;background:none;border:1px solid var(--border);
  border-radius:6px;padding:3px 10px;cursor:pointer;color:var(--gray);display:none;
}
.url-input{
  width:100%;padding:7px 10px;border:1.5px solid var(--border);
  border-radius:8px;font-size:13px;font-family:inherit;margin-top:6px;
}
.save-btn{
  background:var(--pink);color:#fff;border:none;
  border-radius:8px;padding:7px 16px;font-size:13px;
  cursor:pointer;width:100%;margin-top:6px;
}
.url-edit-wrap{display:none;margin-top:8px;}

/* メイン */
main{padding:24px 20px 60px;max-width:440px;margin:0 auto;}
.mustread-box{
  background:var(--white);border-radius:12px;
  border:1.5px solid var(--border);
  margin-bottom:20px;overflow:hidden;
}
.mustread-header{
  font-size:11px;font-weight:700;color:var(--pink);
  letter-spacing:.08em;padding:10px 14px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.mustread-frame{width:100%;border:none;min-height:120px;display:block;background:var(--bg);}
.mustread-url-wrap{display:none;padding:10px 14px;border-top:1px solid var(--border);}

.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;
}
.section-label{font-size:13px;font-weight:800;color:var(--pink-dark);letter-spacing:.12em;text-transform:uppercase;}
.add-link-btn{
  font-size:12px;background:var(--pink-light);color:var(--pink-dark);
  border:none;border-radius:8px;padding:5px 12px;cursor:pointer;font-weight:700;display:none;
}
.link-card{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--white);border-radius:12px;padding:16px 18px;
  margin-bottom:10px;border:1.5px solid var(--border);
  text-decoration:none;color:var(--text);
}
.link-card-name{font-size:15px;font-weight:700;}
.link-card-arrow{color:var(--pink);font-size:18px;}
.link-card-del{
  background:none;border:none;color:#ddd;font-size:16px;cursor:pointer;
  margin-left:10px;display:none;flex-shrink:0;
}
.link-edit-wrap{
  background:var(--white);border-radius:12px;padding:14px;
  border:1.5px solid var(--border);margin-bottom:10px;display:none;
}
.link-edit-row{margin-bottom:8px;}
.link-edit-label{font-size:11px;color:var(--gray);margin-bottom:3px;}
.link-edit-input{
  width:100%;padding:7px 10px;border:1.5px solid var(--border);
  border-radius:8px;font-size:13px;font-family:inherit;
}
</style>
</head>
<body>

<header>
  <div class="logo-area" id="logoArea">💎</div>
  <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
</header>

<div class="drawer-overlay" id="overlay"></div>
<div class="drawer" id="drawer">
  <div class="drawer-inner">

    <!-- 必読 -->
    <div class="drawer-section">
      <div class="drawer-section-title">
        <span>⚠️ 必読</span>
        <button class="edit-btn" id="mustreadDrawerEditBtn">✏️ URL編集</button>
      </div>
      <iframe class="drawer-link-frame" id="mustreadFrame" src="" style="display:none"></iframe>
      <div id="mustreadNoUrl" style="font-size:12px;color:var(--gray);padding:8px 0">URLを設定してください</div>
      <div class="url-edit-wrap" id="mustreadDrawerEditWrap">
        <input class="url-input" id="mustreadDrawerUrl" placeholder="https://...">
        <button class="save-btn" id="mustreadDrawerSaveBtn">保存</button>
      </div>
    </div>

    <hr class="drawer-divider">

    <!-- 見方 -->
    <div class="drawer-section">
      <div class="drawer-section-title">
        <span>📖 見方</span>
        <button class="edit-btn" id="guideEditBtn">✏️ URL編集</button>
      </div>
      <iframe class="drawer-link-frame" id="guideFrame" src="" style="display:none"></iframe>
      <div id="guideNoUrl" style="font-size:12px;color:var(--gray);padding:8px 0">URLを設定してください</div>
      <div class="url-edit-wrap" id="guideEditWrap">
        <input class="url-input" id="guideUrl" placeholder="https://...">
        <button class="save-btn" id="guideSaveBtn">保存</button>
      </div>
    </div>

    <hr class="drawer-divider">

    <!-- 免責 -->
    <div class="drawer-section">
      <div class="drawer-section-title">
        <span>⚠️ 免責事項</span>
        <button class="edit-btn" id="disclaimerEditBtn">✏️ URL編集</button>
      </div>
      <iframe class="drawer-link-frame" id="disclaimerFrame" src="" style="display:none"></iframe>
      <div id="disclaimerNoUrl" style="font-size:12px;color:var(--gray);padding:8px 0">URLを設定してください</div>
      <div class="url-edit-wrap" id="disclaimerEditWrap">
        <input class="url-input" id="disclaimerUrl" placeholder="https://...">
        <button class="save-btn" id="disclaimerSaveBtn">保存</button>
      </div>
    </div>

  </div>
</div>

<!-- メイン -->
<main>

  <!-- 必読 -->
  <div class="mustread-box">
    <div class="mustread-header">
      <span>⚠️ 必読</span>
      <button class="edit-btn" id="mustreadMainEditBtn">✏️ URL編集</button>
    </div>
    <iframe class="mustread-frame" id="mustreadMainFrame" src="" style="display:none"></iframe>
    <div id="mustreadMainNoUrl" style="font-size:12px;color:var(--gray);padding:12px 14px">URLを設定してください</div>
    <div class="mustread-url-wrap" id="mustreadMainEditWrap">
      <input class="url-input" id="mustreadMainUrl" placeholder="https://...">
      <button class="save-btn" id="mustreadMainSaveBtn">保存</button>
    </div>
  </div>

  <!-- LINK -->
  <div class="section-header">
    <div class="section-label">LINK</div>
    <button class="add-link-btn" id="addLinkBtn">＋ 追加</button>
  </div>

  <div id="linkList"></div>

  <!-- 追加フォーム -->
  <div class="link-edit-wrap" id="addLinkForm">
    <div class="link-edit-row">
      <div class="link-edit-label">名前</div>
      <input class="link-edit-input" id="newLinkName" placeholder="例: 所持リスト">
    </div>
    <div class="link-edit-row">
      <div class="link-edit-label">URL</div>
      <input class="link-edit-input" id="newLinkUrl" placeholder="https://...">
    </div>
    <button class="save-btn" id="newLinkSaveBtn">追加</button>
  </div>

</main>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbzcQk2qXHLkun0bAgOYsFJiATESW-eju6s8ZqplZwvxXr94hpmZKmzLqIu5UaHRDTzU/exec';
const ADMIN_PASSWORD='0703clarinet';
let cbIdx=0;
function jsonp(params){
  return new Promise((resolve,reject)=>{
    const name='_cb'+cbIdx++;const s=document.createElement('script');
    const timer=setTimeout(()=>{delete window[name];s.remove();reject();},12000);
    window[name]=(d)=>{clearTimeout(timer);delete window[name];s.remove();resolve(d);};
    s.onerror=()=>{clearTimeout(timer);delete window[name];s.remove();reject();};
    s.src=GAS_URL+'?'+new URLSearchParams({...params,callback:name});
    document.body.appendChild(s);
  });
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// ドロワー
const hamburger=document.getElementById('hamburger');
const drawer=document.getElementById('drawer');
const overlay=document.getElementById('overlay');
function toggleDrawer(){
  const open=drawer.classList.contains('open');
  drawer.classList.toggle('open',!open);
  overlay.classList.toggle('open',!open);
  hamburger.classList.toggle('open',!open);
}
hamburger.addEventListener('click',toggleDrawer);
overlay.addEventListener('click',toggleDrawer);

// 管理者
let isAdmin=false;
function loadAdmin(){try{isAdmin=sessionStorage.getItem('top_admin')==='1';}catch{}}
function applyAdmin(){
  document.querySelectorAll('.edit-btn').forEach(b=>b.style.display=isAdmin?'inline-block':'none');
  document.getElementById('addLinkBtn').style.display=isAdmin?'inline-block':'none';
  document.querySelectorAll('.link-card-del').forEach(b=>b.style.display=isAdmin?'inline-block':'none');
  if(isAdmin)document.getElementById('mustreadMainEditBtn').style.display='inline-block';
}
let _tap=0,_tapT=null;
document.getElementById('logoArea').addEventListener('click',()=>{
  _tap++;clearTimeout(_tapT);
  _tapT=setTimeout(()=>{_tap=0;},1500);
  if(_tap>=5){
    _tap=0;
    if(isAdmin){isAdmin=false;try{sessionStorage.removeItem('top_admin');}catch{}applyAdmin();}
    else{
      const pw=prompt('パスワード');
      if(pw===ADMIN_PASSWORD){isAdmin=true;try{sessionStorage.setItem('top_admin','1');}catch{}applyAdmin();}
      else if(pw!==null)alert('パスワードが違います');
    }
  }
});

// コンテンツ
const DEFAULTS={
  mustreadUrl:'',
  guideUrl:'',
  disclaimerUrl:'',
  links:[
    {name:'求めリスト',url:'../wishlist-app/'},
    {name:'所持リスト',url:'https://noyu-web.github.io/video-list/'}
  ]
};
let contents={...DEFAULTS,links:[...DEFAULTS.links]};

function setFrame(frameId,noUrlId,url){
  const frame=document.getElementById(frameId);
  const noUrl=document.getElementById(noUrlId);
  if(url){
    frame.src=url;frame.style.display='block';noUrl.style.display='none';
  }else{
    frame.style.display='none';noUrl.style.display='block';
  }
}

function renderContents(){
  setFrame('mustreadFrame','mustreadNoUrl',contents.mustreadUrl);
  setFrame('mustreadMainFrame','mustreadMainNoUrl',contents.mustreadUrl);
  setFrame('guideFrame','guideNoUrl',contents.guideUrl);
  setFrame('disclaimerFrame','disclaimerNoUrl',contents.disclaimerUrl);
  renderLinks();
}

function renderLinks(){
  const list=document.getElementById('linkList');
  list.innerHTML=contents.links.map((l,i)=>`
    <div style="display:flex;align-items:center;margin-bottom:10px">
      <a class="link-card" href="${esc(l.url)}" style="flex:1">
        <span class="link-card-name">${esc(l.name)}</span>
        <span class="link-card-arrow">›</span>
      </a>
      <button class="link-card-del" data-del="${i}" style="display:${isAdmin?'inline-block':'none'}">🗑️</button>
    </div>
  `).join('');
  list.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('削除しますか？'))return;
    contents.links.splice(parseInt(b.dataset.del),1);
    renderLinks();
    await saveContents();
  }));
}

async function loadContents(){
  try{
    const data=await jsonp({action:'getTopContents'});
    if(data&&Object.keys(data).length>0){
      contents={...DEFAULTS,...data};
      if(typeof contents.links==='string')contents.links=JSON.parse(contents.links);
    }
  }catch{}
  renderContents();
}

async function saveContents(){
  const toSave={...contents,links:JSON.stringify(contents.links)};
  try{await jsonp({action:'saveTopContents',data:encodeURIComponent(JSON.stringify(toSave))});}catch{}
}

// URL編集のセットアップ
function setupUrlEditor(editBtnId,wrapId,inputId,saveBtnId,key,cb){
  document.getElementById(editBtnId).addEventListener('click',()=>{
    const wrap=document.getElementById(wrapId);
    const isOpen=wrap.style.display==='block';
    wrap.style.display=isOpen?'none':'block';
    if(!isOpen)document.getElementById(inputId).value=contents[key]||'';
  });
  document.getElementById(saveBtnId).addEventListener('click',async()=>{
    contents[key]=document.getElementById(inputId).value.trim();
    document.getElementById(wrapId).style.display='none';
    if(cb)cb();
    renderContents();
    await saveContents();
  });
}

setupUrlEditor('mustreadDrawerEditBtn','mustreadDrawerEditWrap','mustreadDrawerUrl','mustreadDrawerSaveBtn','mustreadUrl');
setupUrlEditor('mustreadMainEditBtn','mustreadMainEditWrap','mustreadMainUrl','mustreadMainSaveBtn','mustreadUrl');
setupUrlEditor('guideEditBtn','guideEditWrap','guideUrl','guideSaveBtn','guideUrl');
setupUrlEditor('disclaimerEditBtn','disclaimerEditWrap','disclaimerUrl','disclaimerSaveBtn','disclaimerUrl');

// リンク追加
document.getElementById('addLinkBtn').addEventListener('click',()=>{
  const form=document.getElementById('addLinkForm');
  form.style.display=form.style.display==='block'?'none':'block';
});
document.getElementById('newLinkSaveBtn').addEventListener('click',async()=>{
  const name=document.getElementById('newLinkName').value.trim();
  const url=document.getElementById('newLinkUrl').value.trim();
  if(!name||!url)return;
  contents.links.push({name,url});
  document.getElementById('newLinkName').value='';
  document.getElementById('newLinkUrl').value='';
  document.getElementById('addLinkForm').style.display='none';
  renderLinks();
  await saveContents();
});

// init
loadAdmin();
renderContents();
loadContents();
applyAdmin();
</script>
</body>
</html>
