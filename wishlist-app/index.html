<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欲しいものリスト</title>
<style>
:root{--pink:#f4a7c0;--pink-dark:#e07a9e;--pink-light:#fce8ef;--gray:#999;--border:#eee;--white:#fff;--bg:#fff8fb;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:var(--bg);color:#333;padding-bottom:80px;}
header{background:var(--white);padding:14px 16px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;}
.header-title{font-size:17px;font-weight:700;color:var(--pink-dark);}
.tabbar{display:flex;background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:49px;z-index:49;}
.tabbar button{flex:1;padding:12px;border:none;background:none;font-size:14px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;}
.tabbar button.active{color:var(--pink-dark);border-bottom-color:var(--pink);}
.page{display:none;padding:14px;}
.page.active{display:block;}

/* リスト */
.filter-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;}
.filter-chip{padding:5px 12px;border:1.5px solid var(--border);border-radius:16px;font-size:12px;background:var(--white);white-space:nowrap;cursor:pointer;}
.filter-chip.selected{background:var(--pink);color:#fff;border-color:var(--pink);}
.search-input{width:100%;padding:9px 14px;border:1.5px solid var(--border);border-radius:20px;font-size:13px;outline:none;background:var(--white);margin-bottom:10px;}
.search-input:focus{border-color:var(--pink);}
.card{background:var(--white);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.05);position:relative;}
.card.done{opacity:.55;}
.card-title{font-size:14px;font-weight:700;margin-bottom:4px;}
.card-title.done{text-decoration:line-through;}
.card-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--pink-light);color:var(--pink-dark);}
.tag-priority-high{background:#ffe1e1;color:#d33;}
.tag-priority-mid{background:#fff3cd;color:#a67c00;}
.tag-priority-low{background:#e7f3ff;color:#3a7bd5;}
.tag-trading{background:#d1f5e0;color:#1f8a4c;}
.card-date{font-size:11px;color:var(--gray);margin-top:4px;}
.card-actions{display:flex;gap:8px;margin-top:8px;}
.btn-sm{font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:var(--white);cursor:pointer;}
.btn-sm.primary{background:var(--pink);color:#fff;border-color:var(--pink);}
.fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--pink);color:#fff;border:none;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer;z-index:60;}
.empty{text-align:center;color:var(--gray);font-size:13px;padding:40px 0;}

/* モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.hidden{display:none;}
.hidden{display:none!important;}
.modal{background:var(--white);border-radius:16px;width:100%;max-width:420px;padding:20px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:700;color:var(--pink-dark);margin-bottom:14px;}
.form-group{margin-bottom:12px;}
.form-label{font-size:12px;color:var(--gray);display:block;margin-bottom:4px;}
.form-input,.form-select,.form-textarea{width:100%;padding:9px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:var(--white);font-family:inherit;}
.form-textarea{min-height:70px;resize:vertical;}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:5px 12px;border:1.5px solid var(--border);border-radius:16px;font-size:12px;background:var(--white);cursor:pointer;}
.chip.selected{background:var(--pink);color:#fff;border-color:var(--pink);}
.modal-btns{display:flex;gap:8px;margin-top:16px;}
.modal-btns button{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;}
.btn-save{background:var(--pink);color:#fff;}
.btn-cancel{background:#f0f0f0;color:#666;}
.btn-delete{background:#fdecec;color:#d33;}

/* ガイド */
.guide-section{background:var(--white);border-radius:12px;padding:14px;margin-bottom:12px;}
.guide-section h3{font-size:14px;color:var(--pink-dark);margin:0 0 8px;}
.guide-section p,.guide-section li{font-size:13px;line-height:1.7;color:#444;}
.guide-edit-area{width:100%;min-height:120px;font-size:13px;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;}
</style>
</head>
<body>

<header style="display:flex;justify-content:space-between;align-items:center">
  <div class="header-title" id="headerTitle" style="cursor:default">📋 リスト＆ガイド</div>
  <button id="authBtn" style="background:none;border:none;cursor:default;opacity:0;font-size:1px;padding:2px;width:20px;height:20px"></button>
</header>
<div class="tabbar">
  <button class="tab-btn active" data-tab="list">欲しいもの</button>
  <button class="tab-btn" data-tab="guide">使い方</button>
</div>

<!-- 欲しいものリスト -->
<div class="page active" id="page-list">
  <input class="search-input" id="searchInput" type="search" placeholder="タイトル・出演者・メモで検索…">
  <div class="filter-bar" id="genreFilterBar"></div>
  <div class="filter-bar" id="statusFilterBar">
    <button class="filter-chip selected" data-status="all">すべて</button>
    <button class="filter-chip" data-status="active">探し中</button>
    <button class="filter-chip" data-status="trading">取引中</button>
    <button class="filter-chip" data-status="done">入手済み</button>
  </div>
  <div id="cardList"></div>
</div>

<!-- 使い方ガイド -->
<div class="page" id="page-guide">
  <div class="guide-section">
    <h3>📖 動画リストアプリの使い方</h3>
    <div id="guideView"></div>
    <div id="guideEditWrap" style="display:none;margin-top:10px">
      <textarea class="guide-edit-area" id="guideEditArea"></textarea>
      <div class="modal-btns">
        <button class="btn-save" id="guideSaveBtn">保存</button>
      </div>
    </div>
    <div style="margin-top:10px;text-align:right">
      <button class="btn-sm" id="guideEditToggle">編集</button>
    </div>
  </div>
</div>


<!-- ログインモーダル -->
<div class="modal-overlay hidden" id="authModal">
  <div class="modal">
    <div class="modal-title">管理者ログイン</div>
    <div class="form-group">
      <input class="form-input" id="authPassword" type="password" placeholder="パスワード">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="authCancelBtn">キャンセル</button>
      <button class="btn-save" id="authLoginBtn">ログイン</button>
    </div>
  </div>
</div>
<button class="fab hidden" id="addBtn">＋</button>

<!-- 追加・編集モーダル -->
<div class="modal-overlay hidden" id="editModal">
  <div class="modal">
    <div class="modal-title" id="editModalTitle">追加</div>
    <div class="form-group">
      <label class="form-label">タイトル</label>
      <input class="form-input" id="f-title" placeholder="例: ◯◯ DVD">
    </div>
    <div class="form-group">
      <label class="form-label">ジャンル</label>
      <div class="chip-row" id="f-genre-chips"></div>
    </div>
    <div class="form-group">
      <label class="form-label">日付</label>
      <input class="form-input" id="f-date" type="date">
    </div>
    <div class="form-group">
      <label class="form-label">出演者</label>
      <input class="form-input" id="f-members" placeholder="例: 田中樹, ジェシー（カンマ区切り）">
    </div>
    <div class="form-group">
      <label class="form-label">優先度（任意）</label>
      <div class="chip-row" id="f-priority-chips">
        <button class="chip" data-priority="">なし</button>
        <button class="chip" data-priority="high">高</button>
        <button class="chip" data-priority="mid">中</button>
        <button class="chip" data-priority="low">低</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">ステータス</label>
      <div class="chip-row" id="f-status-chips">
        <button class="chip selected" data-status="active">探し中</button>
        <button class="chip" data-status="trading">取引中</button>
        <button class="chip" data-status="done">入手済み</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">メモ</label>
      <textarea class="form-textarea" id="f-note" placeholder="備考など"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="cancelBtn">キャンセル</button>
      <button class="btn-delete hidden" id="deleteBtn">削除</button>
      <button class="btn-save" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<script>
const GENRES=['配信関連','円盤','バラエティー番組','ドラマ・映画','Radio','FC・FCweb','SixTONES以外','その他'];
let items=[];
let editingId=null;
let genreFilter='all';
let statusFilter='all';
let searchQuery='';

const GAS_URL='https://script.google.com/macros/s/AKfycbzcQk2qXHLkun0bAgOYsFJiATESW-eju6s8ZqplZwvxXr94hpmZKmzLqIu5UaHRDTzU/exec';
let cbIdx=0;
function jsonp(params){
  return new Promise((resolve,reject)=>{
    const name='_cb'+cbIdx++;const s=document.createElement('script');
    const timer=setTimeout(()=>{delete window[name];s.remove();reject(new Error('timeout'));},15000);
    window[name]=(d)=>{clearTimeout(timer);delete window[name];s.remove();resolve(d);};
    s.onerror=()=>{clearTimeout(timer);delete window[name];s.remove();reject(new Error('network'));};
    s.src=GAS_URL+'?'+new URLSearchParams({...params,callback:name});
    document.body.appendChild(s);
  });
}
async function load(){
  try{
    const data=await jsonp({action:'getWishlist'});
    items=Array.isArray(data)?data:[];
  }catch{items=[];}
}
async function saveItemToServer(item,isNew){
  try{await jsonp({action:'saveWishlistItem',data:encodeURIComponent(JSON.stringify({item,isNew}))});}catch{}
}
async function deleteItemFromServer(id){
  try{await jsonp({action:'deleteWishlistItem',id});}catch{}
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderGenreFilterBar(){
  const wrap=document.getElementById('genreFilterBar');
  const all=['all',...GENRES];
  wrap.innerHTML=all.map(g=>`<button class="filter-chip${genreFilter===g?' selected':''}" data-genre="${esc(g)}">${g==='all'?'全ジャンル':esc(g)}</button>`).join('');
  wrap.querySelectorAll('[data-genre]').forEach(b=>b.addEventListener('click',()=>{
    genreFilter=b.dataset.genre;renderGenreFilterBar();renderList();
  }));
}

function statusLabel(s){
  return s==='trading'?'取引中':s==='done'?'入手済み':'探し中';
}
function statusTagClass(s){
  return s==='trading'?'tag-trading':s==='done'?'tag tag-priority-low':'tag';
}
function priorityLabel(p){
  return p==='high'?'優先度: 高':p==='mid'?'優先度: 中':p==='low'?'優先度: 低':'';
}
function priorityClass(p){
  return p==='high'?'tag-priority-high':p==='mid'?'tag-priority-mid':p==='low'?'tag-priority-low':'';
}

function renderList(){
  const list=document.getElementById('cardList');
  let data=[...items];

  if(genreFilter!=='all')data=data.filter(it=>it.genre===genreFilter);
  if(statusFilter!=='all')data=data.filter(it=>(it.status||'active')===statusFilter);
  if(searchQuery){
    const q=searchQuery.toLowerCase();
    data=data.filter(it=>
      String(it.title).toLowerCase().includes(q)||
      String(it.members||'').toLowerCase().includes(q)||
      String(it.note||'').toLowerCase().includes(q)
    );
  }

  // 並び順: 探し中/取引中を優先、優先度高い順、新しい順
  const statusOrder={active:0,trading:0,done:1};
  const prioOrder={high:0,mid:1,low:2,'':3};
  data.sort((a,b)=>{
    const sd=(statusOrder[a.status||'active']??0)-(statusOrder[b.status||'active']??0);
    if(sd!==0)return sd;
    const pd=(prioOrder[a.priority||'']??3)-(prioOrder[b.priority||'']??3);
    if(pd!==0)return pd;
    return (b.createdAt||0)-(a.createdAt||0);
  });

  if(!data.length){
    list.innerHTML='<div class="empty">該当する項目がありません</div>';
    return;
  }

  list.innerHTML=data.map(it=>`
    <div class="card ${it.status==='done'?'done':''}" data-id="${it.id}">
      <div class="card-title ${it.status==='done'?'done':''}">${esc(it.title)}</div>
      <div class="card-meta">
        ${it.genre?`<span class="tag">${esc(it.genre)}</span>`:''}
        ${(it.members||'').split(',').map(m=>m.trim()).filter(Boolean).map(m=>`<span class="tag">${esc(m)}</span>`).join('')}
        ${it.status&&it.status!=='active'?`<span class="tag ${statusTagClass(it.status)}">${statusLabel(it.status)}</span>`:''}
        ${it.priority?`<span class="tag ${priorityClass(it.priority)}">${priorityLabel(it.priority)}</span>`:''}
      </div>
      ${it.date?`<div class="card-date">📅 ${esc(it.date)}</div>`:''}
      ${it.note?`<div class="card-date">📝 ${esc(it.note)}</div>`:''}
      ${isAdmin?`<div class="card-actions">
        <button class="btn-sm" data-edit="${it.id}">編集</button>
        <button class="btn-sm primary" data-toggle="${it.id}">${it.status==='done'?'未入手に戻す':'入手済みにする'}</button>
      </div>`:''}
    </div>
  `).join('');

  list.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openEditModal(b.dataset.edit)));
  list.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',async()=>{
    const it=items.find(x=>x.id===b.dataset.toggle);
    if(it){it.status=it.status==='done'?'active':'done';renderList();await saveItemToServer(it,false);}
  }));
}

// === 編集モーダル ===
function renderGenreChips(selected){
  const wrap=document.getElementById('f-genre-chips');
  wrap.innerHTML=GENRES.map(g=>`<button class="chip${g===selected?' selected':''}" data-g="${esc(g)}">${esc(g)}</button>`).join('');
  wrap.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
    wrap.querySelectorAll('.chip').forEach(x=>x.classList.remove('selected'));
    c.classList.add('selected');
  }));
}

function openEditModal(id=null){
  editingId=id;
  const it=id?items.find(x=>x.id===id):null;
  document.getElementById('editModalTitle').textContent=it?'編集':'追加';
  document.getElementById('f-title').value=it?it.title:'';
  document.getElementById('f-date').value=it?(it.date||''):'';
  document.getElementById('f-members').value=it?(it.members||''):'';
  document.getElementById('f-note').value=it?(it.note||''):'';
  renderGenreChips(it?it.genre:GENRES[0]);

  document.querySelectorAll('#f-priority-chips .chip').forEach(c=>c.classList.toggle('selected',c.dataset.priority===(it?(it.priority||''):'')));
  document.querySelectorAll('#f-status-chips .chip').forEach(c=>c.classList.toggle('selected',c.dataset.status===(it?(it.status||'active'):'active')));

  document.getElementById('deleteBtn').classList.toggle('hidden',!it);
  document.getElementById('editModal').classList.remove('hidden');
}

document.querySelectorAll('#f-priority-chips .chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('#f-priority-chips .chip').forEach(x=>x.classList.remove('selected'));
  c.classList.add('selected');
}));
document.querySelectorAll('#f-status-chips .chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('#f-status-chips .chip').forEach(x=>x.classList.remove('selected'));
  c.classList.add('selected');
}));

document.getElementById('addBtn').addEventListener('click',()=>openEditModal());
document.getElementById('cancelBtn').addEventListener('click',()=>document.getElementById('editModal').classList.add('hidden'));

document.getElementById('saveBtn').addEventListener('click',async()=>{
  const title=document.getElementById('f-title').value.trim();
  if(!title){alert('タイトルを入力してください');return;}
  const genre=document.querySelector('#f-genre-chips .chip.selected')?.dataset.g||'';
  const priority=document.querySelector('#f-priority-chips .chip.selected')?.dataset.priority||'';
  const status=document.querySelector('#f-status-chips .chip.selected')?.dataset.status||'active';
  const date=document.getElementById('f-date').value;
  const members=document.getElementById('f-members').value.trim();
  const note=document.getElementById('f-note').value.trim();

  let item,isNew=false;
  if(editingId){
    item=items.find(x=>x.id===editingId);
    Object.assign(item,{title,genre,priority,status,date,members,note});
  }else{
    item={id:Date.now().toString(),title,genre,priority,status,date,members,note,createdAt:Date.now()};
    items.push(item);
    isNew=true;
  }
  document.getElementById('editModal').classList.add('hidden');
  renderList();
  await saveItemToServer(item,isNew);
});

document.getElementById('deleteBtn').addEventListener('click',async()=>{
  if(!confirm('削除しますか？'))return;
  const id=editingId;
  items=items.filter(x=>x.id!==id);
  document.getElementById('editModal').classList.add('hidden');
  renderList();
  await deleteItemFromServer(id);
});

// ステータスフィルター
document.getElementById('statusFilterBar').querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>{
  statusFilter=b.dataset.status;
  document.getElementById('statusFilterBar').querySelectorAll('[data-status]').forEach(x=>x.classList.remove('selected'));
  b.classList.add('selected');
  renderList();
}));

document.getElementById('searchInput').addEventListener('input',e=>{
  searchQuery=e.target.value;renderList();
});

// === タブ切り替え ===
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  document.getElementById('page-'+b.dataset.tab).classList.add('active');
}));

// === 使い方ガイド ===
const DEFAULT_GUIDE=`■ 動画リストアプリについて
SixTONESの所持動画を、ジャンル別に一覧できるアプリです。

■ 見方
・上部のタブでジャンルを切り替えられます
・「年タブ」で公演年ごとに絞り込めます
・並び替えで「公演日が新しい順」などに変更できます
・出演者タグをタップすると、その人が出ている作品を全ジャンルから一覧できます

■ 交換可否について
・交換可：交換できます
・一部交換可：一部のみ交換可能
・要相談：内容により応相談
・交換不可：交換できません

■ 注意事項
このサイトで所持リストを作ることはできません。`;

let _guideText=null;
async function getGuide(){
  if(_guideText!==null)return _guideText;
  try{
    const res=await jsonp({action:'getGuideText'});
    _guideText=(res&&res.text)?res.text:DEFAULT_GUIDE;
  }catch{
    _guideText=DEFAULT_GUIDE;
  }
  return _guideText;
}
async function renderGuide(){
  const t=await getGuide();
  document.getElementById('guideView').innerHTML=esc(t).replace(/\n/g,'<br>');
}
document.getElementById('guideEditToggle').addEventListener('click',async()=>{
  const ew=document.getElementById('guideEditWrap');
  const isHidden=ew.style.display==='none';
  ew.style.display=isHidden?'block':'none';
  if(isHidden)document.getElementById('guideEditArea').value=await getGuide();
  document.getElementById('guideEditToggle').textContent=isHidden?'閉じる':'編集';
});
document.getElementById('guideSaveBtn').addEventListener('click',async()=>{
  const t=document.getElementById('guideEditArea').value;
  _guideText=t;
  renderGuide();
  try{await jsonp({action:'saveGuideText',data:encodeURIComponent(t)});}catch{}
  alert('保存しました');
});


// === 管理者モード ===
const ADMIN_PASSWORD='0703clarinet';
let isAdmin=false;
function loadAdminState(){
  try{isAdmin=sessionStorage.getItem('wishlist_admin')==='1';}catch{isAdmin=false;}
}
function applyAdminUI(){
  document.getElementById('addBtn').classList.toggle('hidden',!isAdmin);
  document.getElementById('guideEditToggle').style.display=isAdmin?'':'none';
}
let _tapCount=0,_tapTimer=null;
document.getElementById('headerTitle').addEventListener('click',()=>{
  _tapCount++;
  clearTimeout(_tapTimer);
  _tapTimer=setTimeout(()=>{_tapCount=0;},1500);
  if(_tapCount>=5){
    _tapCount=0;
    if(isAdmin){
      isAdmin=false;
      try{sessionStorage.removeItem('wishlist_admin');}catch{}
      applyAdminUI();renderList();
    }else{
      document.getElementById('authModal').classList.remove('hidden');
      document.getElementById('authPassword').value='';
    }
  }
});
document.getElementById('authCancelBtn').addEventListener('click',()=>{
  document.getElementById('authModal').classList.add('hidden');
});
document.getElementById('authLoginBtn').addEventListener('click',()=>{
  if(document.getElementById('authPassword').value===ADMIN_PASSWORD){
    isAdmin=true;
    try{sessionStorage.setItem('wishlist_admin','1');}catch{}
    document.getElementById('authModal').classList.add('hidden');
    applyAdminUI();renderList();
  }else{
    alert('パスワードが違います');
  }
});

// === init ===
(async()=>{
  await load();
  loadAdminState();
  renderGenreFilterBar();
  renderList();
  applyAdminUI();
  await renderGuide();
})();
</script>
<div style="text-align:center;color:#ccc;font-size:10px;padding:10px 0">build: 0614b</div>
</body>
</html>
