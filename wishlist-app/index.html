<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>求めリスト</title>
<style>
:root{--pink:#f4a7c0;--pink-dark:#e07a9e;--pink-light:#fce8ef;--gray:#999;--border:#eee;--white:#fff;--bg:#fff8fb;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:var(--bg);color:#333;padding-bottom:90px;}
header{background:var(--white);padding:10px 14px;min-height:56px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.header-left{min-width:78px;display:flex;align-items:center;}
.header-title{flex:1;text-align:center;font-size:17px;font-weight:700;color:var(--pink-dark);}
.header-right{min-width:78px;display:flex;align-items:center;justify-content:flex-end;gap:6px;}
.login-btn{background:var(--white);color:var(--pink-dark);border:1.5px solid var(--pink-dark);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.mode-badge{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:700;border:none;background:var(--pink-dark);color:#fff;cursor:pointer;font-family:inherit;}
.search-btn{background:var(--pink-dark);color:#fff;border:none;border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;}
.search-btn .fb{background:#fff;color:var(--pink-dark);border-radius:10px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;line-height:18px;display:none;}
.search-btn.has .fb{display:inline-block;}
.page{padding:14px;}
.active-bar{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:10px;}
.active-bar:empty{display:none;}
.af-chip{padding:4px 11px;border-radius:20px;border:1.5px solid var(--pink);background:var(--pink-light);color:var(--pink-dark);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
.list-count{font-size:12px;color:var(--gray);padding:0 0 10px;}
.card{background:var(--white);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.05);position:relative;}
.card.done{opacity:.55;}
.card-title{font-size:14px;font-weight:700;margin-bottom:4px;word-break:break-all;}
.card-title.done{text-decoration:line-through;}
.card-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.tag{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--pink-light);color:var(--pink-dark);}
.tag-priority-high{background:#ffe1e1;color:#d33;}
.tag-priority-mid{background:#fff3cd;color:#a67c00;}
.tag-priority-low{background:#e7f3ff;color:#3a7bd5;}
.tag-trading{background:#d1f5e0;color:#1f8a4c;}
.card-date{font-size:11px;color:var(--gray);margin-top:4px;word-break:break-all;}
.card-actions{display:flex;gap:8px;margin-top:8px;}
.btn-sm{font-size:11px;padding:4px 10px;border-radius:8px;border:1px solid var(--border);background:var(--white);cursor:pointer;font-family:inherit;}
.fab{position:fixed;bottom:24px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--pink);color:#fff;border:none;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.2);cursor:pointer;z-index:60;}
.empty{text-align:center;color:var(--gray);font-size:13px;padding:40px 0;}
.loading{text-align:center;padding:40px;color:var(--gray);font-size:14px;}
.wave span{display:inline-block;color:var(--pink-dark);font-weight:700;font-size:16px;letter-spacing:.05em;animation:wave 1.2s ease-in-out infinite;}
@keyframes wave{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}}

/* モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.hidden{display:none!important;}
.modal{background:var(--white);border-radius:16px;width:100%;max-width:420px;padding:20px;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:700;color:var(--pink-dark);margin-bottom:14px;}
.form-group{margin-bottom:12px;}
.form-label{font-size:12px;color:var(--gray);display:block;margin-bottom:4px;}
.form-input,.form-select,.form-textarea{width:100%;padding:9px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:var(--white);font-family:inherit;}
.form-input:focus,.form-textarea:focus{border-color:var(--pink);}
.form-textarea{min-height:70px;resize:vertical;}
.chips-grid,.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:5px 12px;border:1.5px solid var(--border);border-radius:16px;font-size:12px;background:var(--white);cursor:pointer;font-family:inherit;color:#555;}
.chip.selected{background:var(--pink);color:#fff;border-color:var(--pink);}
.modal-btns{display:flex;gap:8px;margin-top:16px;}
.modal-btns button{flex:1;padding:11px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;font-family:inherit;}
.btn-save{background:var(--pink);color:#fff;}
.btn-cancel{background:#f0f0f0;color:#666;}
.btn-delete{background:#fdecec;color:#d33;}

/* 検索フィルター */
.fs-modal{display:flex;flex-direction:column;padding:0;max-height:88vh;overflow:hidden;}
.fs-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;}
.fs-body{padding:4px 20px 6px;overflow-y:auto;flex:1;}
.fs-foot{display:flex;gap:8px;padding:12px 20px 18px;border-top:1px solid var(--border);}
.fs-foot button{padding:11px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;font-family:inherit;}
.fs-foot .btn-cancel{flex:0 0 auto;padding:11px 18px;}
.fs-foot .btn-save{flex:1;}
.fs-sec{margin-bottom:18px;}
.fs-label{font-size:12px;font-weight:700;color:var(--pink-dark);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.fs-label small{color:var(--gray);font-weight:500;font-size:11px;}
.fs-others{margin-top:8px;}
.fs-others summary{font-size:12px;font-weight:600;color:var(--gray);cursor:pointer;padding:4px 0;margin-bottom:6px;}
.x-btn{background:none;border:none;font-size:20px;color:var(--gray);cursor:pointer;}

/* NEW・所持照合・一括選択 */
.new-badge{display:inline-block;background:var(--pink-dark);color:#fff;font-size:9px;font-weight:800;border-radius:6px;padding:1px 6px;margin-right:6px;letter-spacing:.06em;vertical-align:middle;}
.admin-bar{padding:0 0 10px;}
.admin-bar button{background:var(--pink-light);color:var(--pink-dark);border:1.5px solid var(--pink);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
.sel-box{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:7px;border:2px solid var(--border);color:transparent;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;background:#fff;}
.card.sel{outline:2px solid var(--pink-dark);background:var(--pink-light);}
.card.sel .sel-box{background:var(--pink-dark);border-color:var(--pink-dark);color:#fff;}
.card.has-sel .card-title{padding-right:30px;}
body.selecting .fab{display:none;}
body.selecting{padding-bottom:110px;}
.bulk-bar{position:fixed;left:0;right:0;bottom:0;z-index:150;background:var(--white);border-top:2px solid var(--pink-light);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;box-shadow:0 -4px 14px rgba(0,0,0,.08);}
.bulk-bar .bulk-count{flex:1;font-size:13px;font-weight:700;color:var(--pink-dark);}
.bulk-bar button{padding:8px 12px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--pink-dark);color:#fff;font-size:13px;font-weight:700;padding:9px 20px;border-radius:24px;opacity:0;pointer-events:none;transition:all .25s;z-index:400;}
.toast.show{opacity:1;transform:translateX(-50%);}

/* ログイン */
.steps{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.step{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--gray);opacity:.55;}
.step b{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--border);color:var(--gray);font-size:12px;}
.step.on{opacity:1;color:var(--pink-dark);}
.step.on b{background:var(--pink-dark);color:#fff;}
.step-line{flex:1;height:2px;background:var(--border);border-radius:2px;}
.step-desc{font-size:13px;line-height:1.7;color:#333;margin-bottom:12px;}
.login-msg{font-size:12.5px;color:var(--pink-dark);line-height:1.6;min-height:20px;margin-top:12px;}
.big-btn{width:100%;background:var(--pink-dark);color:#fff;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
.big-btn:disabled{opacity:.5;cursor:default;}
.code-input{width:100%;text-align:center;font-size:24px;letter-spacing:.4em;padding:10px;border:1.5px solid var(--border);border-radius:10px;font-family:inherit;margin-bottom:10px;outline:none;}
.code-input:focus{border-color:var(--pink);}
.link-btn{display:block;margin:12px auto 0;background:none;border:none;color:var(--pink-dark);font-size:12px;cursor:pointer;font-family:inherit;text-decoration:underline;}
.link-btn:disabled{opacity:.45;text-decoration:none;cursor:default;}
</style>
</head>
<body>

<header>
  <div class="header-left"><button class="login-btn" id="loginBtn">ログイン</button></div>
  <div class="header-title">求めリスト</div>
  <div class="header-right">
    <button class="mode-badge hidden" id="modeBadge">管理者モード</button>
    <button class="search-btn" id="searchBtn">🔍 検索<span class="fb" id="filterBadge">0</span></button>
  </div>
</header>

<div class="page">
  <div class="admin-bar hidden" id="adminBar"><button id="selectBtn">☑ 選択</button></div>
  <div class="active-bar" id="activeBar"></div>
  <div class="list-count" id="listCount"></div>
  <div id="cardList"></div>
</div>

<button class="fab hidden" id="addBtn">＋</button>

<!-- 検索・絞り込み -->
<div class="modal-overlay hidden" id="filterModal">
  <div class="modal fs-modal">
    <div class="fs-head">
      <div class="modal-title" style="margin-bottom:0">🔍 検索・絞り込み</div>
      <button class="x-btn" id="filterCloseBtn">✕</button>
    </div>
    <div class="fs-body" id="filterBody"></div>
    <div class="fs-foot">
      <button class="btn-cancel" id="filterResetBtn">リセット</button>
      <button class="btn-cancel" id="filterShareBtn" title="この条件のリンクをコピー">🔗</button>
      <button class="btn-save" id="filterApplyBtn">表示する</button>
    </div>
  </div>
</div>

<!-- 一括操作 -->
<div class="bulk-bar hidden" id="bulkBar">
  <span class="bulk-count" id="bulkCount">0件選択</span>
  <button id="bulkAllBtn" style="background:#f0f0f0;color:#666">全選択</button>
  <button id="bulkActBtn" style="background:var(--pink-dark);color:#fff">操作</button>
  <button id="bulkDoneBtn" style="background:var(--pink-light);color:var(--pink-dark)">完了</button>
</div>
<div class="modal-overlay hidden" id="bulkModal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div class="modal-title" style="margin-bottom:0" id="bulkTitle">一括操作</div>
      <button class="x-btn" id="bulkCloseBtn">✕</button>
    </div>
    <div id="bulkForm">
      <div class="form-group">
        <label class="form-label">ステータスをまとめて変更</label>
        <div style="display:flex;gap:6px">
          <select class="form-select" id="bulkStatus"><option value="active">探し中</option><option value="trading">取引中</option><option value="done">入手済み</option></select>
          <button class="btn-save" id="bulkStatusApply" style="flex-shrink:0;padding:0 16px;border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;font-family:inherit">変更</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">優先度をまとめて変更</label>
        <div style="display:flex;gap:6px">
          <select class="form-select" id="bulkPriority"><option value="">なし</option><option value="high">高</option><option value="mid">中</option><option value="low">低</option></select>
          <button class="btn-save" id="bulkPriorityApply" style="flex-shrink:0;padding:0 16px;border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;font-family:inherit">変更</button>
        </div>
      </div>
      <div class="form-group">
        <button id="bulkDelete" style="width:100%;background:#fdecec;color:#d33;padding:11px;border-radius:10px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit">選んだ項目を削除</button>
      </div>
    </div>
    <div id="bulkProgress" class="hidden" style="text-align:center;font-size:14px;padding:24px 0;color:var(--pink-dark);font-weight:700"></div>
  </div>
</div>
<!-- 所持リストへ追加 -->
<div class="modal-overlay hidden" id="ownModal">
  <div class="modal">
    <div class="modal-title">📦 所持リストに追加</div>
    <div class="form-group"><label class="form-label">追加先</label>
      <select class="form-select" id="own-dest"><option value="1">所持リスト①</option><option value="2">所持リスト②</option></select></div>
    <div class="form-group"><label class="form-label">タイトル</label><input class="form-input" id="own-title"></div>
    <div class="form-group"><label class="form-label">交換</label>
      <select class="form-select" id="own-ex"><option value="consult">要相談</option><option value="ok">可</option><option value="partial">一部交換可</option><option value="ng">不可</option></select></div>
    <div class="form-group"><label class="form-label">メモ</label><textarea class="form-textarea" id="own-note"></textarea></div>
    <div class="modal-btns"><button class="btn-cancel" id="ownSkip">スキップ</button><button class="btn-save" id="ownAdd">追加</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- 管理者ログイン（メール認証） -->
<div class="modal-overlay hidden" id="authModal">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="modal-title" style="margin-bottom:0">管理者ログイン</div>
      <button class="x-btn" id="authCloseBtn">✕</button>
    </div>
    <div class="steps"><div class="step on" id="stepDot1"><b>1</b>コードを送る</div><div class="step-line"></div><div class="step" id="stepDot2"><b>2</b>コードを入力</div></div>
    <div id="authStep1">
      <div class="step-desc">下のボタンを押すと、管理者のメールにログインコード（6桁）が届きます。</div>
      <button class="big-btn" id="sendCodeBtn">ログインコードを送る</button>
      <button class="link-btn" id="haveCodeBtn">届いているコードを入力する</button>
    </div>
    <div id="authStep2" class="hidden">
      <div class="step-desc">メールに届いた6桁のコードを入力してください。</div>
      <input class="code-input" id="codeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="------">
      <button class="big-btn" id="verifyBtn">ログイン</button>
      <button class="link-btn" id="resendBtn" disabled>コードを再送する</button>
    </div>
    <div class="login-msg" id="authMsg"></div>
  </div>
</div>

<!-- 追加・編集 -->
<div class="modal-overlay hidden" id="editModal">
  <div class="modal">
    <div class="modal-title" id="editModalTitle">追加</div>
    <div class="form-group">
      <label class="form-label">タイトル</label>
      <input class="form-input" id="f-title" placeholder="例: ◯◯ DVD">
    </div>
    <div class="form-group">
      <label class="form-label">日付</label>
      <input class="form-input" id="f-date" type="date">
    </div>
    <div class="form-group">
      <label class="form-label">出演者</label>
      <input class="form-input" id="f-members" placeholder="例: 田中樹, ジェシー（カンマ区切り）">
    </div>
    <div class="form-group">
      <label class="form-label">優先度（任意）</label>
      <div class="chip-row" id="f-priority-chips">
        <button class="chip" data-priority="">なし</button>
        <button class="chip" data-priority="high">高</button>
        <button class="chip" data-priority="mid">中</button>
        <button class="chip" data-priority="low">低</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">ステータス</label>
      <div class="chip-row" id="f-status-chips">
        <button class="chip selected" data-status="active">探し中</button>
        <button class="chip" data-status="trading">取引中</button>
        <button class="chip" data-status="done">入手済み</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">メモ</label>
      <textarea class="form-textarea" id="f-note" placeholder="備考など"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="cancelBtn">キャンセル</button>
      <button class="btn-delete hidden" id="deleteBtn">削除</button>
      <button class="btn-save" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbzcQk2qXHLkun0bAgOYsFJiATESW-eju6s8ZqplZwvxXr94hpmZKmzLqIu5UaHRDTzU/exec';
const TOKEN_KEY='top_admin_token';
const CACHE_KEY='wishlist_ls_cache';
const SIXT=['京本大我','ジェシー','田中樹','松村北斗','髙地優吾','森本慎太郎','SixTONES'];
const PRIO=[['high','高'],['mid','中'],['low','低'],['none','なし']];
const STAT=[['active','探し中'],['trading','取引中'],['done','入手済み']];
let items=[],editingId=null,isAdmin=false,token='',cbIdx=0;
const F={q:'',members:new Set(),years:new Set(),prio:new Set(),status:new Set(),fresh:new Set()};
let selectMode=false,lastShown=[],bulkBusy=false;
const selected=new Set();
const NEW_DAYS=7;
function isNewW(it){const c=Number(it.createdAt)||0;const d=Date.now()-c;return c>0&&d<NEW_DAYS*86400000&&d>-86400000;}
let _toastT;
function toastMsg(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(_toastT);_toastT=setTimeout(()=>el.classList.remove('show'),2200);}

function normTitle(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');}

/* 絞り込み条件をURLに保存・復元（共有用） */
const HK=[['m','members'],['y','years'],['p','prio'],['s','status'],['n','fresh']];
function syncHash(){
  try{
    const o={};
    if(F.q)o.q=F.q;
    HK.forEach(([a,k])=>{if(F[k].size)o[a]=[...F[k]];});
    const h=Object.keys(o).length?'#s='+encodeURIComponent(JSON.stringify(o)):'';
    history.replaceState(null,'',location.pathname+location.search+h);
  }catch{}
}
function applyHash(){
  try{
    const m=/^#s=(.+)$/.exec(location.hash);if(!m)return;
    const o=JSON.parse(decodeURIComponent(m[1]));
    if(typeof o.q==='string')F.q=o.q;
    HK.forEach(([a,k])=>{if(Array.isArray(o[a]))o[a].forEach(v=>{if(typeof v==='string')F[k].add(v);});});
  }catch{}
}
const $=s=>document.querySelector(s);

/* ---------- 共通 ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function loadingHTML(text){
  return '<div class="loading wave">'+[...text].map((c,i)=>'<span style="animation-delay:'+(i*0.1)+'s">'+esc(c)+'</span>').join('')+'</div>';
}
function jsonp(params,timeout){
  return new Promise((resolve,reject)=>{
    const name='_cb'+(cbIdx++);const s=document.createElement('script');
    const timer=setTimeout(()=>{delete window[name];s.remove();reject(new Error('timeout'));},timeout||15000);
    window[name]=d=>{clearTimeout(timer);delete window[name];s.remove();resolve(d);};
    s.onerror=()=>{clearTimeout(timer);delete window[name];s.remove();reject(new Error('network'));};
    s.src=GAS_URL+'?'+new URLSearchParams({...params,callback:name,t:Date.now()});
    document.body.appendChild(s);
  });
}
async function gasWrite(params){
  const d=await jsonp({...params,token});
  if(d&&d.error==='unauthorized'){
    clearToken();applyAdminUI();
    alert('ログインの有効期限が切れました。もう一度ログインしてください。');
  }
  return d;
}
function splitMembers(s){return String(s||'').split(/[,、，]/).map(x=>x.trim()).filter(Boolean);}
function yearOf(it){const y=String(it.date||'').substring(0,4);return /^[0-9]{4}$/.test(y)?y:'';}
function statusLabel(s){return s==='trading'?'取引中':s==='done'?'入手済み':'探し中';}
function statusTagClass(s){return s==='trading'?'tag tag-trading':s==='done'?'tag tag-priority-low':'tag';}
function priorityLabel(p){return p==='high'?'優先度: 高':p==='mid'?'優先度: 中':p==='low'?'優先度: 低':'';}
function priorityClass(p){return p==='high'?'tag-priority-high':p==='mid'?'tag-priority-mid':p==='low'?'tag-priority-low':'';}

/* ---------- データ ---------- */
async function load(force){
  if(!force){
    try{
      const cached=localStorage.getItem(CACHE_KEY);
      if(cached){
        items=JSON.parse(cached);
        jsonp({action:'getWishlist'}).then(data=>{
          if(Array.isArray(data)){
            items=data;
            try{localStorage.setItem(CACHE_KEY,JSON.stringify(data));}catch{}
            renderList();
          }
        }).catch(()=>{});
        return;
      }
    }catch{}
  }
  try{
    const data=await jsonp({action:'getWishlist'});
    items=Array.isArray(data)?data:[];
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(items));}catch{}
  }catch{items=[];}
}
async function gasPost(params,payload){
  const url=GAS_URL+'?'+new URLSearchParams({...params,token});
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  const d=await r.json();
  if(d&&d.error==='unauthorized'){clearToken();applyAdminUI();alert('ログインの有効期限が切れました。もう一度ログインしてください。');}
  return d;
}
async function saveItem(item,isNew){
  let okk=false;
  try{const d=await gasWrite({action:'saveWishlistItem',data:encodeURIComponent(JSON.stringify({item,isNew}))});okk=!!(d&&d.ok);}catch{}
  if(okk){try{localStorage.setItem(CACHE_KEY,JSON.stringify(items));}catch{}}
  else{
    if(isAdmin)toastMsg('保存に失敗しました。もう一度お試しください。');
    await load(true);renderList();
  }
  return okk;
}
async function deleteItemFromServer(id){
  let okk=false;
  try{const d=await gasWrite({action:'deleteWishlistItem',id});okk=!!(d&&d.ok);}catch{}
  if(okk){try{localStorage.setItem(CACHE_KEY,JSON.stringify(items));}catch{}}
  else{
    if(isAdmin)toastMsg('削除に失敗しました。もう一度お試しください。');
    await load(true);renderList();
  }
  return okk;
}

/* ---------- 絞り込み ---------- */
function matchItem(it){
  if(F.status.size&&!F.status.has(it.status||'active'))return false;
  if(F.prio.size&&!F.prio.has(it.priority||'none'))return false;
  if(F.members.size&&!splitMembers(it.members).some(m=>F.members.has(m)))return false;
  if(F.years.size&&!F.years.has(yearOf(it)))return false;
  if(F.q){
    const hay=[it.title,it.members,it.note,it.date].join(' ').toLowerCase();
    const terms=F.q.toLowerCase().split(/\s+/).filter(Boolean);
    if(!terms.every(t=>hay.includes(t)))return false;
  }
  if(F.fresh.size&&!isNewW(it))return false;
  return true;
}
function filterCount(){return F.members.size+F.years.size+F.prio.size+F.status.size+F.fresh.size+(F.q?1:0);}
function labelOf(k,v){
  if(k==='years')return v+'年';
  if(k==='prio')return '優先度: '+(PRIO.find(x=>x[0]===v)||[0,v])[1];
  if(k==='status')return (STAT.find(x=>x[0]===v)||[0,v])[1];
  if(k==='fresh')return '新着（7日以内）';
  return v;
}
function renderActiveBar(){
  const arr=[];
  if(F.q)arr.push({k:'q',v:F.q,label:'「'+F.q+'」'});
  ['members','years','prio','status','fresh'].forEach(k=>F[k].forEach(v=>arr.push({k,v,label:labelOf(k,v)})));
  $('#activeBar').innerHTML=arr.map(a=>`<button type="button" class="af-chip" data-fk="${a.k}" data-fv="${esc(a.v)}">${esc(a.label)} ✕</button>`).join('');
  const n=filterCount();
  $('#filterBadge').textContent=n;
  $('#searchBtn').classList.toggle('has',n>0);
}
$('#activeBar').addEventListener('click',e=>{
  const b=e.target.closest('[data-fk]');if(!b)return;
  const k=b.dataset.fk,v=b.dataset.fv;
  if(k==='q'){F.q='';const qi=$('#fsText');if(qi)qi.value='';}
  else F[k].delete(v);
  renderList();syncFilterSheet();
});
function chipHTML(k,v,label){
  return `<button type="button" class="chip${F[k].has(v)?' selected':''}" data-fk="${k}" data-fv="${esc(v)}">${esc(label||v)}</button>`;
}
function secHTML(label,note,inner){
  return `<div class="fs-sec"><div class="fs-label">${label}${note?`<small>${note}</small>`:''}</div>${inner}</div>`;
}
function renderFilterSheet(){
  const body=$('#filterBody');
  const prev=body.scrollTop;
  const otherSet=new Set();
  items.forEach(it=>splitMembers(it.members).forEach(m=>{if(!SIXT.includes(m))otherSet.add(m);}));
  F.members.forEach(m=>{if(!SIXT.includes(m))otherSet.add(m);});
  const others=[...otherSet].sort((a,b)=>a.localeCompare(b,'ja'));
  const yearSet=new Set();
  items.forEach(it=>{const y=yearOf(it);if(y)yearSet.add(y);});
  F.years.forEach(y=>yearSet.add(y));
  const years=[...yearSet].sort();
  const othersOpen=others.some(m=>F.members.has(m));
  body.innerHTML=
    secHTML('文字検索','タイトル・出演者・メモ','<input class="form-input" id="fsText" type="search" placeholder="スペースで複数ワード（すべて含む）" value="'+esc(F.q)+'">')+
    secHTML('出演者','複数選択可','<div class="chips-grid">'+SIXT.map(m=>chipHTML('members',m)).join('')+'</div>'+
      (others.length?`<details class="fs-others"${othersOpen?' open':''}><summary>その他の出演者（${others.length}名）</summary><div class="chips-grid">${others.map(m=>chipHTML('members',m)).join('')}</div></details>`:''))+
    secHTML('年代','複数選択可',years.length?'<div class="chips-grid">'+years.map(y=>chipHTML('years',y,y+'年')).join('')+'</div>':'<div style="font-size:12px;color:var(--gray)">日付データがありません</div>')+
    secHTML('優先度','複数選択可','<div class="chips-grid">'+PRIO.map(p=>chipHTML('prio',p[0],p[1])).join('')+'</div>')+
    secHTML('ステータス','複数選択可','<div class="chips-grid">'+STAT.map(s=>chipHTML('status',s[0],s[1])).join('')+'</div>')+
    secHTML('新着','7日以内に追加','<div class="chips-grid">'+chipHTML('fresh','new','新着のみ表示')+'</div>');
  body.scrollTop=prev;
  syncFilterSheet();
}
function syncFilterSheet(){
  renderActiveBar();
  if($('#filterModal').classList.contains('hidden'))return;
  document.querySelectorAll('#filterBody [data-fk]').forEach(b=>b.classList.toggle('selected',F[b.dataset.fk]&&F[b.dataset.fk].has(b.dataset.fv)));
  $('#filterApplyBtn').textContent=items.filter(matchItem).length+'件を表示';
}
let _qTimer=null;
$('#filterBody').addEventListener('click',e=>{
  const b=e.target.closest('button[data-fk]');if(!b)return;
  const k=b.dataset.fk,v=b.dataset.fv;
  F[k].has(v)?F[k].delete(v):F[k].add(v);
  renderList();syncFilterSheet();
});
$('#filterBody').addEventListener('input',e=>{
  if(e.target.id!=='fsText')return;
  clearTimeout(_qTimer);
  const val=e.target.value.trim();
  _qTimer=setTimeout(()=>{F.q=val;renderList();syncFilterSheet();},150);
});
$('#searchBtn').addEventListener('click',()=>{
  $('#filterModal').classList.remove('hidden');
  renderFilterSheet();
});
function closeFilter(){$('#filterModal').classList.add('hidden');}
$('#filterCloseBtn').addEventListener('click',closeFilter);
$('#filterApplyBtn').addEventListener('click',closeFilter);
$('#filterModal').addEventListener('click',function(e){if(e.target===this)closeFilter();});
$('#filterShareBtn').addEventListener('click',async()=>{
  syncHash();
  const url=location.href;
  try{await navigator.clipboard.writeText(url);toastMsg('この条件のリンクをコピーしました');}
  catch{prompt('このリンクをコピーしてください',url);}
});
$('#filterResetBtn').addEventListener('click',()=>{
  F.q='';F.members.clear();F.years.clear();F.prio.clear();F.status.clear();F.fresh.clear();
  renderFilterSheet();renderList();
});

/* ---------- 一覧 ---------- */
function renderList(){
  renderActiveBar();
  syncHash();
  const list=$('#cardList');
  let data=items.filter(matchItem);
  const prioOrder={high:0,mid:1,low:2,'':3};
  data.sort((a,b)=>{
    const da=(a.status==='done')?1:0,db=(b.status==='done')?1:0;
    if(da!==db)return da-db;
    const pd=(prioOrder[a.priority||'']??3)-(prioOrder[b.priority||'']??3);
    if(pd!==0)return pd;
    return (b.createdAt||0)-(a.createdAt||0);
  });
  lastShown=data.map(x=>x.id);
  $('#listCount').textContent=data.length+' 件';
  if(!data.length){list.innerHTML='<div class="empty">該当する項目がありません</div>';return;}
  list.innerHTML=data.map(it=>`
    <div class="card ${it.status==='done'?'done':''}${selectMode?' has-sel':''}${selectMode&&selected.has(it.id)?' sel':''}" data-id="${esc(it.id)}">
      ${selectMode?'<div class="sel-box">✓</div>':''}
      <div class="card-title ${it.status==='done'?'done':''}">${isNewW(it)?'<span class="new-badge">NEW</span>':''}${esc(it.title)}</div>
      <div class="card-meta">
        ${splitMembers(it.members).map(m=>`<span class="tag">${esc(m)}</span>`).join('')}
        ${it.status&&it.status!=='active'?`<span class="${statusTagClass(it.status)}">${statusLabel(it.status)}</span>`:''}
        ${it.priority?`<span class="tag ${priorityClass(it.priority)}">${priorityLabel(it.priority)}</span>`:''}
      </div>
      ${it.date?`<div class="card-date">📅 ${esc(it.date)}</div>`:''}
      ${it.note?`<div class="card-date">📝 ${esc(it.note)}</div>`:''}
      ${isAdmin&&!selectMode?`<div class="card-actions"><button class="btn-sm" data-edit="${esc(it.id)}">編集</button>${it.status==='done'?`<button class="btn-sm" data-own="${esc(it.id)}">📦 所持リストへ</button>`:''}</div>`:''}
    </div>`).join('');
  list.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>openEditModal(b.dataset.edit)));
  list.querySelectorAll('[data-own]').forEach(b=>b.addEventListener('click',()=>{const it=items.find(x=>x.id===b.dataset.own);if(it)openOwnModal(it);}));
  list.querySelectorAll('.card').forEach(c=>c.addEventListener('click',()=>{if(selectMode)toggleSel(c);}));
}

/* ---------- 追加・編集 ---------- */
function openEditModal(id){
  editingId=id||null;
  const it=id?items.find(x=>x.id===id):null;
  $('#editModalTitle').textContent=it?'編集':'追加';
  $('#f-title').value=it?it.title:'';
  $('#f-date').value=it?(it.date||''):'';
  $('#f-members').value=it?(it.members||''):'';
  $('#f-note').value=it?(it.note||''):'';
  document.querySelectorAll('#f-priority-chips .chip').forEach(c=>c.classList.toggle('selected',c.dataset.priority===(it?(it.priority||''):'')));
  document.querySelectorAll('#f-status-chips .chip').forEach(c=>c.classList.toggle('selected',c.dataset.status===(it?(it.status||'active'):'active')));
  $('#deleteBtn').classList.toggle('hidden',!it);
  $('#editModal').classList.remove('hidden');
}
document.querySelectorAll('#f-priority-chips .chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('#f-priority-chips .chip').forEach(x=>x.classList.remove('selected'));
  c.classList.add('selected');
}));
document.querySelectorAll('#f-status-chips .chip').forEach(c=>c.addEventListener('click',()=>{
  document.querySelectorAll('#f-status-chips .chip').forEach(x=>x.classList.remove('selected'));
  c.classList.add('selected');
}));
$('#addBtn').addEventListener('click',()=>openEditModal());
$('#cancelBtn').addEventListener('click',()=>$('#editModal').classList.add('hidden'));
$('#saveBtn').addEventListener('click',async()=>{
  const title=$('#f-title').value.trim();
  if(!title){alert('タイトルを入力してください');return;}
  const priority=(document.querySelector('#f-priority-chips .chip.selected')||{dataset:{priority:''}}).dataset.priority||'';
  const status=(document.querySelector('#f-status-chips .chip.selected')||{dataset:{status:'active'}}).dataset.status||'active';
  const date=$('#f-date').value;
  const members=$('#f-members').value.trim();
  const note=$('#f-note').value.trim();
  const nt=normTitle(title);
  const orig=editingId?items.find(x=>x.id===editingId):null;
  const prevStatus=orig?orig.status:null;
  if(!orig||normTitle(orig.title)!==nt){
    const dup=items.find(x=>x.id!==editingId&&normTitle(x.title)===nt);
    if(dup&&!confirm('同じタイトルの項目がすでにあります：\n「'+dup.title+'」\nそれでも保存しますか？'))return;
  }
  let item,isNew=false;
  if(editingId){
    item=items.find(x=>x.id===editingId);
    Object.assign(item,{title,priority,status,date,members,note});
  }else{
    item={id:Date.now().toString(),title,genre:'',priority,status,date,members,note,createdAt:Date.now()};
    items.push(item);isNew=true;
  }
  $('#editModal').classList.add('hidden');
  renderList();
  const savedOk=await saveItem(item,isNew);
  if(savedOk&&status==='done'&&prevStatus!=='done')openOwnModal(item);
});
$('#deleteBtn').addEventListener('click',async()=>{
  if(!confirm('削除しますか？'))return;
  const id=editingId;
  items=items.filter(x=>x.id!==id);
  $('#editModal').classList.add('hidden');
  renderList();
  await deleteItemFromServer(id);
});

/* ---------- 管理者ログイン（メール認証） ---------- */
function loadToken(){
  try{
    const o=JSON.parse(localStorage.getItem(TOKEN_KEY)||'null');
    if(o&&o.token&&o.expires>Date.now()){token=o.token;isAdmin=true;}
    else localStorage.removeItem(TOKEN_KEY);
  }catch{}
}
function clearToken(){
  isAdmin=false;token='';
  try{localStorage.removeItem(TOKEN_KEY);}catch{}
}
function applyAdminUI(){
  $('#addBtn').classList.toggle('hidden',!isAdmin);
  $('#loginBtn').classList.toggle('hidden',isAdmin);
  $('#modeBadge').classList.toggle('hidden',!isAdmin);
  $('#adminBar').classList.toggle('hidden',!isAdmin);
  if(!isAdmin){selectMode=false;selected.clear();}
  updateBulkBar();
  renderList();
}
const ERR={
  too_soon:'少し時間をおいてから、もう一度押してください。',
  rate_limited:'送信回数の上限です。1時間ほど待ってからお試しください。',
  expired:'コードの有効期限が切れました。もう一度コードを送ってください。',
  locked:'入力の失敗が上限に達しました。もう一度コードを送ってください。',
  invalid:'コードが違います。'
};
function setAuthMsg(t){$('#authMsg').textContent=t||'';}
function setStep(n){
  $('#stepDot1').classList.toggle('on',n===1);
  $('#stepDot2').classList.toggle('on',n===2);
}
let cdTimer;
function startCountdown(sec){
  const b=$('#resendBtn');clearInterval(cdTimer);
  b.disabled=true;
  let n=sec;b.textContent='コードを再送する（'+n+'秒）';
  cdTimer=setInterval(()=>{
    n--;
    if(n<=0){clearInterval(cdTimer);b.disabled=false;b.textContent='コードを再送する';}
    else b.textContent='コードを再送する（'+n+'秒）';
  },1000);
}
function openAuth(){
  setStep(1);
  $('#authStep1').classList.remove('hidden');
  $('#authStep2').classList.add('hidden');
  $('#sendCodeBtn').disabled=false;
  $('#codeInput').value='';
  setAuthMsg('');
  $('#authModal').classList.remove('hidden');
}
function closeAuth(){$('#authModal').classList.add('hidden');}
async function sendCode(){
  const b1=$('#sendCodeBtn');b1.disabled=true;
  setAuthMsg('送信中…（数秒かかります）');
  try{
    const d=await jsonp({action:'requestAdminCode'},30000);
    if(d&&(d.ok||d.error==='too_soon')){
      $('#authStep1').classList.add('hidden');
      $('#authStep2').classList.remove('hidden');
      setStep(2);
      setAuthMsg(d.ok?'管理者のメールにコードを送りました。10分以内に入力してください。':'直前にコードを送信済みです。メールに届いたコードを入力してください。');
      startCountdown(60);$('#codeInput').focus();
    }else{setAuthMsg(ERR[d&&d.error]||('送信に失敗しました（'+((d&&d.error)||'応答なし')+'）'));b1.disabled=false;}
  }catch(err){setAuthMsg('通信に失敗しました（'+err.message+'）。もう一度お試しください。');b1.disabled=false;}
}
async function verifyCode(){
  const code=$('#codeInput').value.trim();
  if(!/^[0-9]{6}$/.test(code)){setAuthMsg('6桁の数字を入力してください。');return;}
  const b=$('#verifyBtn');b.disabled=true;setAuthMsg('確認中…');
  try{
    const d=await jsonp({action:'verifyAdminCode',code},15000);
    if(d&&d.ok){
      token=d.token;isAdmin=true;
      try{localStorage.setItem(TOKEN_KEY,JSON.stringify({token:d.token,expires:d.expires}));}catch{}
      closeAuth();applyAdminUI();
    }else{
      setAuthMsg(ERR[d&&d.error]||'ログインに失敗しました。');
      if(d&&(d.error==='expired'||d.error==='locked')){
        $('#authStep1').classList.remove('hidden');
        $('#authStep2').classList.add('hidden');
        $('#sendCodeBtn').disabled=false;setStep(1);
      }
    }
  }catch{setAuthMsg('通信に失敗しました。もう一度お試しください。');}
  b.disabled=false;
}
async function logout(){
  const t=token;clearToken();applyAdminUI();
  try{await jsonp({action:'logoutAdmin',token:t},8000);}catch{}
}
$('#loginBtn').addEventListener('click',openAuth);
$('#sendCodeBtn').addEventListener('click',sendCode);
$('#haveCodeBtn').addEventListener('click',()=>{
  $('#authStep1').classList.add('hidden');
  $('#authStep2').classList.remove('hidden');
  setStep(2);
  clearInterval(cdTimer);const rb=$('#resendBtn');rb.disabled=false;rb.textContent='コードを再送する';

  $('#codeInput').focus();
});

function updateBulkBar(){

$('#selectBtn').addEventListener('click',()=>{

$('#bulkAllBtn').addEventListener('click',()=>{

$('#bulkActBtn').addEventListener('click',()=>{
  if(!selected.size){alert('項目を選んでください');return;}
  $('#bulkTitle').textContent=selected.size+'件をまとめて操作';
  $('#bulkForm').classList.remove('hidden');
  $('#bulkProgress').classList.add('hidden');
  $('#bulkModal').classList.remove('hidden');

function closeBulk(){if(bulkBusy)return;$('#bulkModal').classList.add('hidden');}
$('#bulkCloseBtn').addEventListener('click',closeBulk);
$('#bulkModal').addEventListener('click',function(e){if(e.target===this)closeBulk();});
async function bulkRun(mutate){
  if(bulkBusy)return;
  const targets=items.filter(it=>selected.has(it.id));
  if(!targets.length){alert('項目を選んでください');return;}
  bulkBusy=true;
  $('#bulkForm').classList.add('hidden');
  const pg=$('#bulkProgress');pg.classList.remove('hidden');
  let done=0,fail=0,stop=false;
  pg.textContent='0 / '+targets.length+' 件 処理中…（閉じずにお待ちください）';
  for(const it of targets){
    if(stop)break;
    try{
      let d;
      if(mutate==='delete')d=await gasWrite({action:'deleteWishlistItem',id:it.id});
      else d=await gasWrite({action:'saveWishlistItem',data:encodeURIComponent(JSON.stringify({item:mutate(it),isNew:false}))});
      if(!d||!d.ok){fail++;}
      if(!isAdmin)stop=true;
    }catch{fail++;}
    done++;
    pg.textContent=done+' / '+targets.length+' 件 処理中…（閉じずにお待ちください）';
  }
  bulkBusy=false;
  $('#bulkModal').classList.add('hidden');
  await load(true);
  selected.clear();selectMode=false;updateBulkBar();
  renderList();
  toastMsg(fail?`${done-fail}件完了／${fail}件失敗`:`${done}件を処理しました`);
}
$('#bulkStatusApply').addEventListener('click',()=>{
  const v=$('#bulkStatus').value;
  if(!confirm(selected.size+'件のステータスを「'+statusLabel(v)+'」にします。よろしいですか？'))return;
  bulkRun(it=>({...it,status:v}));
});
$('#bulkPriorityApply').addEventListener('click',()=>{
  const v=$('#bulkPriority').value;
  if(!confirm(selected.size+'件の優先度を変更します。よろしいですか？'))return;
  bulkRun(it=>({...it,priority:v}));
});
$('#bulkDelete').addEventListener('click',()=>{
  if(!confirm(selected.size+'件を削除します。元に戻せません。よろしいですか？'))return;
  bulkRun('delete');
});

}
$('#ownSkip').addEventListener('click',()=>$('#ownModal').classList.add('hidden'));
$('#ownAdd').addEventListener('click',async()=>{
  const it=ownTarget;if(!it)return;
  const title=$('#own-title').value.trim();
  if(!title){alert('タイトルを入力してください');return;}
  const dest=$('#own-dest').value,ex=$('#own-ex').value,note=$('#own-note').value.trim();
  const label=dest==='2'?'所持リスト②':'所持リスト①';
  const video={id:Date.now().toString(),title,members:splitMembers(it.members),exchange:ex,genres:'[]',dates:it.date?JSON.stringify([{date:it.date,times:[]}]):'[]',note,tracks:'[]'};
  const btn=$('#ownAdd');btn.disabled=true;
  let okk=false;
  try{const d=await gasPost({action:dest==='2'?'saveVideo2':'saveVideo'},{video,isNew:true});okk=!!(d&&d.ok);}catch{}
  btn.disabled=false;
  if(!okk){if(isAdmin)toastMsg('所持リストへの追加に失敗しました。もう一度お試しください。');return;}
  $('#ownModal').classList.add('hidden');
  renderList();toastMsg(label+'に追加しました');
});

/* ---------- 起動 ---------- */
(async()=>{
  loadToken();
  applyHash();
  applyAdminUI();
  $('#cardList').innerHTML=loadingHTML('読み込み中');
  await load();
  renderList();
  if(isAdmin){
    jsonp({action:'checkToken',token}).then(d=>{if(!d||!d.ok){clearToken();applyAdminUI();}}).catch(()=>{});
  }
})();
</script>
</body>
