<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>所持リスト</title>
<style>
:root{
  --bg:#fff8fa;--card:#ffffff;--line:#f5dde5;--line2:#fbeef2;
  --accent:#e88aa8;--accent-d:#d46d8f;--accent-l:#fde8ef;
  --text:#5b4a51;--sub:#a08f96;--radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:rgba(255,248,250,.95);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.hrow{display:flex;align-items:center;gap:8px}
h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.06em;user-select:none;-webkit-user-select:none;flex:1}
.abtn{border:1px solid var(--accent);background:#fff;color:var(--accent-d);border-radius:999px;
  padding:5px 12px;font-size:13px;cursor:pointer}
.abtn.fill{background:var(--accent);color:#fff}
.seg{display:flex;background:var(--line2);border-radius:999px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;padding:7px 0;border-radius:999px;font-size:14px;cursor:pointer;color:var(--sub)}
.seg button.on{background:#fff;color:var(--accent-d);font-weight:700;box-shadow:0 1px 4px rgba(232,138,168,.25)}
.years{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.years::-webkit-scrollbar{display:none}
.years button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;color:var(--sub)}
.years button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.years.big button{border-radius:10px;font-size:14px;padding:6px 14px;color:var(--text)}
.years.big button.on{color:#fff}
.years.big+.years{margin-top:6px}
.years.big+.years button{font-size:12px;padding:4px 11px}
.bar{display:flex;gap:8px;margin-top:10px;align-items:center}
.search{flex:1;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;outline:none;min-width:0}
.search:focus{border-color:var(--accent)}
.fbtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--text)}
.fbtn.act{border-color:var(--accent);color:var(--accent-d);background:var(--accent-l)}
.panel{display:none;margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.panel.open{display:block}
.prow{margin-bottom:12px}
.prow:last-child{margin-bottom:0}
.plabel{font-size:12px;color:var(--sub);margin-bottom:6px}
select.sel{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;outline:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--accent) 50%),linear-gradient(135deg,var(--accent) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--c,#ccc);color:var(--c,#888);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--c,#ccc);color:#fff}
.swrow{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.sw{position:relative;width:44px;height:26px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:#eadde2;border-radius:999px;transition:.2s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span:before{transform:translateX(18px)}
.clear{border:0;background:none;color:var(--accent-d);font-size:13px;cursor:pointer;padding:0;text-decoration:underline}
.info{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 4px;font-size:13px;color:var(--sub)}
main{padding:4px 12px calc(env(safe-area-inset-bottom) + 90px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:9px;cursor:pointer}
.card:active{background:#fffafc}
.r1{display:flex;gap:8px;align-items:flex-start}
.ttl{flex:1;font-weight:700;line-height:1.45;word-break:break-word}
.heart{border:0;background:none;padding:2px;cursor:pointer;flex:none;line-height:0}
.heart svg{width:22px;height:22px;fill:none;stroke:#f0b5c8;stroke-width:1.8;transition:.15s}
.heart.on svg{fill:#f07fa2;stroke:#f07fa2}
.meta{font-size:12.5px;color:var(--sub);margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;color:#fff;background:var(--c,#bbb)}
.tag.other{background:#f1eaed;color:#8d7c83}
.ex{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--accent);color:var(--accent-d);background:#fff}
.empty{text-align:center;color:var(--sub);padding:50px 0}
.loading{display:flex;justify-content:center;padding:70px 0}
.wave span{display:inline-block;color:var(--accent);font-size:18px;font-weight:700;letter-spacing:.08em;animation:wave 1.2s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-9px)}}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:15;border:0;background:var(--accent);color:#fff;
  border-radius:999px;padding:13px 22px;font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(232,138,168,.45);cursor:pointer;display:none}
.fab.show{display:block}
.top{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom) + 20px);z-index:15;border:1px solid var(--line);background:#fff;color:var(--accent-d);
  border-radius:999px;padding:9px 14px;font-size:13px;cursor:pointer;display:none}
.top.show{display:block}
.ov{position:fixed;inset:0;background:rgba(91,74,81,.35);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:20px}}
.sh-h{display:flex;align-items:center;margin-bottom:14px}
.sh-h h2{flex:1;margin:0;font-size:17px}
.x{border:0;background:var(--line2);color:var(--sub);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.dl{display:grid;grid-template-columns:80px 1fr;gap:9px 10px;font-size:14px}
.dl dt{color:var(--sub);font-size:12.5px;padding-top:2px}
.dl dd{margin:0;word-break:break-word;white-space:pre-wrap}
.fld{margin-bottom:13px}
.fld label.l{display:block;font-size:12.5px;color:var(--sub);margin-bottom:5px}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;background:#fff}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:80px;resize:vertical}
.btns{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:1px solid var(--accent);background:#fff;color:var(--accent-d);border-radius:12px;padding:11px;font-weight:700;cursor:pointer}
.btn.p{background:var(--accent);color:#fff}
.btn.d{border-color:#e6a2a2;color:#c96565}
.btn:disabled{opacity:.5}
.msg{font-size:13px;color:#c96565;margin-top:8px;min-height:1em}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(91,74,81,.92);color:#fff;padding:9px 18px;border-radius:999px;
  font-size:13px;z-index:80;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1 id="title">所持リスト</h1>
    <button class="abtn" id="adminBtn">ログイン</button>
  </div>
  <div class="seg" id="groupSeg">
    <button data-g="SixTONES" class="on">SixTONESメイン</button>
    <button data-g="other">SixTONES以外</button>
  </div>
  <div class="years big" id="bigTabs"></div>
  <div class="years" id="years"></div>
  <div class="bar">
    <input class="search" id="q" type="search" placeholder="キーワード" autocomplete="off">
    <button class="fbtn" id="fBtn">絞り込み</button>
  </div>
  <div class="panel" id="panel">
    <div class="prow">
      <div class="plabel">小ジャンル</div>
      <select class="sel" id="genreSel"></select>
    </div>
    <div class="prow">
      <div class="plabel">出演者（選んだ全員が出ているもの）</div>
      <div class="chips" id="memChips"></div>
    </div>
    <div class="prow">
      <div class="plabel">並び順</div>
      <select class="sel" id="sortSel">
        <option value="new">新しい順</option>
        <option value="old">古い順</option>
        <option value="title">タイトル順</option>
        <option value="added">登録が新しい順</option>
      </select>
    </div>
    <div class="prow">
      <div class="swrow"><span>交換可のみ</span><label class="sw"><input type="checkbox" id="exOnly"><span></span></label></div>
      <div class="swrow"><span>お気に入りのみ</span><label class="sw"><input type="checkbox" id="favOnly"><span></span></label></div>
    </div>
    <div class="prow" style="text-align:right"><button class="clear" id="clearF">条件をリセット</button></div>
  </div>
</header>

<div class="info"><span id="count"></span><span id="filterNote"></span></div>
<main id="list"></main>

<button class="top" id="toTop">上へ</button>
<button class="fab" id="addBtn">追加</button>

<!-- 詳細 -->
<div class="ov" id="ovDetail"><div class="sheet">
  <div class="sh-h"><h2>詳細</h2><button class="x" data-close>閉じる</button></div>
  <div id="detailBody"></div>
  <div class="btns" id="detailBtns"></div>
</div></div>

<!-- 編集 -->
<div class="ov" id="ovEdit"><div class="sheet">
  <div class="sh-h"><h2 id="editTitle">追加</h2><button class="x" data-close>閉じる</button></div>
  <div class="fld"><label class="l">タイトル</label><input class="inp" id="fTitle"></div>
  <div class="row2">
    <div class="fld"><label class="l">日付</label><input class="inp" id="fDate" type="date"></div>
    <div class="fld"><label class="l">区分</label>
      <select class="sel" id="fGroup"><option value="SixTONES">SixTONESメイン</option><option value="SixTONES以外">SixTONES以外</option></select>
    </div>
  </div>
  <div class="row2">
    <div class="fld"><label class="l">大ジャンル</label><select class="sel" id="fBig"></select></div>
    <div class="fld"><label class="l">小ジャンル</label>
      <input class="inp" id="fGenre" list="genreList" placeholder="選択または入力">
      <datalist id="genreList"></datalist>
    </div>
  </div>
  <div class="fld"><label class="l">出演者</label><div class="chips" id="fMem"></div>
    <input class="inp" id="fMemOther" placeholder="その他の出演者（、区切り）" style="margin-top:8px">
  </div>
  <div class="fld swrow"><span>交換可</span><label class="sw"><input type="checkbox" id="fEx"><span></span></label></div>
  <div class="fld"><label class="l">メモ</label><textarea class="inp" id="fMemo"></textarea></div>
  <div class="msg" id="editMsg"></div>
  <div class="btns"><button class="btn p" id="saveBtn">保存</button></div>
</div></div>

<!-- ログイン -->
<div class="ov" id="ovLogin"><div class="sheet">
  <div class="sh-h"><h2>管理者ログイン</h2><button class="x" data-close>閉じる</button></div>
  <div id="step1">
    <div class="fld" style="font-size:14px">管理者のメールアドレスにログインコードを送ります。</div>
    <div class="btns"><button class="btn p" id="sendCode">コードをメールに送る</button></div>
  </div>
  <div id="step2" style="display:none">
    <div class="fld"><label class="l">メールに届いた6桁のコード</label><input class="inp" id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>
    <div class="btns"><button class="btn" id="backStep">戻る</button><button class="btn p" id="verify">ログイン</button></div>
  </div>
  <div class="msg" id="loginMsg"></div>
</div></div>

<!-- 管理者メニュー -->
<div class="ov" id="ovAdmin"><div class="sheet">
  <div class="sh-h"><h2>管理者</h2><button class="x" data-close>閉じる</button></div>
  <div class="btns" style="flex-direction:column">
    <button class="btn p" id="mAdd">新規追加</button>
    <button class="btn" id="mReload">再読み込み</button>
    <button class="btn d" id="mLogout">ログアウト</button>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ===== 設定 ===== */
const API = 'https://script.google.com/macros/s/AKfycbxDpBc_XwqCgEYDWqos_7mcnNoI0OiN3dkSBL367grzFY_3EL_B9N2R-OmnhowcTBep/exec';
const LS = 'vl1new_';

/* ===== メンバー ===== */
const MEMBERS = [
  {name:'ジェシー',   short:'ジェシー', color:'#e5484d', keys:['ジェシー','jesse']},
  {name:'京本大我',   short:'大我',     color:'#f07fb0', keys:['京本','大我','きょも']},
  {name:'松村北斗',   short:'北斗',     color:'#3f3a3c', keys:['松村','北斗']},
  {name:'髙地優吾',   short:'優吾',     color:'#e3b21f', keys:['髙地','高地','優吾']},
  {name:'森本慎太郎', short:'慎太郎',   color:'#3fae5c', keys:['森本','慎太郎']},
  {name:'田中樹',     short:'樹',       color:'#3b82f6', keys:['田中','樹']}
];

/* ===== 大ジャンル・小ジャンル ===== */
const BIG = ['テレビ','配信','ラジオ','DVD・BD特典','CD特典','その他'];
const SMALL = {
  'テレビ':['音楽番組','バラエティ','冠番組','ドラマ','情報番組','CM'],
  '配信':['YouTube','ISLAND TV','配信ライブ','配信番組'],
  'ラジオ':['レギュラー','ゲスト','特番'],
  'DVD・BD特典':['ライブ','ドラマ','映画','特典映像'],
  'CD特典':['シングル','アルバム','MV','メイキング'],
  'その他':[]
};
const ALL_WORDS = ['全員','6人','SixTONES','ストーンズ'];

/* ===== 列名の自動対応 ===== */
const ALIAS = {
  id:['id','ID','番号','No','no'],
  title:['title','タイトル','番組名','番組','名前','name','内容'],
  date:['date','日付','放送日','配信日','発売日','公開日','日時'],
  year:['year','年','年度'],
  category:['category','大ジャンル','大分類'],
  genre:['genre','小ジャンル','ジャンル','小分類','種類'],
  group:['group','区分','グループ'],
  members:['members','member','出演','出演者','メンバー'],
  exchange:['exchange','交換','交換可','交換可否','trade','tradeable'],
  memo:['memo','メモ','備考','note','notes']
};
const DEFAULT_COL = {id:'id',title:'title',date:'date',year:'year',category:'category',genre:'genre',group:'group',members:'members',exchange:'exchange',memo:'memo'};

let headers = [], COL = {}, items = [], token = '', isAdmin = false;
let memSep = '、', exTrue = true, exFalse = false;
const st = {group:'SixTONES', big:'all', year:'all', genre:'', mem:[], q:'', sort:'new', ex:false, fav:false};
let favs = new Set();

/* ===== 保存領域 ===== */
function lsGet(k, d){ try{ const v = localStorage.getItem(LS+k); return v===null ? d : JSON.parse(v); }catch(_){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(LS+k, JSON.stringify(v)); }catch(_){} }
token = lsGet('token', '');
favs = new Set(lsGet('favs', []));
Object.assign(st, lsGet('state', {}), {q:''});

/* ===== 通信 ===== */
async function api(action, data){
  const body = JSON.stringify(Object.assign({action, token}, data||{}));
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || 'エラー');
  return j;
}

/* ===== ユーティリティ ===== */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('show'),1800); }
function waveHTML(text){ return '<div class="loading"><div class="wave">'+[...text].map((c,i)=>'<span style="animation-delay:'+(i*0.09)+'s">'+esc(c)+'</span>').join('')+'</div></div>'; }
function openOv(id){ $(id).classList.add('open'); }
function closeOv(id){ $(id).classList.remove('open'); }
document.querySelectorAll('.ov').forEach(o=>{
  o.addEventListener('click', e=>{ if(e.target===o || e.target.hasAttribute('data-close')) o.classList.remove('open'); });
});

function normDate(v){
  if(!v) return '';
  let s = String(v).trim();
  let m = s.match(/(\d{4})\D(\d{1,2})\D(\d{1,2})/);
  if(m) return m[1]+'/'+m[2].padStart(2,'0')+'/'+m[3].padStart(2,'0');
  m = s.match(/(\d{4})\D(\d{1,2})/);
  if(m) return m[1]+'/'+m[2].padStart(2,'0');
  m = s.match(/^(\d{4})$/);
  if(m) return m[1];
  const d = new Date(s);
  if(!isNaN(d)) return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
  return s;
}
function truthy(v){
  if(v===true) return true;
  const s = String(v==null?'':v).trim().toLowerCase();
  return ['true','1','可','○','◯','ok','yes','y','交換可','あり','有'].includes(s);
}
function parseMembers(v){
  const s = String(v==null?'':v).trim();
  if(!s) return {six:[], other:[]};
  if(ALL_WORDS.some(w=>s===w)) return {six:MEMBERS.map(m=>m.name), other:[]};
  const parts = s.split(/[,、，・\/／\n]+|\s{1,}/).map(x=>x.trim()).filter(Boolean);
  const six = new Set(), other = [];
  parts.forEach(p=>{
    if(ALL_WORDS.includes(p)){ MEMBERS.forEach(m=>six.add(m.name)); return; }
    const m = MEMBERS.find(m=>m.keys.some(k=>p.toLowerCase().includes(k.toLowerCase())));
    if(m) six.add(m.name); else other.push(p);
  });
  return {six:MEMBERS.map(m=>m.name).filter(n=>six.has(n)), other};
}

/* ===== 読み込み ===== */
async function load(){
  $('list').innerHTML = waveHTML('読み込み中');
  try{
    const j = await api('list');
    headers = j.headers || [];
    COL = {};
    Object.keys(ALIAS).forEach(k=>{
      const h = headers.find(h=>ALIAS[k].some(a=>a.toLowerCase()===String(h).trim().toLowerCase()));
      COL[k] = h || DEFAULT_COL[k];
    });
    const rows = j.rows || [];
    // 出演者の区切り文字・交換の値の書式を既存データから判定
    const memSample = rows.map(r=>String(r[COL.members]||'')).find(s=>/[,、]/.test(s));
    memSep = memSample && memSample.includes(',') && !memSample.includes('、') ? ',' : '、';
    const exVals = rows.map(r=>r[COL.exchange]).filter(v=>v!==''&&v!=null&&typeof v!=='boolean');
    const exT = exVals.find(v=>truthy(v));
    if(exT!==undefined && !['true','1'].includes(String(exT).toLowerCase())){ exTrue = exT; exFalse = ''; }
    items = rows.map(toRec);
    render();
  }catch(e){
    $('list').innerHTML = '<div class="empty">読み込みに失敗しました<br><small>'+esc(e.message)+'</small><br><br><button class="abtn" onclick="load()">もう一度</button></div>';
  }
}
function toRec(r, i){
  const date = normDate(r[COL.date]);
  let year = String(r[COL.year]||'').replace(/\D/g,'').slice(0,4);
  if(!year && /^\d{4}/.test(date)) year = date.slice(0,4);
  const genre = String(r[COL.genre]||'').trim();
  const big = String(r[COL.category]||'').trim();
  const gRaw = String(r[COL.group]||'').trim();
  let group;
  if(gRaw) group = /以外|other/i.test(gRaw) ? 'other' : 'SixTONES';
  else group = /以外/.test(genre) ? 'other' : 'SixTONES';
  const mem = parseMembers(r[COL.members]);
  return {
    raw:r, row:r._row, id:r[COL.id], idx:i,
    title:String(r[COL.title]||'').trim(), date, year, big, genre, group,
    six:mem.six, other:mem.other, ex:truthy(r[COL.exchange]),
    memo:String(r[COL.memo]||'')
  };
}
function favKey(it){ return String(it.id!==''&&it.id!=null ? it.id : 'r'+it.row); }

/* ===== 表示 ===== */
function inGroup(){ return items.filter(it=>it.group===st.group); }
function inBig(){ return inGroup().filter(it=>st.big==='all' || (st.big==='none' ? !it.big : it.big===st.big)); }
function bigList(){
  const used = [...new Set(inGroup().map(it=>it.big).filter(Boolean))];
  return BIG.filter(b=>used.includes(b)).concat(used.filter(b=>!BIG.includes(b)).sort((a,b)=>a.localeCompare(b,'ja')));
}
function renderBig(){
  const bs = bigList();
  if(st.big!=='all' && st.big!=='none' && !bs.includes(st.big)) st.big='all';
  const hasNone = inGroup().some(it=>!it.big) && bs.length>0;
  let h = '<button data-b="all" class="'+(st.big==='all'?'on':'')+'">すべて</button>';
  bs.forEach(b=>{ h += '<button data-b="'+esc(b)+'" class="'+(st.big===b?'on':'')+'">'+esc(b)+'</button>'; });
  if(hasNone) h += '<button data-b="none" class="'+(st.big==='none'?'on':'')+'">未分類</button>';
  $('bigTabs').innerHTML = h;
}

function renderYears(){
  const ys = [...new Set(inBig().map(it=>it.year).filter(Boolean))].sort((a,b)=>b-a);
  if(st.year!=='all' && st.year!=='none' && !ys.includes(st.year)) st.year='all';
  const hasNone = inBig().some(it=>!it.year);
  let h = '<button data-y="all" class="'+(st.year==='all'?'on':'')+'">すべて</button>';
  ys.forEach(y=>{ h += '<button data-y="'+y+'" class="'+(st.year===y?'on':'')+'">'+y+'年</button>'; });
  if(hasNone) h += '<button data-y="none" class="'+(st.year==='none'?'on':'')+'">年不明</button>';
  $('years').innerHTML = h;
}
function renderGenres(){
  const gs = [...new Set(inBig().map(it=>it.genre).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
  if(st.genre && !gs.includes(st.genre)) st.genre='';
  $('genreSel').innerHTML = '<option value="">すべて</option>' + gs.map(g=>'<option'+(g===st.genre?' selected':'')+'>'+esc(g)+'</option>').join('');
}
function renderMemChips(){
  $('memChips').innerHTML = MEMBERS.map(m=>'<button class="chip'+(st.mem.includes(m.name)?' on':'')+'" style="--c:'+m.color+'" data-m="'+m.name+'">'+m.short+'</button>').join('');
}
function filtered(){
  const q = st.q.trim().toLowerCase();
  let a = inBig().filter(it=>{
    if(st.year==='none' ? it.year : (st.year!=='all' && it.year!==st.year)) return false;
    if(st.genre && it.genre!==st.genre) return false;
    if(st.mem.length && !st.mem.every(m=>it.six.includes(m))) return false;
    if(st.ex && !it.ex) return false;
    if(st.fav && !favs.has(favKey(it))) return false;
    if(q){
      const hay = [it.title,it.big,it.genre,it.memo,it.date,...it.six,...it.other,...it.six.map(n=>(MEMBERS.find(m=>m.name===n)||{}).short)].join(' ').toLowerCase();
      if(!q.split(/\s+/).every(w=>hay.includes(w))) return false;
    }
    return true;
  });
  const dk = it => it.date || (it.year ? it.year : '');
  if(st.sort==='new') a.sort((x,y)=> dk(y).localeCompare(dk(x)) || y.idx-x.idx);
  else if(st.sort==='old') a.sort((x,y)=> (dk(x)||'9999').localeCompare(dk(y)||'9999') || x.idx-y.idx);
  else if(st.sort==='title') a.sort((x,y)=> x.title.localeCompare(y.title,'ja'));
  else if(st.sort==='added') a.sort((x,y)=> y.idx-x.idx);
  return a;
}
const HEART = '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.2-4.4-9.4-8.9C1 8.3 3 4.5 6.6 4.5c2.1 0 3.6 1.2 5.4 3.2 1.8-2 3.3-3.2 5.4-3.2 3.6 0 5.6 3.8 4 7.1-2.2 4.5-9.4 8.9-9.4 8.9z"/></svg>';
function tagsHTML(it){
  let h = '';
  if(it.six.length===6) h += '<span class="tag" style="--c:var(--accent)">全員</span>';
  else it.six.forEach(n=>{ const m = MEMBERS.find(x=>x.name===n); h += '<span class="tag" style="--c:'+m.color+'">'+m.short+'</span>'; });
  it.other.forEach(o=>{ h += '<span class="tag other">'+esc(o)+'</span>'; });
  if(it.ex) h += '<span class="ex">交換可</span>';
  return h;
}
function render(){
  renderBig(); renderYears(); renderGenres(); renderMemChips();
  document.querySelectorAll('#groupSeg button').forEach(b=>b.classList.toggle('on', b.dataset.g===st.group));
  $('sortSel').value = st.sort; $('exOnly').checked = st.ex; $('favOnly').checked = st.fav;
  const nF = (st.genre?1:0) + st.mem.length + (st.ex?1:0) + (st.fav?1:0);
  $('fBtn').classList.toggle('act', nF>0);
  $('fBtn').textContent = nF ? '絞り込み '+nF : '絞り込み';
  const a = filtered();
  $('count').textContent = a.length + '件 ／ 全' + inGroup().length + '件';
  $('filterNote').textContent = '';
  if(!a.length){ $('list').innerHTML = '<div class="empty">該当するものがありません</div>'; }
  else{
    $('list').innerHTML = a.map(it=>{
      const meta = [it.date || (it.year? it.year+'年':''), [it.big, it.genre].filter(Boolean).join(' / ')].filter(Boolean).map(esc).join('　');
      return '<div class="card" data-i="'+it.idx+'"><div class="r1"><div class="ttl">'+esc(it.title||'（タイトルなし）')+'</div>'+
        '<button class="heart'+(favs.has(favKey(it))?' on':'')+'" data-fav="'+it.idx+'" aria-label="お気に入り">'+HEART+'</button></div>'+
        (meta?'<div class="meta">'+meta+'</div>':'')+
        '<div class="tags">'+tagsHTML(it)+'</div></div>';
    }).join('');
  }
  lsSet('state', {group:st.group, big:st.big, year:st.year, genre:st.genre, mem:st.mem, sort:st.sort, ex:st.ex, fav:st.fav});
}

/* ===== イベント ===== */
$('groupSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  st.group = b.dataset.g; st.big='all'; st.year='all'; st.genre=''; render(); window.scrollTo(0,0);
});
$('bigTabs').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  st.big = b.dataset.b; st.year='all'; st.genre=''; render(); window.scrollTo(0,0);
});
$('years').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  st.year = b.dataset.y; render(); window.scrollTo(0,0);
});
let qT; $('q').addEventListener('input', e=>{ clearTimeout(qT); qT=setTimeout(()=>{ st.q=e.target.value; render(); },150); });
$('fBtn').addEventListener('click', ()=> $('panel').classList.toggle('open'));
$('genreSel').addEventListener('change', e=>{ st.genre=e.target.value; render(); });
$('sortSel').addEventListener('change', e=>{ st.sort=e.target.value; render(); });
$('exOnly').addEventListener('change', e=>{ st.ex=e.target.checked; render(); });
$('favOnly').addEventListener('change', e=>{ st.fav=e.target.checked; render(); });
$('memChips').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  const n = b.dataset.m; st.mem = st.mem.includes(n) ? st.mem.filter(x=>x!==n) : st.mem.concat(n); render();
});
$('clearF').addEventListener('click', ()=>{ Object.assign(st,{big:'all',year:'all',genre:'',mem:[],ex:false,fav:false,sort:'new',q:''}); $('q').value=''; render(); });
$('list').addEventListener('click', e=>{
  const h = e.target.closest('[data-fav]');
  if(h){
    e.stopPropagation();
    const it = items[+h.dataset.fav], k = favKey(it);
    favs.has(k) ? favs.delete(k) : favs.add(k);
    lsSet('favs', [...favs]); h.classList.toggle('on', favs.has(k));
    if(st.fav) render();
    return;
  }
  const c = e.target.closest('.card'); if(c) showDetail(items[+c.dataset.i]);
});
window.addEventListener('scroll', ()=> $('toTop').classList.toggle('show', window.scrollY>600), {passive:true});
$('toTop').addEventListener('click', ()=> window.scrollTo({top:0,behavior:'smooth'}));

/* ===== 詳細 ===== */
function showDetail(it){
  const mem = it.six.length===6 ? '全員' : it.six.map(n=>(MEMBERS.find(m=>m.name===n)||{}).name).join('、');
  const rows = [
    ['タイトル', it.title], ['日付', it.date || (it.year?it.year+'年':'')], ['区分', it.group==='other'?'SixTONES以外':'SixTONESメイン'],
    ['大ジャンル', it.big], ['小ジャンル', it.genre], ['出演者', [mem, ...it.other].filter(Boolean).join('、')], ['交換', it.ex?'可':'不可'], ['メモ', it.memo]
  ].filter(r=>r[1]);
  $('detailBody').innerHTML = '<dl class="dl">'+rows.map(r=>'<dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd>').join('')+'</dl>';
  $('detailBtns').innerHTML = isAdmin ? '<button class="btn d" id="dDel">削除</button><button class="btn p" id="dEdit">編集</button>' : '';
  if(isAdmin){
    $('dEdit').onclick = ()=>{ closeOv('ovDetail'); openEdit(it); };
    $('dDel').onclick = ()=> delItem(it);
  }
  openOv('ovDetail');
}

/* ===== 編集 ===== */
let editing = null, fMemSel = [];
function renderFMem(){
  $('fMem').innerHTML = '<button class="chip'+(fMemSel.length===6?' on':'')+'" style="--c:var(--accent)" data-all="1">全員</button>' +
    MEMBERS.map(m=>'<button class="chip'+(fMemSel.includes(m.name)?' on':'')+'" style="--c:'+m.color+'" data-m="'+m.name+'">'+m.short+'</button>').join('');
}
$('fMem').addEventListener('click', e=>{
  const b = e.target.closest('.chip'); if(!b) return;
  if(b.dataset.all) fMemSel = fMemSel.length===6 ? [] : MEMBERS.map(m=>m.name);
  else { const n=b.dataset.m; fMemSel = fMemSel.includes(n) ? fMemSel.filter(x=>x!==n) : fMemSel.concat(n); }
  fMemSel = MEMBERS.map(m=>m.name).filter(n=>fMemSel.includes(n));
  renderFMem();
});
function openEdit(it){
  editing = it || null;
  $('editTitle').textContent = it ? '編集' : '追加';
  $('fTitle').value = it ? it.title : '';
  const d = it && /^\d{4}\/\d{2}\/\d{2}$/.test(it.date) ? it.date.replace(/\//g,'-') : '';
  $('fDate').value = d;
  $('fGroup').value = (it ? it.group : st.group)==='other' ? 'SixTONES以外' : 'SixTONES';
  const curBig = it ? it.big : (st.big!=='all' && st.big!=='none' ? st.big : BIG[0]);
  const bigs = BIG.concat([...new Set(items.map(x=>x.big).filter(b=>b && !BIG.includes(b)))]);
  if(curBig && !bigs.includes(curBig)) bigs.push(curBig);
  $('fBig').innerHTML = '<option value="">未分類</option>' + bigs.map(b=>'<option'+(b===curBig?' selected':'')+'>'+esc(b)+'</option>').join('');
  $('fGenre').value = it ? it.genre : (st.genre||'');
  fillSmall();
  fMemSel = it ? it.six.slice() : [];
  $('fMemOther').value = it ? it.other.join('、') : '';
  $('fEx').checked = it ? it.ex : false;
  $('fMemo').value = it ? it.memo : '';
  $('editMsg').textContent = '';
  renderFMem();
  openOv('ovEdit');
}
function fillSmall(){
  const b = $('fBig').value;
  const list = [...new Set((SMALL[b]||[]).concat(items.filter(x=>x.big===b).map(x=>x.genre).filter(Boolean)))];
  $('genreList').innerHTML = list.map(g=>'<option value="'+esc(g)+'">').join('');
}
$('fBig').addEventListener('change', fillSmall);
$('saveBtn').addEventListener('click', async ()=>{
  const title = $('fTitle').value.trim();
  if(!title){ $('editMsg').textContent='タイトルを入力してください'; return; }
  const date = $('fDate').value ? $('fDate').value.replace(/-/g,'/') : (editing && !/^\d{4}\/\d{2}\/\d{2}$/.test(editing.date) ? editing.date : '');
  const others = $('fMemOther').value.split(/[,、，\n]+/).map(s=>s.trim()).filter(Boolean);
  const six = fMemSel.length===6 ? ['全員'] : fMemSel;
  const item = {};
  if(editing && editing.id!=='' && editing.id!=null) item[COL.id] = editing.id;
  item[COL.title] = title;
  item[COL.date] = date;
  if(headers.includes(COL.year) || !editing) item[COL.year] = date ? date.slice(0,4) : (editing ? editing.year : '');
  item[COL.category] = $('fBig').value;
  item[COL.genre] = $('fGenre').value.trim();
  item[COL.group] = $('fGroup').value;
  item[COL.members] = six.concat(others).join(memSep);
  item[COL.exchange] = $('fEx').checked ? exTrue : exFalse;
  item[COL.memo] = $('fMemo').value;
  const btn = $('saveBtn'); btn.disabled = true; btn.textContent = '保存中';
  try{
    await api('save', {item, idKey:COL.id, row: editing ? editing.row : ''});
    closeOv('ovEdit'); toast('保存しました'); await load();
  }catch(e){ $('editMsg').textContent = e.message; if(/ログイン/.test(e.message)) logoutLocal(); }
  finally{ btn.disabled=false; btn.textContent='保存'; }
});
async function delItem(it){
  if(!confirm('「'+it.title+'」を削除しますか？')) return;
  try{
    await api('delete', {id:it.id, idKey:COL.id, row:it.row});
    closeOv('ovDetail'); toast('削除しました'); await load();
  }catch(e){ toast(e.message); if(/ログイン/.test(e.message)) logoutLocal(); }
}

/* ===== ログイン（タイトル5回タップ） ===== */
let taps = 0, tapT;
$('title').addEventListener('click', ()=>{
  taps++; clearTimeout(tapT); tapT = setTimeout(()=>taps=0, 1500);
  if(taps>=5){ taps=0; isAdmin ? openOv('ovAdmin') : openLogin(); }
});
function openLogin(){
  $('step1').style.display=''; $('step2').style.display='none';
  $('code').value=''; $('loginMsg').textContent='';
  openOv('ovLogin');
}
$('sendCode').addEventListener('click', async ()=>{
  const b=$('sendCode'); b.disabled=true; b.textContent='送信中'; $('loginMsg').textContent='';
  try{
    await api('requestCode');
    $('step1').style.display='none'; $('step2').style.display=''; setTimeout(()=>$('code').focus(),100);
  }catch(e){ $('loginMsg').textContent=e.message; }
  finally{ b.disabled=false; b.textContent='コードをメールに送る'; }
});
$('backStep').addEventListener('click', ()=>{ $('step1').style.display=''; $('step2').style.display='none'; });
$('verify').addEventListener('click', async ()=>{
  const b=$('verify'); b.disabled=true; $('loginMsg').textContent='';
  try{
    const j = await api('verifyCode', {code:$('code').value});
    token = j.token; lsSet('token', token); setAdmin(true);
    closeOv('ovLogin'); toast('ログインしました');
  }catch(e){ $('loginMsg').textContent=e.message; }
  finally{ b.disabled=false; }
});
$('code').addEventListener('keydown', e=>{ if(e.key==='Enter') $('verify').click(); });
function setAdmin(v){
  isAdmin = v;
  $('adminBtn').textContent = v ? '管理者' : 'ログイン';
  $('adminBtn').classList.toggle('fill', v);
  $('addBtn').classList.toggle('show', v);
}
function logoutLocal(){ token=''; lsSet('token',''); setAdmin(false); }
$('adminBtn').addEventListener('click', ()=> isAdmin ? openOv('ovAdmin') : openLogin());
$('addBtn').addEventListener('click', ()=>openEdit(null));
$('mAdd').addEventListener('click', ()=>{ closeOv('ovAdmin'); openEdit(null); });
$('mReload').addEventListener('click', ()=>{ closeOv('ovAdmin'); load(); });
$('mLogout').addEventListener('click', async ()=>{
  try{ await api('logout'); }catch(_){}
  logoutLocal(); closeOv('ovAdmin'); toast('ログアウトしました');
});

/* ===== 起動 ===== */
load();
if(token){ api('check').then(j=>setAdmin(!!j.admin)).catch(()=>{}); }
</script>
</body>
</html>
