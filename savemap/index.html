<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ec8aaa"><title>保存場所マップ</title><style>
:root{--pink:#ec8aaa;--pink-light:#f8dbe7;--pink-pale:#fff7fa;--pink-dark:#c95a88;--gray:#6b7280;--border:#ead9e1;--text:#1f2937;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--pink-pale);color:var(--text);min-height:100vh;-webkit-text-size-adjust:100%}
header{background:var(--white);border-bottom:2px solid var(--pink-light);padding:12px 16px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:17px;color:var(--pink-dark);font-weight:800}
main{max-width:760px;margin:0 auto;padding:14px 14px 60px}
.btn{border:1.5px solid var(--pink-light);background:var(--white);color:var(--pink-dark);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.danger{color:#991b1b;border-color:#fecaca;background:#fff5f5}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card h3{font-size:14px;margin-bottom:4px}
.sub{font-size:12px;color:var(--gray);line-height:1.6}
input,select,textarea{font-family:inherit;font-size:14px;border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--white);width:100%;color:var(--text)}
textarea{min-height:80px;resize:vertical}
label.l{display:block;font-size:12px;font-weight:700;color:var(--gray);margin:10px 0 4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--pink-light);background:var(--white);color:var(--pink-dark);border-radius:16px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.bar{height:8px;background:var(--pink-light);border-radius:6px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pink)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--pink-light);color:var(--pink-dark);margin-right:4px;font-weight:700}
.muted{color:var(--gray);font-size:13px;text-align:center;padding:24px 0;line-height:1.8}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#374151;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99;max-width:90vw}
.toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:var(--white);border-radius:18px 18px 0 0;padding:16px;width:100%;max-width:760px;max-height:88vh;overflow:auto}
.modal h2{font-size:16px;color:var(--pink-dark);margin-bottom:8px}
details.card summary{cursor:pointer;font-weight:700;font-size:14px;color:var(--pink-dark)}
</style></head><body>

<header><h1>保存場所マップ</h1><button class="btn sm" id="reload">再読み込み</button></header>
<main>
<div class="chips" style="margin-bottom:12px" id="src"><button class="chip on" data-s="0">①と②</button><button class="chip" data-s="1">所持リスト①</button><button class="chip" data-s="2">所持リスト②</button></div>
<div id="out"><div class="muted">読み込み中…</div></div>
</main>
<div class="modal-bg" id="mDetail"><div class="modal"><h2 id="dTitle"></h2><div id="dBody"></div><div class="row" style="margin-top:10px"><button class="btn" onclick="closeModal('mDetail')" style="margin-left:auto">閉じる</button></div></div></div>

<script>

const GAS_URL='https://script.google.com/macros/s/AKfycbxjLSyDyNKZXg7O45aK9nzq--Msdy-i-u7aXqqsfJlpxvV6Lj3NXCI4FwDLT_4aj8A8/exec';
const TK='top_admin_token';
function tok(){try{const o=JSON.parse(localStorage.getItem(TK)||'null');if(o&&o.token&&(!o.expires||o.expires>Date.now()))return o.token;}catch{}return '';}
const isAdmin=()=>!!tok();
let _cb=0;
function jsonp(p,t){return new Promise((res,rej)=>{const n='_c'+(_cb++),s=document.createElement('script');window[n]=d=>{delete window[n];s.remove();res(d);};s.onerror=()=>{delete window[n];s.remove();rej(new Error('error'));};s.src=GAS_URL+'?'+new URLSearchParams({...p,callback:n,t:Date.now()});document.head.appendChild(s);setTimeout(()=>{if(window[n]){delete window[n];s.remove();rej(new Error('timeout'));}},t||20000);});}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[^\p{L}\p{N}]/gu,'');
function toast(t){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e);}e.textContent=t;e.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove('show'),2400);}
const pj=(v,d)=>{try{const x=typeof v==='string'?JSON.parse(v||'null'):v;return x==null?d:x;}catch{return d;}};
async function loadVideos(n){const d=await jsonp({action:n===2?'getVideos2':'getVideos',token:tok()});return Array.isArray(d)?d.map(v=>({...v,_list:n})):[];}
async function loadWishlist(){const d=await jsonp({action:'getWishlist'});return Array.isArray(d)?d:[];}
async function loadChecks(n){if(!isAdmin())return null;try{const d=await jsonp({action:'getChecks',list:String(n),token:tok()});if(d&&d.ok&&Array.isArray(d.ids))return new Set(d.ids.map(String));}catch{}return null;}
function tracksOf(v){const a=pj(v.tracks,[]);return Array.isArray(a)?a.map(t=>typeof t==='string'?{title:t}:(t||{})):[];}
function metaOf(v){const o=pj(v.meta,{});if(!o||typeof o!=='object')return{tr:[]};const tr=Array.isArray(o.tr)?o.tr.slice():[];if(o.res||o.size||o.loc||o.dur){const t0=tr[0]||{};if(!(t0.res||t0.size||t0.loc)){tr[0]={res:o.res||'',size:o.size||'',loc:o.loc||'',dur:o.dur||''};}}return{tr};}
function schedulesOf(v){const a=pj(v.dates,[]);return(Array.isArray(a)?a:[]).map(x=>typeof x==='string'?{date:x,times:[]}:x).filter(x=>x&&x.date);}
function genresOf(v){const a=pj(v.genres,[]);return Array.isArray(a)?a:[];}
function sizeGB(s){const m=/([0-9]+(?:\.[0-9]+)?)\s*([kmgt]?)b?/i.exec(String(s||'').normalize('NFKC'));if(!m)return 0;const n=parseFloat(m[1]),u=m[2].toLowerCase();return u==='t'?n*1024:u==='m'?n/1024:u==='k'?n/1048576:n;}
function fmtGB(g){return g>=1024?(g/1024).toFixed(2)+' TB':g>=1?g.toFixed(2)+' GB':(g*1024).toFixed(0)+' MB';}
function durSec(s){s=String(s||'').normalize('NFKC').trim();let m=/^(\d+):(\d{2}):(\d{2})$/.exec(s);if(m)return +m[1]*3600+ +m[2]*60+ +m[3];m=/^(\d+):(\d{2})$/.exec(s);if(m)return +m[1]*60+ +m[2];m=/(?:(\d+)\s*時間)?\s*(?:(\d+)\s*分)?/.exec(s);if(m&&(m[1]||m[2]))return(+m[1]||0)*3600+(+m[2]||0)*60;return 0;}
function fmtDur(t){const p=n=>String(n).padStart(2,'0');return p(Math.floor(t/3600))+':'+p(Math.floor(t%3600/60))+':'+p(t%60);}

function initAuth(){
const hd=document.querySelector('header');if(!hd)return;
const btn=document.createElement('button');btn.className='btn sm';btn.id='authBtn';hd.appendChild(btn);
const bg=document.createElement('div');bg.className='modal-bg';bg.id='mAuth';
bg.innerHTML='<div class="modal"><h2>管理者ログイン</h2><div class="sub" id="aMsg">管理者のメールアドレスに、6桁のコードを送ります。</div><div id="aS1" style="margin-top:12px"><button class="btn primary" id="aSend" style="width:100%">コードを送る</button><button class="btn" id="aHave" style="width:100%%;margin-top:8px">すでにコードを持っている</button></div><div id="aS2" style="display:none;margin-top:12px"><input id="aCode" inputmode="numeric" maxlength="6" placeholder="6桁のコード" style="font-size:20px;letter-spacing:4px;text-align:center"><button class="btn primary" id="aVerify" style="width:100%;margin-top:10px">ログイン</button></div><div class="row" style="margin-top:12px"><button class="btn" id="aClose" style="margin-left:auto">閉じる</button></div></div>';
document.body.appendChild(bg);
const ERR={too_soon:'少し時間をおいてから、もう一度押してください。',rate_limited:'送信回数の上限です。1時間ほど待ってからお試しください。',expired:'コードの有効期限が切れました。もう一度コードを送ってください。',locked:'失敗が続いたため、しばらくロックされています。時間をおいてお試しください。'};
const msg=t=>{document.getElementById('aMsg').textContent=t;};
const draw=()=>{btn.textContent=isAdmin()?'ログアウト':'ログイン';};
const step2=()=>{document.getElementById('aS1').style.display='none';document.getElementById('aS2').style.display='';document.getElementById('aCode').focus();};
draw();
btn.onclick=async()=>{if(isAdmin()){const t=tok();try{localStorage.removeItem(TK);}catch{}draw();try{await jsonp({action:'logoutAdmin',token:t},8000);}catch{}toast('ログアウトしました');if(window.onAuth)window.onAuth();return;}
document.getElementById('aS1').style.display='';document.getElementById('aS2').style.display='none';msg('管理者のメールアドレスに、6桁のコードを送ります。');openModal('mAuth');};
document.getElementById('aClose').onclick=()=>closeModal('mAuth');
document.getElementById('aHave').onclick=()=>{msg('届いたコードを入力してください。');step2();};
document.getElementById('aSend').onclick=async()=>{const b=document.getElementById('aSend');b.disabled=true;msg('送信中…（数秒かかります）');
try{const d=await jsonp({action:'requestAdminCode'},30000);if(d&&(d.ok||d.error==='too_soon')){msg(d.ok?'管理者のメールにコードを送りました。10分以内に入力してください。':'直前にコードを送信済みです。メールに届いたコードを入力してください。');step2();}else{msg(ERR[d&&d.error]||('送信に失敗しました（'+((d&&d.error)||'応答なし')+'）'));}}catch(e){msg('通信に失敗しました（'+e.message+'）。もう一度お試しください。');}
b.disabled=false;};
document.getElementById('aVerify').onclick=async()=>{const code=document.getElementById('aCode').value.trim();if(!/^[0-9]{6}$/.test(code)){msg('6桁の数字を入力してください。');return;}
const b=document.getElementById('aVerify');b.disabled=true;msg('確認中…');
try{const d=await jsonp({action:'verifyAdminCode',code},15000);if(d&&d.ok){try{localStorage.setItem(TK,JSON.stringify({token:d.token,expires:d.expires}));}catch{}closeModal('mAuth');draw();toast('ログインしました');if(window.onAuth)window.onAuth();}else{msg(ERR[d&&d.error]||'ログインに失敗しました。');if(d&&(d.error==='expired'||d.error==='locked')){document.getElementById('aS1').style.display='';document.getElementById('aS2').style.display='none';}}}catch{msg('通信に失敗しました。もう一度お試しください。');}
b.disabled=false;};
}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function openModal(id){document.getElementById(id).classList.add('show');}


let all=[],src=0,groups=new Map();
async function load(){
document.getElementById('out').innerHTML='<div class="muted">読み込み中…</div>';
if(!isAdmin()){document.getElementById('out').innerHTML='<div class="muted">保存場所は管理者のみ見られます。<br>所持リスト①②で管理者ログインしたあと、このページを開き直してください。</div>';return;}
try{const [a,b]=await Promise.all([loadVideos(1),loadVideos(2)]);all=[...a,...b];}catch{document.getElementById('out').innerHTML='<div class="muted">読み込めませんでした。通信状況を確認して、再読み込みしてください。</div>';return;}
build();}
function build(){
groups=new Map();let anyMeta=false;
all.filter(v=>!src||v._list===src).forEach(v=>{const tr=tracksOf(v),mt=metaOf(v).tr;
const n=Math.max(tr.length,mt.length);
for(let i=0;i<n;i++){const m=mt[i]||{};if(!(m.res||m.size||m.loc||m.dur))continue;anyMeta=true;
const locs=String(m.loc||'').split(/[,、，\/／]+/).map(s=>s.trim()).filter(Boolean);if(!locs.length)locs.push('保存場所の未入力');
locs.forEach(loc=>{let g=groups.get(loc);if(!g){g={loc,n:0,gb:0,sec:0,items:[]};groups.set(loc,g);}g.n++;g.gb+=sizeGB(m.size);g.sec+=durSec(m.dur);g.items.push({v,t:tr[i],m});});}
});
const arr=[...groups.values()].sort((a,b)=>b.gb-a.gb||b.n-a.n);
if(!anyMeta){document.getElementById('out').innerHTML='<div class="muted">ファイル情報がまだありません。<br>所持リストの編集画面で、収録内容ごとに保存場所・容量を入力すると、ここに集計されます。<br>（GASを最新版にしていない場合も表示されません）</div>';return;}
const tg=arr.reduce((s,g)=>s+g.gb,0),ts=arr.reduce((s,g)=>s+g.sec,0),tn=arr.reduce((s,g)=>s+g.n,0);
const mx=Math.max(...arr.map(g=>g.gb),0.0001);
let h='<div class="card"><div class="row"><span class="tag">保存場所 '+arr.length+' 件</span><span class="tag">収録内容 '+tn+' 件</span><span class="tag">合計 '+fmtGB(tg)+'</span>'+(ts?'<span class="tag">合計 '+fmtDur(ts)+'</span>':'')+'</div></div>';
arr.forEach((g,i)=>{h+='<div class="card" data-i="'+i+'" style="cursor:pointer"><div class="row" style="justify-content:space-between"><h3>'+esc(g.loc)+'</h3><span class="sub">'+g.n+' 件</span></div><div class="sub">'+fmtGB(g.gb)+(g.sec?'　'+fmtDur(g.sec):'')+'</div><div class="bar"><i style="width:'+Math.max(2,g.gb/mx*100)+'%"></i></div></div>';});
document.getElementById('out').innerHTML=h;window._arr=arr;}
document.getElementById('out').addEventListener('click',e=>{const c=e.target.closest('[data-i]');if(!c)return;const g=window._arr[+c.dataset.i];
document.getElementById('dTitle').textContent=g.loc+'（'+g.n+' 件）';
document.getElementById('dBody').innerHTML=g.items.map(x=>'<div class="card" style="padding:9px 12px;margin-bottom:6px"><div style="font-size:13px;font-weight:700">'+esc(x.v.title)+'</div><div class="sub">'+esc(x.t&&x.t.title?x.t.title:'')+'　'+esc([x.m.res,x.m.size,x.m.dur].filter(Boolean).join('　'))+'　所持リスト'+(x.v._list===2?'②':'①')+'</div></div>').join('');openModal('mDetail');});
document.getElementById('src').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;src=+b.dataset.s;document.querySelectorAll('#src .chip').forEach(x=>x.classList.toggle('on',x===b));build();});
document.getElementById('reload').onclick=load;
window.onAuth=load;
load();

initAuth();
</script></body></html>
