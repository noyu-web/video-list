<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>所持リスト2</title>
<style>
:root{--pink:#e8749a;--pink-light:#f5c6d8;--pink-pale:#fdf0f5;--pink-dark:#c45580;--gray:#6b7280;--gray-light:#f3f4f6;--text:#1f2937;--border:#e5e7eb;--white:#fff;--shadow:0 2px 8px rgba(232,116,154,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;background:var(--pink-pale);color:var(--text);min-height:100vh}
header{background:var(--white);border-bottom:2px solid var(--pink-light);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.header-title{font-size:17px;font-weight:700;color:var(--pink-dark)}
.header-right{display:flex;align-items:center;gap:8px}
.mode-badge{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
.mode-badge.admin{background:var(--pink);color:white}
.mode-badge.view{background:var(--gray-light);color:var(--gray)}
.btn-icon{background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--gray);font-size:18px}
.tabs-wrap{background:var(--white);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tabs-wrap::-webkit-scrollbar{display:none}
.tabs{display:flex;padding:0 12px;min-width:max-content}
.tab{padding:11px 14px;font-size:13px;font-weight:600;color:var(--gray);cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;white-space:nowrap}
.tab.active{color:var(--pink);border-bottom-color:var(--pink)}
.subtabs-wrap{background:var(--pink-pale);border-bottom:1px solid var(--pink-light);overflow-x:auto;scrollbar-width:none;display:none}
.subtabs-wrap.visible{display:block}
.subtabs{display:flex;padding:6px 12px;gap:6px;min-width:max-content;flex-wrap:wrap}
.subtab{padding:5px 12px;font-size:12px;font-weight:600;color:var(--gray);cursor:pointer;border:1.5px solid var(--border);border-radius:20px;background:var(--white);white-space:nowrap}
.subtab.active{color:var(--pink-dark);border-color:var(--pink);background:var(--pink-light)}
.toolbar{padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:8px 16px;border-radius:20px;border:none;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary{background:var(--pink);color:white}
.filter-bar{padding:0 14px 10px;display:flex;gap:6px;flex-wrap:wrap}
.filter-chip{padding:4px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--white);font-size:12px;cursor:pointer;color:var(--gray)}
.filter-chip.active{background:var(--pink-light);border-color:var(--pink);color:var(--pink-dark);font-weight:600}
.list-wrap{padding:0 14px 40px}
.list-count{font-size:12px;color:var(--gray);padding:4px 0 10px}
.card{background:var(--white);border-radius:12px;border:1px solid var(--border);margin-bottom:8px;overflow:hidden;cursor:pointer}
.card:hover{box-shadow:var(--shadow)}
.card-main{padding:12px 13px;display:flex;align-items:flex-start;gap:8px}
.card-info{flex:1;min-width:0}
.card-title{font-size:14px;font-weight:600;line-height:1.4;word-break:break-all}
.card-sub{font-size:11px;color:var(--gray);margin-top:2px}
.card-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500}
.tag-jesse{background:#ffb3b3;color:#7b0000}
.tag-kyomo{background:#ffb3d9;color:#7b0044}
.tag-matsu{background:#4a4a4a;color:white}
.tag-kochi{background:#fff0b3;color:#7a5c00}
.tag-mori{background:#b3f0c8;color:#1a5c35}
.tag-juri{background:#b3d4ff;color:#003d7a}
.tag-sixtones{background:#e0e0e0;color:#555}
.tag-all{background:#fce7f3;color:#9d174d}
.tag-date{background:#eff6ff;color:#1e40af;font-family:monospace;font-size:12px;padding:3px 10px}
.tag-time{background:#e0f2fe;color:#0369a1;font-family:monospace;font-size:10px;padding:2px 7px}
.tag-genre{background:#f3e8ff;color:#6b21a8;font-size:10px}
.exchange-badge{font-size:11px;padding:3px 9px;border-radius:10px;font-weight:600;white-space:nowrap;flex-shrink:0}
.exchange-ok{background:#dcfce7;color:#166534}
.exchange-ng{background:#fee2e2;color:#991b1b}
.exchange-partial{background:#fef3c7;color:#92400e}
.exchange-consult{background:#ede9fe;color:#5b21b6}
.toggle-wrap{display:flex;align-items:center;gap:6px;margin-top:8px}
.toggle{position:relative;width:36px;height:20px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#d1d5db;border-radius:20px;transition:.2s}
.toggle-slider::before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:white;border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-slider{background:#22c55e}
.toggle input:checked+.toggle-slider::before{transform:translateX(16px)}
.toggle-label{font-size:12px;color:var(--gray)}
.card-actions{display:flex;gap:6px;padding:0 13px 10px;justify-content:flex-end}
.btn-sm{padding:4px 12px;font-size:12px;border-radius:8px;border:none;cursor:pointer;font-weight:600}
.btn-edit{background:var(--pink-pale);color:var(--pink-dark)}
.btn-delete{background:#fee2e2;color:#991b1b}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--white);border-radius:16px;width:100%;max-width:480px;padding:22px;box-shadow:0 8px 32px rgba(0,0,0,.18);max-height:90vh;overflow-y:auto}
.modal-title{font-size:16px;font-weight:700;color:var(--pink-dark);margin-bottom:18px}
.form-group{margin-bottom:13px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:4px}
.form-input,.form-select,.form-textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;outline:none;font-family:inherit}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--pink)}
.form-textarea{resize:vertical;min-height:60px}
.chips-grid{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 12px;border-radius:20px;border:1.5px solid var(--border);font-size:12px;cursor:pointer;background:var(--white);color:var(--gray)}
.chip.selected{background:var(--pink-light);border-color:var(--pink);color:var(--pink-dark);font-weight:600}
.genre-section{border:1.5px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--pink-pale)}
.genre-section-title{font-size:12px;font-weight:700;color:var(--pink-dark);margin-bottom:8px}
.dates-section{border:1.5px solid var(--border);border-radius:10px;padding:10px;margin-bottom:4px}
.date-group{background:var(--pink-pale);border-radius:8px;padding:8px;margin-bottom:8px}
.date-group-header{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.date-group-header input{flex:1}
.times-wrap{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.time-row{display:flex;align-items:center;gap:4px}
.btn-remove{background:#fee2e2;color:#991b1b;border:none;border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer}
.btn-add-small{background:var(--pink-pale);color:var(--pink-dark);border:none;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;margin-top:4px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn-cancel{background:var(--gray-light);color:var(--gray);padding:9px 18px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer}
.btn-save{background:var(--pink);color:white;padding:9px 18px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer}
.manage-list{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto}
.manage-item{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--gray-light);border-radius:8px;font-size:13px}
.section-title{font-size:12px;font-weight:700;color:var(--pink-dark);margin-bottom:6px}
.empty{text-align:center;padding:48px 0;color:var(--gray)}
.empty-icon{font-size:32px;margin-bottom:8px}
.loading{text-align:center;padding:40px;color:var(--gray);font-size:14px}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
<div class="header-title" id="headerTitle" style="cursor:default">所持リスト2</div>
<div class="header-right">
<span class="mode-badge view" id="modeBadge">閲覧モード</span>
<button class="btn-icon" id="settingsBtn" style="display:none">⚙️</button>
<button id="authBtn" style="background:none;border:none;cursor:default;opacity:0;font-size:1px;padding:0;width:1px;height:1px;overflow:hidden;pointer-events:none"></button>
</div>
</header>
<div class="tabs-wrap"><div class="tabs" id="tabs"></div></div>
<div class="subtabs-wrap" id="subtabsWrap"><div class="subtabs" id="subtabs"></div></div>
<div id="adminToolbar" class="toolbar hidden">
<button class="btn btn-primary" id="addBtn">＋ 追加</button>
</div>
<div style="display:flex;align-items:center;gap:8px;padding:0 16px 6px">
<span style="font-size:12px;color:var(--gray)">並び替え</span>
<select id="sortSelect" style="font-size:12px;padding:4px 8px;border:1px solid var(--border);border-radius:8px;background:var(--white)">
<option value="default">登録順</option>

<div id="yearTabsWrap" style="display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none"></div>
<div class="filter-bar" id="filterBar"></div>
<div class="list-wrap">
<div class="list-count" id="listCount"></div>

</div>
<div class="modal-overlay hidden" id="detailModal">

<div id="detailMembers" class="card-meta" style="margin-bottom:12px"></div>
<div id="detailExchange" style="margin-bottom:12px"></div>
<div id="detailSchedules" style="margin-bottom:12px"></div>
<div id="detailTracks"></div>
<div id="detailNote"></div>
</div>
</div>
<div class="modal-overlay hidden" id="authModal">
<div class="modal">
<div class="modal-title">管理者ログイン</div>
<div class="form-group"><input class="form-input" type="password" id="authInput" placeholder="パスワード"></div>

<button class="btn-cancel" id="authCancelBtn">キャンセル</button>
<button class="btn-save" id="authSubmitBtn">ログイン</button>
</div>
</div>
</div>
<div class="modal-overlay hidden" id="settingsModal">
<div class="modal">
<div class="modal-title">⚙️ 設定</div>
<div class="form-group">
<div class="section-title">ジャンル管理</div>
<div class="manage-list" id="genreManageList"></div>
<div style="display:flex;gap:6px;margin-top:8px">
<input class="form-input" id="newGenreInput" placeholder="新しいジャンル名" style="flex:1">
<button class="btn btn-primary" id="addGenreBtn" style="border-radius:8px;padding:8px 14px">追加</button>
</div>
</div>
<div class="form-group">
<div class="section-title">出演者管理</div>
<div class="manage-list" id="memberManageList"></div>
<div style="display:flex;gap:6px;margin-top:8px">
<input class="form-input" id="newMemberInput" placeholder="新しい出演者名" style="flex:1">
<button class="btn btn-primary" id="addMemberBtn" style="border-radius:8px;padding:8px 14px">追加</button>
</div>
</div>
<div class="form-group">
<div class="section-title">SixTONES以外 出演者管理</div>
<div style="font-size:11px;color:var(--gray);margin-bottom:8px">グループを選んで個人名を管理</div>
<select class="form-select" id="otherGroupSelect" style="margin-bottom:8px"></select>
<div class="manage-list" id="otherMemberManageList"></div>
<div style="display:flex;gap:6px;margin-top:8px">
<input class="form-input" id="newOtherMemberInput" placeholder="新しい名前" style="flex:1">
<button class="btn btn-primary" id="addOtherMemberBtn" style="border-radius:8px;padding:8px 14px">追加</button>
</div>
</div>

<button class="btn-save" id="settingsCloseBtn">閉じる</button>

</div>
<div class="modal-overlay hidden" id="crossModal">

<button class="modal-close" onclick="document.getElementById('crossModal').classList.add('hidden')">×</button>
</div>

</div>
</div>
<div class="modal-overlay hidden" id="subgenreModal">
<div class="modal">
<div class="modal-title" id="subgenreModalTitle">小ジャンル管理</div>
<div class="manage-list" id="subgenreManageList"></div>
<div style="display:flex;gap:6px;margin-top:8px">
<input class="form-input" id="newSubgenreInput" placeholder="新しい小ジャンル名" style="flex:1">
<button class="btn btn-primary" id="addSubgenreBtn" style="border-radius:8px;padding:8px 14px">追加</button>
</div>
<div class="modal-footer">
<button class="btn-save" id="subgenreCloseBtn">閉じる</button>
</div>
</div>
</div>
<div class="modal-overlay hidden" id="editModal">
<div class="modal">
<div class="modal-title" id="editModalTitle">動画を追加</div>
<div class="form-group">
<label class="form-label">タイトル</label>
<input class="form-input" type="text" id="editTitle" placeholder="タイトルを入力">
</div>
<div style="border-top:2px solid var(--pink-light);margin:16px 0"></div>
<div class="form-group">
<label class="form-label" style="font-size:13px;color:var(--pink-dark);font-weight:700">👥 出演者（SixTONES）</label>
<div class="chips-grid" id="memberChips"></div>
</div>
<div class="form-group" id="otherMemberGroup">
<label class="form-label">出演者（SixTONES以外）</label>
<div class="chips-grid" id="otherMemberChips"></div>
</div>
<div class="form-group">
<label class="form-label">交換</label>
<select class="form-select" id="editExchange">
<option value="ok">可</option>
<option value="partial">一部交換可</option>
<option value="consult">要相談</option>

</select>
</div>

<label class="form-label">ジャンル・小ジャンル（複数選択可）</label>
<div id="genreSections"></div>
</div>
<div class="form-group">
<label class="form-label" style="font-size:13px;color:var(--pink-dark);font-weight:700;border-top:1.5px solid var(--pink-light);padding-top:12px;display:block">📅 配信,放送日</label>
<div class="dates-section" style="margin-top:6px">
<div id="dateGroupsWrap"></div>
<button class="btn-add-small" id="addDateGroupBtn">＋ 日付を追加</button>
</div>
</div>

<label class="form-label">収録内容,詳細</label>

</div>

</div>
</div>
</div>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbzcQk2qXHLkun0bAgOYsFJiATESW-eju6s8ZqplZwvxXr94hpmZKmzLqIu5UaHRDTzU/exec';
const ADMIN_PW='0703clarinet';
const DEFAULT_GENRES=['すべて','ガムシャラ','ISLAND TV(ショート動画)','GOスト'];
const DEFAULT_SUBGENRES={'ガムシャラ':[],'ISLAND TV(ショート動画)':[],'GOスト':[]};
const DEFAULT_MEMBERS=['京本大我','ジェシー','田中樹','松村北斗','髙地優吾','森本慎太郎','SixTONES'];
const DEFAULT_OTHER_MEMBERS={'DOMOTO(KinKi kids)':['堂本光一','堂本剛'],'V6':['坂本昌行','長野博','井ノ原快彦','森田剛','三宅健','岡田准一'],'嵐':['大野智','櫻井翔','相葉雅紀','二宮和也','松本潤'],'Snow Man':['ラウール','向井康二','目黒蓮','渡辺翔太','岩本照','深澤辰哉','阿部亮平','宮舘涼太','佐久間大介'],'なにわ男子':['道枝駿佑','高橋恭平','西畑大吾','大橋和也','藤原丈一郎','長尾謙杜','小島健']};
let _cfg=null;
async function loadFullConfigFromServer(){
try{
const data=await gasGet({action:'getFullConfig2'});
if(data&&data.genres){
_cfg={
genres:data.genres||DEFAULT_GENRES,
subgenres:data.subgenres||DEFAULT_SUBGENRES,
members:data.members||DEFAULT_MEMBERS,
otherMembers:data.otherMembers||DEFAULT_OTHER_MEMBERS
};
try{
localStorage.setItem('cfg_genres2',JSON.stringify(_cfg.genres));
localStorage.setItem('cfg_subgenres2',JSON.stringify(_cfg.subgenres));
localStorage.setItem('cfg_members2',JSON.stringify(_cfg.members));
localStorage.setItem('cfg_other_members2',JSON.stringify(_cfg.otherMembers));
}catch{}
}
}catch{}
}
function loadConfig(){
if(_cfg)return _cfg;
try{
const cfg={
genres:JSON.parse(localStorage.getItem('cfg_genres2'))||DEFAULT_GENRES,
subgenres:JSON.parse(localStorage.getItem('cfg_subgenres2'))||DEFAULT_SUBGENRES,
members:JSON.parse(localStorage.getItem('cfg_members2'))||DEFAULT_MEMBERS,
otherMembers:JSON.parse(localStorage.getItem('cfg_other_members2'))||DEFAULT_OTHER_MEMBERS
};
_cfg=cfg;
return cfg;
}catch{return{genres:DEFAULT_GENRES,subgenres:DEFAULT_SUBGENRES,members:DEFAULT_MEMBERS,otherMembers:DEFAULT_OTHER_MEMBERS};}
}
function saveConfig(cfg){
_cfg=cfg;
try{
localStorage.setItem('cfg_genres2',JSON.stringify(cfg.genres));
localStorage.setItem('cfg_subgenres2',JSON.stringify(cfg.subgenres));
localStorage.setItem('cfg_members2',JSON.stringify(cfg.members));
localStorage.setItem('cfg_other_members2',JSON.stringify(cfg.otherMembers));
}catch{}
gasGet({action:'saveFullConfig2',data:encodeURIComponent(JSON.stringify(cfg))}).catch(()=>{});
}
let isAdmin=false,currentGenre='すべて',currentSubgenre='すべて',currentFilter='すべて',searchQuery='',editingId=null,cachedVideos=null,cbIdx=0,sortOrder='default',yearFilter='all';
let cfg=loadConfig();
const SIXTONES_MEMBERS=['京本大我','ジェシー','田中樹','松村北斗','髙地優吾','森本慎太郎','SixTONES'];
function isSixTONESMember(m){return SIXTONES_MEMBERS.includes(m)||loadConfig().members.includes(m);}
function memberClass(m){
if(m==='ジェシー')return'tag-jesse';
if(m==='京本大我')return'tag-kyomo';
if(m==='松村北斗')return'tag-matsu';
if(m==='髙地優吾')return'tag-kochi';
if(m==='森本慎太郎')return'tag-mori';
if(m==='田中樹')return'tag-juri';
if(m==='SixTONES')return'tag-sixtones';
return'tag-all';
}
function exchangeClass(e){return e==='ok'?'exchange-ok':e==='partial'?'exchange-partial':e==='consult'?'exchange-consult':'exchange-ng';}
function exchangeLabel(e){return e==='ok'?'交換可':e==='partial'?'一部交換可':e==='consult'?'要相談':'交換不可';}
function jsonp(params){
return new Promise((resolve,reject)=>{
const name='_cb'+cbIdx++;const s=document.createElement('script');
window[name]=(d)=>{delete window[name];s.remove();resolve(d);};
s.onerror=()=>{delete window[name];s.remove();reject();};
s.src=GAS_URL+'?'+new URLSearchParams({...params,callback:name,t:Date.now()});
document.head.appendChild(s);
setTimeout(()=>{if(window[name]){delete window[name];s.remove();reject();}},15000);
});
}
async function gasGet(params){return jsonp(params);}
async function loadVideos(force=false){
if(cachedVideos&&!force)return cachedVideos;
if(!force){
try{
const cached=localStorage.getItem('videos_ls_cache');
if(cached){
cachedVideos=JSON.parse(cached);
gasGet({action:'getVideos2'}).then(data=>{
if(Array.isArray(data)){
cachedVideos=data;
try{localStorage.setItem('videos_ls_cache',JSON.stringify(data));}catch{}
}
}).catch(()=>{});
return cachedVideos;
}
}catch{}
}
cachedVideos=await gasGet({action:'getVideos2'});
if(!Array.isArray(cachedVideos))cachedVideos=[];
try{localStorage.setItem('videos_ls_cache',JSON.stringify(cachedVideos));}catch{}
return cachedVideos;
}
function parseGenres(str){
if(!str||str==='[]'||str.trim()==='')return[];
try{
const parsed=JSON.parse(str);
return Array.isArray(parsed)?parsed.filter(g=>g&&g.genre):[];
}catch{
if(str&&str.includes(',')){const p=str.split(',');return p[0]?[{genre:p[0],subgenre:p[1]||''}]:[];}
return str&&str!=='ok'&&str!=='ng'?[{genre:str,subgenre:''}]:[];
}
}
function formatSchedules(str){
if(!str||str==='[]'||str.trim()==='')return[];
try{
const parsed=JSON.parse(str);
return Array.isArray(parsed)?parsed.filter(s=>s&&s.date&&s.date.trim()):[];
}catch{
return str?str.split(',').filter(d=>d&&d.trim()&&d!=='ok'&&d!=='ng').map(d=>({date:d,times:[]})):[];
}
}
function renderTabs(){
cfg=loadConfig();
const t=document.getElementById('tabs');
t.innerHTML=cfg.genres.map(g=><button class="tab ${currentGenre===g?'active':''}" data-g="${esc(g)}">${esc(g)}</button>).join('');
t.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{currentGenre=b.dataset.g;currentSubgenre='すべて';renderTabs();renderSubtabs();renderYearTabs(cachedVideos||[]);
renderList();}));
}
function renderSubtabs(){
cfg=loadConfig();
const wrap=document.getElementById('subtabsWrap');
if(currentGenre==='すべて'){wrap.classList.remove('visible');return;}
const subs=cfg.subgenres[currentGenre]||[];
if(!subs.length&&!isAdmin){wrap.classList.remove('visible');return;}
wrap.classList.add('visible');
let html=<button class="subtab ${currentSubgenre==='すべて'?'active':''}" data-s="すべて">すべて</button>;
html+=subs.map(s=><button class="subtab ${currentSubgenre===s?'active':''}" data-s="${esc(s)}">${esc(s)}</button>).join('');
if(isAdmin)html+=<button class="subtab" id="manageSubBtn" style="background:var(--pink-pale);color:var(--pink-dark);border-color:var(--pink-light)">＋ 編集</button>;
document.getElementById('subtabs').innerHTML=html;
document.getElementById('subtabs').querySelectorAll('.subtab[data-s]').forEach(b=>b.addEventListener('click',()=>{currentSubgenre=b.dataset.s;renderSubtabs();renderList();}));
if(isAdmin){const btn=document.getElementById('manageSubBtn');if(btn)btn.addEventListener('click',()=>openSubgenreModal());}
}
function renderFilterBar(){
const bar=document.getElementById('filterBar');bar.innerHTML='';
['すべて','交換可','一部交換可','要相談','交換不可'].forEach(f=>{
const c=document.createElement('button');c.className='filter-chip'+(currentFilter===f?' active':'');c.textContent=f;
c.addEventListener('click',()=>{currentFilter=f;renderFilterBar();renderList();});bar.appendChild(c);
});
}
function renderYearTabs(items){
const wrap=document.getElementById('yearTabsWrap');
if(!wrap)return;
const years=new Set();
items.forEach(item=>{
formatSchedules(item.dates).forEach(s=>{
if(s.date){const y=s.date.substring(0,4);if(/^[0-9]{4}/.test(y))years.add(y);}
});
try{
const tracks=JSON.parse(item.tracks||'[]');
tracks.forEach(t=>{
if(t.date){const y=String(t.date).substring(0,4);if(/^[0-9]{4}/.test(y))years.add(y);}
});
}catch{}
});
const sorted=['all',...[...years].sort()];
wrap.innerHTML=sorted.map(y=><button class="chip-filter${yearFilter===y?' selected':''}" data-year="${y}" style="white-space:nowrap;font-size:12px;padding:4px 12px;border:1px solid var(--border);border-radius:14px;background:${yearFilter===y?'var(--pink)':'var(--white)'};color:${yearFilter===y?'#fff':'inherit'}">${y==='all'?'すべて':y}</button>).join('');
wrap.querySelectorAll('[data-year]').forEach(b=>b.addEventListener('click',()=>{
yearFilter=b.dataset.year;renderList();
}));
}
function crossSearch(member){
const modal=document.getElementById('crossModal');
const title=document.getElementById('crossModalTitle');
const list=document.getElementById('crossModalList');
title.textContent=member+' の出演作品';
loadVideos().then(videos=>{
const matched=videos.filter(v=>(v.members||[]).includes(member));
if(!matched.length){list.innerHTML='<p style="color:var(--gray);font-size:13px">該当なし</p>';modal.classList.remove('hidden');return;}
const grouped={};
matched.forEach(v=>{
const genres=parseGenres(v.genres||v.genre||'');
const g=genres.length?(genres[0].genre+(genres[0].subgenre?' / '+genres[0].subgenre:'')):'その他';
if(!grouped[g])grouped[g]=[];
grouped[g].push(v);
});
list.innerHTML=Object.entries(grouped).map(([g,items])=> <div style="margin-bottom:12px"> <div style="font-size:12px;font-weight:700;color:var(--pink-dark);margin-bottom:6px;border-bottom:1px solid var(--pink-light);padding-bottom:4px">${esc(g)}</div> ${items.map(v=><div style="font-size:13px;padding:4px 0;border-bottom:1px solid var(--border)">${esc(v.title)}</div>).join('')} </div>).join('');
modal.classList.remove('hidden');
});
}
async function renderList(){
const list=document.getElementById('cardList');
let data=cachedVideos||await loadVideos();
renderYearTabs(data);
if(currentGenre!=='すべて'){
data=data.filter(item=>{
const genres=parseGenres(item.genres||item.genre||'');
return genres.some(g=>g.genre===currentGenre&&(currentSubgenre==='すべて'||g.subgenre===currentSubgenre));
});
}
const filterMap={'交換可':'ok','一部交換可':'partial','要相談':'consult','交換不可':'ng'};
if(currentFilter!=='すべて')data=data.filter(d=>d.exchange===filterMap[currentFilter]);
if(yearFilter!=='all'){
data=data.filter(item=>{
const dd=formatSchedules(item.dates);
if(dd.some(s=>s.date&&s.date.substring(0,4)===yearFilter))return true;
try{
const tracks=JSON.parse(item.tracks||'[]');
return tracks.some(t=>t.date&&String(t.date).substring(0,4)===yearFilter);
}catch{return false;}
});
}
const gd=item=>{const dd=formatSchedules(item.dates).map(s=>s.date).filter(Boolean).sort();return dd.length?dd[0]:'';};
if(sortOrder==='date_new'){
data=[...data].sort((a,b)=>{const da=gd(a),db=gd(b);if(!da&&!db)return 0;if(!da)return 1;if(!db)return -1;return db.localeCompare(da);});
}else if(sortOrder==='date_old'){
data=[...data].sort((a,b)=>{const da=gd(a),db=gd(b);if(!da&&!db)return 0;if(!da)return 1;if(!db)return -1;return da.localeCompare(db);});
}else if(sortOrder==='title'){
data=[...data].sort((a,b)=>String(a.title).localeCompare(String(b.title),'ja'));
}else if(sortOrder==='exchange'){
const o={ok:0,partial:1,consult:2,ng:3};
data=[...data].sort((a,b)=>(o[a.exchange]??9)-(o[b.exchange]??9));
}
document.getElementById('listCount').textContent=data.length+' 件';
if(!data.length){list.innerHTML='<div class="empty"><div class="empty-icon">📭</div><div style="font-size:14px">該当する動画がありません</div></div>';return;}
list.innerHTML=data.map(item=>{
return<div class="card" data-detail="${item.id}"><div class="card-main"><div class="card-info"> <div class="card-title">${esc(item.title)}</div> <div class="card-meta" style="margin-top:3px"> ${(item.members||[]).filter(m=>isSixTONESMember(m)).map(m=><span class="tag ${memberClass(m)}" style="font-size:10px;padding:1px 7px;cursor:pointer" onclick="crossSearch('${esc(m)}')" title="${esc(m)}で絞り込む">{esc(m)}</span>`).join('')}
</div>
${isAdmin?`<div class="toggle-wrap"><label class="toggle"><input type="checkbox" ${item.exchange==='ok'?'checked':''} data-toggle="${item.id}"><span class="toggle-slider"></span></label><span class="toggle-label">{exchangeLabel(item.exchange)}</span></div>:''} </div><span class="exchange-badge ${exchangeClass(item.exchange)}">${exchangeLabel(item.exchange)}</span></div> ${isAdmin?<div class="card-actions"><button class="btn-sm btn-edit" data-edit="${item.id}">編集</button><button class="btn-sm btn-delete" data-delete="${item.id}">削除</button></div>:''}</div>;
}).join('');
list.querySelectorAll('[data-toggle]').forEach(inp=>inp.addEventListener('change',async(e)=>{
e.stopPropagation();
const all=await loadVideos();const item=all.find(d=>d.id===inp.dataset.toggle);
if(item){
item.exchange=inp.checked?'ok':'ng';
renderList();
try{await gasGet({action:'saveVideo2',data:encodeURIComponent(JSON.stringify({video:item,isNew:false})),id:''});}catch(e){}
}
}));
list.querySelectorAll('label.toggle').forEach(l=>l.addEventListener('click',e=>e.stopPropagation()));
list.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',(e)=>{e.stopPropagation();openEditModal(b.dataset.edit);}));
list.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click',(e)=>{e.stopPropagation();deleteItem(b.dataset.delete);}));
list.querySelectorAll('[data-detail]').forEach(card=>card.addEventListener('click',async()=>{
const data=await loadVideos();const item=data.find(d=>d.id===card.dataset.detail);if(item)openDetailModal(item);
}));
}
function esc(s){return String(s||'').replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"');}
function updateAdminUI(){
document.getElementById('modeBadge').textContent=isAdmin?'管理者モード':'閲覧モード';
document.getElementById('modeBadge').className='mode-badge '+(isAdmin?'admin':'view');
document.getElementById('authBtn').textContent=isAdmin?'🔓':'🔑';
document.getElementById('settingsBtn').style.display=isAdmin?'':'none';
document.getElementById('adminToolbar').classList.toggle('hidden',!isAdmin);
renderTabs();renderSubtabs();renderList();
}
let _tapCount=0,_tapTimer=null;
document.getElementById('headerTitle').addEventListener('click',()=>{
_tapCount++;
clearTimeout(_tapTimer);
_tapTimer=setTimeout(()=>{_tapCount=0;},1500);
if(_tapCount>=5){_tapCount=0;document.getElementById('authModal').classList.remove('hidden');}
});
document.getElementById('authBtn').addEventListener('click',()=>{
if(isAdmin){isAdmin=false;updateAdminUI();return;}
document.getElementById('authInput').value='';document.getElementById('authError').classList.add('hidden');
document.getElementById('authModal').classList.remove('hidden');setTimeout(()=>document.getElementById('authInput').focus(),50);
});
document.getElementById('authCancelBtn').addEventListener('click',()=>document.getElementById('authModal').classList.add('hidden'));
document.getElementById('authSubmitBtn').addEventListener('click',()=>{
if(document.getElementById('authInput').value===ADMIN_PW){isAdmin=true;document.getElementById('authModal').classList.add('hidden');updateAdminUI();}
else document.getElementById('authError').classList.remove('hidden');
});
document.getElementById('authInput').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('authSubmitBtn').click();});
function openDetailModal(item){
document.getElementById('detailTitle').textContent=item.title;
document.getElementById('detailMembers').innerHTML=(item.members||[]).map(m=><span class="tag ${memberClass(m)}">${esc(m)}</span>).join('');
document.getElementById('detailExchange').innerHTML=<span class="exchange-badge ${exchangeClass(item.exchange)}">${exchangeLabel(item.exchange)}</span>;
const schedules=formatSchedules(item.dates);
const schDiv=document.getElementById('detailSchedules');
if(schedules.length){
schDiv.innerHTML='<div style="font-size:12px;font-weight:600;color:var(--gray);margin-bottom:6px">配信,放送日</div>'+
schedules.map(s=><div style="background:var(--pink-pale);border-radius:8px;padding:8px 10px;margin-bottom:6px"> <div style="font-size:13px;font-weight:600;color:var(--pink-dark)">${esc(s.date)}</div> ${s.times&&s.times.length?<div style="font-size:12px;color:var(--gray);margin-top:3px">${s.times.map(t=>esc(t)).join('　/　')}</div>:''} </div>).join('');
}else schDiv.innerHTML='';
const tracksDiv=document.getElementById('detailTracks')||document.createElement('div');
tracksDiv.id='detailTracks';
const tracks=item.tracks?JSON.parse(item.tracks||'[]'):[];
if(tracks.length){
let sectionsHtml = '';
let currentSec = null;
let secItems = [];
const flushSec = () => {
if(secItems.length===0) return;
const secHeader = currentSec ? <div style="font-size:11px;font-weight:700;color:var(--pink-dark);margin:8px 0 4px;border-bottom:1px solid var(--pink-light);padding-bottom:2px">${esc(currentSec)}</div> : '';
sectionsHtml += secHeader + secItems.join('');
secItems = [];
};
tracks.forEach(t=>{
const title=typeof t==='string'?t:t.title;
const sec=typeof t==='string'?'':t.section||'';
if(sec !== currentSec) { flushSec(); currentSec=sec; }
secItems.push(<div style="padding:4px 0;border-bottom:1px solid var(--border);font-size:13px">${esc(title)}</div>);
});
flushSec();
tracksDiv.innerHTML='<div style="font-size:12px;font-weight:600;color:var(--gray);margin-bottom:6px">収録内容</div>'+
<div style="background:var(--gray-light);border-radius:8px;padding:6px 10px">${sectionsHtml}</div>;
}else tracksDiv.innerHTML='';
document.getElementById('detailModal').classList.remove('hidden');
}
document.getElementById('detailCloseBtn').addEventListener('click',()=>document.getElementById('detailModal').classList.add('hidden'));
function openSettingsModal(){
cfg=loadConfig();
document.getElementById('genreManageList').innerHTML=cfg.genres.filter(g=>g!=='すべて').map((g,i)=>{
const realIdx=i+1;
return <div class="manage-item">${esc(g)}<button class="btn-remove" data-gi="${realIdx}">削除</button></div>;
}).join('');
document.getElementById('genreManageList').querySelectorAll('[data-gi]').forEach(b=>b.addEventListener('click',()=>{
const idx=parseInt(b.dataset.gi);cfg.genres.splice(idx,1);saveConfig(cfg);openSettingsModal();renderTabs();renderSubtabs();
}));
document.getElementById('memberManageList').innerHTML=cfg.members.map((m,i)=><div class="manage-item">${esc(m)}<button class="btn-remove" data-mi="${i}">削除</button></div>).join('');
document.getElementById('memberManageList').querySelectorAll('[data-mi]').forEach(b=>b.addEventListener('click',()=>{
cfg.members.splice(parseInt(b.dataset.mi),1);saveConfig(cfg);openSettingsModal();
}));
document.getElementById('settingsModal').classList.remove('hidden');
}
document.getElementById('settingsBtn').addEventListener('click',()=>openSettingsModal());
document.getElementById('settingsCloseBtn').addEventListener('click',()=>document.getElementById('settingsModal').classList.add('hidden'));
function openEditModal(id=null){
editingId=id;
document.getElementById('editModal').classList.remove('hidden');
}
document.getElementById('editCancelBtn').addEventListener('click',()=>document.getElementById('editModal').classList.add('hidden'));
async function deleteItem(id){
if(!confirm('削除しますか？'))return;
document.getElementById('cardList').innerHTML='<div class="loading">削除中…</div>';
try{
await gasGet({action:'deleteVideo2',data:'',id});
}catch(e){}
cachedVideos=null;
await loadVideos(true);
renderList();
}
document.getElementById('sortSelect').addEventListener('change',e=>{sortOrder=e.target.value;renderList();});
cfg=loadConfig();
(async()=>{
await loadFullConfigFromServer();
renderTabs();renderSubtabs();renderFilterBar();renderList();
})();
</script>
</body>
</html>
